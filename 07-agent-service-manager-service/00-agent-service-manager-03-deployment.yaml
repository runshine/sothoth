apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service-manager
  namespace: sothothv2-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: agent-service-manager
  template:
    metadata:
      labels:
        name: agent-service-manager
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: agent-service-manager
        image: ghcr.io/runshine/agent-service-manager:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: MYSQL_SERVER_ADDRESS
            value: mysql+pymysql://agent-service-manager:Huawei12%23%24@mysql.sothothv2-ns.svc.cluster.local/agent-service-manager?ssl=false
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
          - name: agent-service-manager-nginx-config
            mountPath: /app/config.json
            subPath: config.json
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

      - name: nginx
        image: ghcr.io/runshine/agent-service-manager-frontend:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 80
        volumeMounts:
          - name: agent-service-manager-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # 资源限制
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

      volumes:
      - name: agent-service-manager-nginx-config
        configMap:
          name: agent-service-manager-nginx-config
          items:
            - key: nginx.conf
              path: nginx.conf
            - key: config.json
              path: config.json