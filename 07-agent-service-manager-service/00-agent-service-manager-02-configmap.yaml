# nginx-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-service-manager-nginx-config
  namespace: sothothv2-ns
data:
  config.json: |
    {
      "port": 8080,
      "host": "0.0.0.0",
      "debug": true,
      "secret_key": "dev-secret-key-change-in-production",
      "services_root": "./services",
      "templates_root": "./templates",
      "database": {
        "type": "mysql",
        "host": "mysql.sothothv2-ns.svc.cluster.local",
        "port": 3306,
        "user": "agent-service-manager",
        "password": "Huawei12#$",
        "database": "agent-service-manager"
      },
      "redis_url": "redis://redis.sothothv2-ns.svc.cluster.local:6379/agent-service-manager",
      "redis_enabled": true,
      "nacos_url": "http://nacos.sothothv2-ns.svc.cluster.local:8848",
      "nacos_namespace": "public",
      "nacos_username": "nacos",
      "nacos_password": "nacos",
      "agent_api_port": 11197,
      "agent_auth_token": "your_secure_token_here",
      "refresh_interval": 30,
      "max_workers": 5,
      "upload_max_size": 104857600,
      "token_expiration": 86400,
      "log_level": "DEBUG",
      "log_file": "/tmp/webapi_server.log",
      "pod_id": "local-dev",
      "lock_timeout": 30,
      "max_task_logs": 1000,
      "task_log_retention_days": 7
    }
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
    
        # 定义上游API服务
        upstream api_backend {
            server 127.0.0.1:8080;
            keepalive 32;
        }
    
        # 日志格式
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"'
                        ' proxy_to: "$upstream_addr"';
    
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
    
        # 开启gzip压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
    
            # 修正：正确的指令名称是 client_max_body_size
            client_max_body_size 500m;
    
            # API请求代理到8080端口
            location /api/ {
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
    

                proxy_read_timeout 600s;  # 30分钟
                proxy_send_timeout 600s;
            
                # 文件上传可能需要更大的client body buffer
                client_max_body_size 2G;
                client_body_buffer_size 1M;
    
                # 关闭缓冲
                proxy_buffering on;
                proxy_request_buffering on;
            }
  
    
            # 处理React Router的路由问题（主应用）
            location / {
                try_files $uri $uri/ /index.html;
            }
    
            # 缓存静态资源
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
    
            # 禁止访问隐藏文件
            location ~ /\. {
                deny all;
            }
    
            # 健康检查端点
            location /healthz {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }