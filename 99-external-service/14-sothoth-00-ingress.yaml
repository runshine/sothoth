apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sothoth-ingress
  namespace: sothoth
  annotations:
    # 启用 HTTPS 重定向（如果需要）
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # 如果需要 websocket 支持
    nginx.ingress.kubernetes.io/websocket-services: "sothoth-server"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # CORS 配置
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT,GET,POST,OPTIONS,DELETE,PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type,Accept,Authorization,X-Requested-With,Origin"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sothoth.sothothv2.com
      secretName: wildcard-sothothv2.com-tls
  rules:
    - host: sothoth.sothothv2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sothoth-server
                port:
                  number: 80