# 创建三个 Service 和对应的 Endpoints
apiVersion: v1
kind: Service
metadata:
  name: external-auth
  namespace: secflow-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 10000
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-auth
  namespace: secflow-ns
subsets:
  - addresses:
      - ip: 192.168.12.44
    ports:
      - port: 10000
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: external-project
  namespace: secflow-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 10001
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-project
  namespace: secflow-ns
subsets:
  - addresses:
      - ip: 192.168.12.44
    ports:
      - port: 10001
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: external-resource
  namespace: secflow-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 10002
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-resource
  namespace: secflow-ns
subsets:
  - addresses:
      - ip: 192.168.12.44
    ports:
      - port: 10002
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: external-menu
  namespace: secflow-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 10003
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-menu
  namespace: secflow-ns
subsets:
  - addresses:
      - ip: 192.168.12.44
    ports:
      - port: 10003
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: external-vscode
  namespace: secflow-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 10004
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-vscode
  namespace: secflow-ns
subsets:
  - addresses:
      - ip: 192.168.12.44
    ports:
      - port: 10004
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: static-binary-proxy
  namespace: secflow-ns  # 与 Ingress 相同的命名空间
spec:
  type: ExternalName
  externalName: static-binary.sothothv2-ns.svc.cluster.local
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http

---


apiVersion: v1
kind: Service
metadata:
  name: agent-service-manager-proxy
  namespace: secflow-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: agent-service-manager-proxy
  namespace: secflow-ns
subsets:
  - addresses:
      - ip: 192.168.12.44
    ports:
      - port: 8080
        protocol: TCP



---
apiVersion: v1
kind: Service
metadata:
  name: client-script-proxy
  namespace: secflow-ns  # 与 Ingress 相同的命名空间
spec:
  type: ExternalName
  externalName: client-script.sothothv2-ns.svc.cluster.local
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secflow-ingress
  namespace: secflow-ns
  annotations:
    # 只使用安全的注解
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/location-snippet: |
          if ($uri ~* "^/api/deploy-script") {
            rewrite ^/api/deploy-script/(.*)$ /script/$1 break;
          }
spec:
  ingressClassName: nginx
  rules:
  - host: secflow.sothothv2.com
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: external-auth
            port:
              number: 80

      - path: /api/agent
        pathType: Prefix
        backend:
          service:
            name: agent-service-manager-proxy
            port:
              number: 80

      - path: /api/project
        pathType: Prefix
        backend:
          service:
            name: external-project
            port:
              number: 80
      - path: /api/resource
        pathType: Prefix
        backend:
          service:
            name: external-resource
            port:
              number: 80
      - path: /api/menu
        pathType: Prefix
        backend:
          service:
            name: external-menu
            port:
              number: 80
      - path: /api/app/code-server
        pathType: Prefix
        backend:
          service:
            name: external-vscode
            port:
              number: 80
      - path: /api/packages
        pathType: Prefix
        backend:
          service:
            name: static-binary-proxy
            port:
              number: 80
      - path: /api/deploy-script
        pathType: Prefix
        backend:
          service:
            name: client-script-proxy
            port:
              number: 80
