apiVersion: v1
kind: Service
metadata:
  name: mysql-external
  namespace: sothothv2-ns
  annotations:
    metallb.io/allow-shared-ip: "shared-192.168.12.90"   # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    app: mysql
    tier: mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql-external
  loadBalancerIP: "${METALLB_SHARED_LB_IP}"  # 必须在static-ips-pool范围内
