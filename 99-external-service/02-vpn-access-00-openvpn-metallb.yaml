apiVersion: v1
kind: Service
metadata:
  name: vpn-access-openvpn-udp
  namespace: sothothv2-ns
  annotations:
    metallb.io/allow-shared-ip: "shared-192.168.12.90"   # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    app: vpn-access-openvpn-udp
  ports:
    - port: 11194
      targetPort: 11194
      protocol: UDP
  # 关键：在spec中指定loadBalancerIP
  loadBalancerIP: "172.31.30.100"  # 必须在static-ips-pool范围内

---
apiVersion: v1
kind: Service
metadata:
  name: vpn-access-openvpn-tcp
  namespace: sothothv2-ns
  annotations:
    metallb.io/allow-shared-ip: "shared-192.168.12.90"   # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    app: vpn-access-openvpn-tcp
  ports:
    - port: 11194
      targetPort: 11194
      protocol: TCP
  # 关键：在spec中指定loadBalancerIP
  loadBalancerIP: "172.31.30.100"  # 必须在static-ips-pool范围内
