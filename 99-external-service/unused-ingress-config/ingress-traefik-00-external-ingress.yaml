apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-api-access-traefik-ingress
  namespace: sothothv2-ns
  annotations:
    # Traefik 特定的注解
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # 请求体大小限制
    traefik.ingress.kubernetes.io/request-buffering: "true"

spec:
  ingressClassName: traefik  # ← 使用新的字段
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: static-binary-service
                port:
                  number: 8081
          - path: /packages
            pathType: Prefix
            backend:
              service:
                name: static-binary-service
                port:
                  number: 8081
          - path: /script
            pathType: Prefix
            backend:
              service:
                name: client-script-service
                port:
                  number: 8082