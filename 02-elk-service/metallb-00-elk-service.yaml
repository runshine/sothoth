apiVersion: v1
kind: Service
metadata:
  name: elk
  namespace: sothothv2-ns
  annotations:
    metallb.universe.tf/allow-shared-ip: "true"  # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    common.k8s.elastic.co/type: "kibana"
    kibana.k8s.elastic.co/name: "kibana"
  ports:
    - port: 5601
      targetPort: 5601
      protocol: TCP
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内