apiVersion: v1
kind: Service
metadata:
  name: nacos-registry-service
  namespace: sothothv2-ns
  annotations:
    metallb.universe.tf/allow-shared-ip: "true"  # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    app: nacos
  ports:
    - port: 8849
      targetPort: 8080
      protocol: TCP
      name: nacos-registry-8080
    - port: 8848
      targetPort: 8848
      protocol: TCP
      name: nacos-registry-8848
    - port: 7848
      targetPort: 7848
      protocol: TCP
      name: nacos-registry-7848
    - port: 9848
      targetPort: 9848
      protocol: TCP
      name: nacos-registry-9848
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内