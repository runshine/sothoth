apiVersion: v1
kind: Service
metadata:
  name: nacos-registry-service
  namespace: sothothv2-ns
  annotations:
    metallb.universe.tf/allow-shared-ip: "true"  # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    name: "nacos-registry"
  ports:
    - port: 8848
      targetPort: 8848
      protocol: TCP
      name: nacos-registry
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内