apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: sothothv2-ns
spec:
  type: ClusterIP
  selector:
    app: nacos
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: nacos-8080
    - port: 8848
      targetPort: 8848
      protocol: TCP
      name: nacos-8848
    - port: 7848
      targetPort: 7848
      protocol: TCP
      name: nacos-7848
    - port: 9848
      targetPort: 9848
      protocol: TCP
      name: nacos-9848
