# metallb-l2-advertisement.yaml
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: production-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - production-pool
    - static-ips-pool
  # 可选：指定在哪些节点上通告
  nodeSelectors:
    - matchLabels:
        node-role.kubernetes.io/control-plane: "true"
  #interfaces:
  #  - eth0
