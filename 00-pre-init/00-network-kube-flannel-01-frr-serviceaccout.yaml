# frr-serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frr
  namespace: kube-flannel  # 注意：在 kube-system 命名空间

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frr-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frr-cluster-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frr-cluster-role
subjects:
  - kind: ServiceAccount
    name: frr
    namespace: kube-flannel  # 这里也要指定命名空间