# metallb-ip-pool.yaml
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: production-pool
  namespace: metallb-system
spec:
  addresses:
    - ${METALLB_SHARED_POOL_RANGE}  # IP地址范围
  autoAssign: false               # 禁用自动分配，完全手动控制
  avoidBuggyIPs: true             # 避免有问题的IP（如网络/广播地址）

---
# 创建第二个池用于特定服务的固定IP
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: static-ips-pool
  namespace: metallb-system
spec:
  addresses:
    - ${METALLB_STATIC_POOL_RANGE}    # 专门用于固定IP的范围
  autoAssign: true               # 必须设置为false才能手动分配
