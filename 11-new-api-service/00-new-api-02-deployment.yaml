apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: sothothv2-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: new-api
  template:
    metadata:
      labels:
        name: new-api
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: new-api
        image: calciumion/new-api:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: 'SQL_DSN'
            value: 'new-api:Huawei12#$@tcp(mysql:3306)/new-api'
          - name: 'REDIS_CONN_STRING'
            value: 'redis://redis'
          - name: 'TZ'
            value: 'Asia/Shanghai'
          - name: 'ERROR_LOG_ENABLED'
            value: 'true'
          - name: 'BATCH_UPDATE_ENABLED'
            value: 'true'
          - name: 'STREAMING_TIMEOUT'
            value: '300'
          - name: 'SESSION_SECRET'
            value: 'random_stringrandom_stringrandom_string'
          - name: 'SYNC_FREQUENCY'
            value: '60'

        ports:
          - containerPort: 3000
        args: ['--log-dir','/tmp/logs']
        volumeMounts:
          - name: new-api-nfs-storage-pvc
            mountPath: /data
        livenessProbe:
          httpGet:
            path: /api/status
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 15
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 15
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 10
        # 资源限制
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

      volumes:
      - name: new-api-nfs-storage-pvc
        persistentVolumeClaim:
          claimName: new-api-nfs-storage-pvc

