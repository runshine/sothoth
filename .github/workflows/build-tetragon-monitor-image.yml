name: build-tetragon-monitor-image
on:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-tetragon-monitor-image.yml
      - 100-agent-service-image/02-tetragon-monitor/**
jobs:
  build-tetragon-monitor-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tetragon-monitor-image
        run: |
          cd 100-agent-service-image/02-tetragon-monitor/ && bash build-multi-arch.sh