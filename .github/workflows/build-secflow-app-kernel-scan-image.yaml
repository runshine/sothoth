name: build-secflow-app-kernel-scan-image

on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-app-kernel-scan-image.yaml
      - 13-secflow-service/image_build/secflow-app-kernel-scan/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${MAIN_REPO_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Android tool cache
        uses: actions/cache@v4
        with:
          path: 13-secflow-service/image_build/secflow-app-kernel-scan/tools
          key: secflow-app-kernel-scan-android-tools-v3-${{ hashFiles('13-secflow-service/image_build/secflow-app-kernel-scan/scripts/prepare-android-tools.sh') }}
          restore-keys: |
            secflow-app-kernel-scan-android-tools-v3-

      - name: Prepare Android tool cache
        run: |
          bash 13-secflow-service/image_build/secflow-app-kernel-scan/scripts/prepare-android-tools.sh
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build amd64 image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --file 13-secflow-service/image_build/secflow-app-kernel-scan/Dockerfile \
            --tag ghcr.io/runshine/secflow-app-kernel-scan:latest \
            --tag ghcr.io/runshine/secflow-app-kernel-scan:${{ needs.prepare.outputs.date_tag }} \
            --tag ghcr.io/runshine/secflow-app-kernel-scan:amd64-latest \
            --tag ghcr.io/runshine/secflow-app-kernel-scan:amd64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-app-kernel-scan/

      - name: Push amd64 image
        run: |
          docker push ghcr.io/runshine/secflow-app-kernel-scan:latest
          docker push ghcr.io/runshine/secflow-app-kernel-scan:${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/secflow-app-kernel-scan:amd64-latest
          docker push ghcr.io/runshine/secflow-app-kernel-scan:amd64-${{ needs.prepare.outputs.date_tag }}
