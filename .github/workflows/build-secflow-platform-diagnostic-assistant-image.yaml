name: build-secflow-platform-diagnostic-assistant-image

on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-platform-diagnostic-assistant-image.yaml
      - 13-secflow-service/image_build/secflow-platform-diagnostic-assistant/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${MAIN_REPO_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build amd64 image
        run: |
          docker build \
            --file 13-secflow-service/image_build/secflow-platform-diagnostic-assistant/Dockerfile \
            --tag ghcr.io/runshine/secflow-platform-diagnostic-assistant:amd64-latest \
            --tag ghcr.io/runshine/secflow-platform-diagnostic-assistant:amd64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-platform-diagnostic-assistant/

      - name: Push amd64 image
        run: |
          docker push ghcr.io/runshine/secflow-platform-diagnostic-assistant:amd64-latest
          docker push ghcr.io/runshine/secflow-platform-diagnostic-assistant:amd64-${{ needs.prepare.outputs.date_tag }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build arm64 image
        run: |
          docker build \
            --file 13-secflow-service/image_build/secflow-platform-diagnostic-assistant/Dockerfile \
            --tag ghcr.io/runshine/secflow-platform-diagnostic-assistant:arm64-latest \
            --tag ghcr.io/runshine/secflow-platform-diagnostic-assistant:arm64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-platform-diagnostic-assistant/

      - name: Push arm64 image
        run: |
          docker push ghcr.io/runshine/secflow-platform-diagnostic-assistant:arm64-latest
          docker push ghcr.io/runshine/secflow-platform-diagnostic-assistant:arm64-${{ needs.prepare.outputs.date_tag }}

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Create and push Docker Hub manifests
        run: |
          echo "Docker Hub manifest push disabled"

      - name: Create and push GHCR manifests
        run: |
          docker manifest create ghcr.io/runshine/secflow-platform-diagnostic-assistant:latest \
            ghcr.io/runshine/secflow-platform-diagnostic-assistant:amd64-latest \
            ghcr.io/runshine/secflow-platform-diagnostic-assistant:arm64-latest
          docker manifest create ghcr.io/runshine/secflow-platform-diagnostic-assistant:${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/runshine/secflow-platform-diagnostic-assistant:amd64-${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/runshine/secflow-platform-diagnostic-assistant:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/runshine/secflow-platform-diagnostic-assistant:latest
          docker manifest push ghcr.io/runshine/secflow-platform-diagnostic-assistant:${{ needs.prepare.outputs.date_tag }}
