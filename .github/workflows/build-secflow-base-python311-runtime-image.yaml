name: build-secflow-base-python311-runtime-image

on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-base-python311-runtime-image.yaml
      - 13-secflow-service/image_build/secflow-base-python311-runtime/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${MAIN_REPO_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./13-secflow-service/image_build/secflow-base-python311-runtime
          file: ./13-secflow-service/image_build/secflow-base-python311-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }}
          cache-from: type=gha,scope=secflow-base-python311-runtime
          cache-to: type=gha,scope=secflow-base-python311-runtime,mode=max
          tags: |
            ghcr.io/runshine/secflow-base-python311-runtime:latest
            ghcr.io/runshine/secflow-base-python311-runtime:20260602
            ghcr.io/runshine/secflow-base-python311-runtime:${{ needs.prepare.outputs.date_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/secflow-base-python311-runtime:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/secflow-base-python311-runtime:20260602
            ${{ secrets.DOCKERHUB_USERNAME }}/secflow-base-python311-runtime:${{ needs.prepare.outputs.date_tag }}
