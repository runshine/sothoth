name: build-secflow-agent-service-agent-helper-image
on:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-agent-service-agent-helper-image.yaml
      - 100-agent-service-image/01-secflow-agent-service-agent-helper/**
jobs:
  build-secflow-agent-service-agent-helper-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image on native runner
        run: |
          docker build \
            -f 100-agent-service-image/01-secflow-agent-service-agent-helper/Dockerfile \
            -t runshine0819/secflow-agent-service-agent-helper:latest-${{ matrix.arch }} \
            -t ghcr.io/runshine/secflow-agent-service-agent-helper:latest-${{ matrix.arch }} \
            -t runshine0819/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-${{ matrix.arch }} \
            -t ghcr.io/runshine/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-${{ matrix.arch }} \
            100-agent-service-image/01-secflow-agent-service-agent-helper/

      - name: Push arch images
        run: |
          docker push runshine0819/secflow-agent-service-agent-helper:latest-${{ matrix.arch }}
          docker push ghcr.io/runshine/secflow-agent-service-agent-helper:latest-${{ matrix.arch }}
          docker push runshine0819/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-${{ matrix.arch }}
          docker push ghcr.io/runshine/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-${{ matrix.arch }}

  publish-multiarch-manifest:
    runs-on: ubuntu-latest
    needs: build-secflow-agent-service-agent-helper-image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push Docker Hub manifests
        run: |
          docker manifest create runshine0819/secflow-agent-service-agent-helper:latest \
            runshine0819/secflow-agent-service-agent-helper:latest-amd64 \
            runshine0819/secflow-agent-service-agent-helper:latest-arm64
          docker manifest create runshine0819/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }} \
            runshine0819/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-amd64 \
            runshine0819/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-arm64
          docker manifest push runshine0819/secflow-agent-service-agent-helper:latest
          docker manifest push runshine0819/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}

      - name: Create and push GHCR manifests
        run: |
          docker manifest create ghcr.io/runshine/secflow-agent-service-agent-helper:latest \
            ghcr.io/runshine/secflow-agent-service-agent-helper:latest-amd64 \
            ghcr.io/runshine/secflow-agent-service-agent-helper:latest-arm64
          docker manifest create ghcr.io/runshine/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }} \
            ghcr.io/runshine/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-amd64 \
            ghcr.io/runshine/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}-arm64
          docker manifest push ghcr.io/runshine/secflow-agent-service-agent-helper:latest
          docker manifest push ghcr.io/runshine/secflow-agent-service-agent-helper:${{ steps.date.outputs.date_tag }}
