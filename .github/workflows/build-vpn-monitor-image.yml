name: build-vpn-monitor-image
on:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-vpn-monitor-image.yml
      - 02-vpn-access-service/image_build/vpn-monitor/**
jobs:
  build-vpn-monitor-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push vpn-monitor-image
        uses: docker/build-push-action@v5
        with:
          context: 02-vpn-access-service/image_build/vpn-monitor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            runshine0819/vpn-monitor:latest
            ghcr.io/runshine/vpn-monitor:latest
          file: 02-vpn-access-service/image_build/vpn-monitor/Dockerfile

