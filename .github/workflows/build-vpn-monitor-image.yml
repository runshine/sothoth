name: build-vpn-monitor-image
on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-vpn-monitor-image.yml
      - 02-vpn-access-service/image_build/vpn-monitor/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build amd64 image
        run: |
          docker build \
            --file 02-vpn-access-service/image_build/vpn-monitor/Dockerfile \
            --tag ghcr.io/runshine/vpn-monitor:amd64-latest \
            --tag ghcr.io/runshine/vpn-monitor:amd64-${{ needs.prepare.outputs.date_tag }} \
            02-vpn-access-service/image_build/vpn-monitor

      - name: Push amd64 image
        run: |
          # docker push runshine0819/vpn-monitor:amd64-latest
          docker push ghcr.io/runshine/vpn-monitor:amd64-latest
          # docker push runshine0819/vpn-monitor:amd64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/vpn-monitor:amd64-${{ needs.prepare.outputs.date_tag }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build arm64 image
        run: |
          docker build \
            --file 02-vpn-access-service/image_build/vpn-monitor/Dockerfile \
            --tag ghcr.io/runshine/vpn-monitor:arm64-latest \
            --tag ghcr.io/runshine/vpn-monitor:arm64-${{ needs.prepare.outputs.date_tag }} \
            02-vpn-access-service/image_build/vpn-monitor

      - name: Push arm64 image
        run: |
          # docker push runshine0819/vpn-monitor:arm64-latest
          docker push ghcr.io/runshine/vpn-monitor:arm64-latest
          # docker push runshine0819/vpn-monitor:arm64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/vpn-monitor:arm64-${{ needs.prepare.outputs.date_tag }}

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Create and push multi-arch manifest (latest)
        run: |
          # docker manifest create runshine0819/vpn-monitor:latest \
            # --amend runshine0819/vpn-monitor:amd64-latest \
            # --amend runshine0819/vpn-monitor:arm64-latest
          docker manifest create ghcr.io/runshine/vpn-monitor:latest \
            --amend ghcr.io/runshine/vpn-monitor:amd64-latest \
            --amend ghcr.io/runshine/vpn-monitor:arm64-latest
          # docker manifest push runshine0819/vpn-monitor:latest
          docker manifest push ghcr.io/runshine/vpn-monitor:latest

      - name: Create and push multi-arch manifest (date tag)
        run: |
          # docker manifest create runshine0819/vpn-monitor:${{ needs.prepare.outputs.date_tag }} \
            # --amend runshine0819/vpn-monitor:amd64-${{ needs.prepare.outputs.date_tag }} \
            # --amend runshine0819/vpn-monitor:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest create ghcr.io/runshine/vpn-monitor:${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/vpn-monitor:amd64-${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/vpn-monitor:arm64-${{ needs.prepare.outputs.date_tag }}
          # docker manifest push runshine0819/vpn-monitor:${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/runshine/vpn-monitor:${{ needs.prepare.outputs.date_tag }}
