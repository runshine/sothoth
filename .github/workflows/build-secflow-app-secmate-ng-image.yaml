name: build-secflow-app-secmate-ng-image.
on:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-app-secmate-ng-image.yml
      - 13-secflow-service/image_build/secflow-app-secmate-ng/**
jobs:
  build-secflow-app-secmate-ng-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push build-secflow-app-secmate-ng-image
        uses: docker/build-push-action@v5
        with:
          context: 13-secflow-service/image_build/secflow-app-secmate-ng/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            runshine0819/secflow-app-secmate-ng:latest
            ghcr.io/runshine/secflow-app-secmate-ng:latest
          file: 13-secflow-service/image_build/secflow-app-secmate-ng/Dockerfile