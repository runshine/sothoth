name: build-vscode-web-manager-image
on:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-vscode-web-manager-image.yml
      - 10-vscode-web-manager-service/image_build/vscode-web-manager/**
jobs:
  build-vscode-web-manager-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push vscode-web-manager-image
        uses: docker/build-push-action@v5
        with:
          context: ./10-vscode-web-manager-service/image_build/vscode-web-manager/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            runshine0819/vscode-web-manager:latest
            ghcr.io/runshine/vscode-web-manager:latest
          file: ./10-vscode-web-manager-service/image_build/vscode-web-manager/Dockerfile
