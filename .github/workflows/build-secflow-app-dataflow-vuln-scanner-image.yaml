name: build-secflow-app-dataflow-vuln-scanner-image
on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      # This service is tracked as a submodule in the main repo.
      - .github/workflows/build-secflow-app-dataflow-vuln-scanner-image.yaml
      - 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner
      - 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/**
      - 13-secflow-service/image_build/secflow-base-python311-runtime/**
      - 13-secflow-service/image_build/secflow-base-pi-agent-runtime/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${MAIN_REPO_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push amd64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --build-arg SECFLOW_PI_AGENT_RUNTIME_IMAGE=ghcr.io/runshine/secflow-base-pi-agent-runtime:20260602 \
            --cache-from type=gha,scope=secflow-app-dataflow-vuln-scanner-amd64 \
            --cache-to type=gha,scope=secflow-app-dataflow-vuln-scanner-amd64,mode=max \
            --file 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/Dockerfile \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-latest \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }} \
            --push \
            13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --build-arg SECFLOW_PI_AGENT_RUNTIME_IMAGE=ghcr.io/runshine/secflow-base-pi-agent-runtime:20260602 \
            --cache-from type=gha,scope=secflow-app-dataflow-vuln-scanner-arm64 \
            --cache-to type=gha,scope=secflow-app-dataflow-vuln-scanner-arm64,mode=max \
            --file 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/Dockerfile \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-latest \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }} \
            --push \
            13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker manifest create ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:latest \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-latest \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-latest
          docker manifest push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:latest

      - name: Create and push multi-arch manifest (date tag)
        run: |
          docker manifest create ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:${{ needs.prepare.outputs.date_tag }}
