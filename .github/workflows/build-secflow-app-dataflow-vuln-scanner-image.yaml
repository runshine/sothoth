name: build-secflow-app-dataflow-vuln-scanner-image
on:
  push:
    branches:
      - 'v2.*'
    paths:
      # This service is tracked as a submodule in the main repo.
      - .github/workflows/build-secflow-app-dataflow-vuln-scanner-image.yaml
      - 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner
      - 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image
        run: |
          docker build \
            --file 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/Dockerfile \
            --tag runshine0819/secflow-app-dataflow-vuln-scanner:amd64-latest \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-latest \
            --tag runshine0819/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }} \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/

      - name: Push amd64 image
        run: |
          docker push runshine0819/secflow-app-dataflow-vuln-scanner:amd64-latest
          docker push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-latest
          docker push runshine0819/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 image
        run: |
          docker build \
            --file 13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/Dockerfile \
            --tag runshine0819/secflow-app-dataflow-vuln-scanner:arm64-latest \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-latest \
            --tag runshine0819/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }} \
            --tag ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-app-dataflow-vuln-scanner/

      - name: Push arm64 image
        run: |
          docker push runshine0819/secflow-app-dataflow-vuln-scanner:arm64-latest
          docker push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-latest
          docker push runshine0819/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }}

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker manifest create runshine0819/secflow-app-dataflow-vuln-scanner:latest \
            --amend runshine0819/secflow-app-dataflow-vuln-scanner:amd64-latest \
            --amend runshine0819/secflow-app-dataflow-vuln-scanner:arm64-latest
          docker manifest create ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:latest \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-latest \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-latest
          docker manifest push runshine0819/secflow-app-dataflow-vuln-scanner:latest
          docker manifest push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:latest

      - name: Create and push multi-arch manifest (date tag)
        run: |
          docker manifest create runshine0819/secflow-app-dataflow-vuln-scanner:${{ needs.prepare.outputs.date_tag }} \
            --amend runshine0819/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }} \
            --amend runshine0819/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest create ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:amd64-${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest push runshine0819/secflow-app-dataflow-vuln-scanner:${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:${{ needs.prepare.outputs.date_tag }}
