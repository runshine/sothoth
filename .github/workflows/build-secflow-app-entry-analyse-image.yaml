name: build-secflow-app-entry-analyse-image

on:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-app-entry-analyse-image.yaml
      - 13-secflow-service/image_build/secflow-app-entry-analyse
      - 13-secflow-service/image_build/secflow-app-entry-analyse/**
      - 13-secflow-service/00-secflow-104-**
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sothoth (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout entry_analyse submodule content
        run: |
          SUBMODULE_SHA=$(git ls-tree HEAD 13-secflow-service/image_build/secflow-app-entry-analyse | awk '{print $3}')
          echo "Submodule SHA: $SUBMODULE_SHA"
          git clone https://github.com/ict-bin/entry_analyse.git \
            13-secflow-service/image_build/secflow-app-entry-analyse
          cd 13-secflow-service/image_build/secflow-app-entry-analyse
          git checkout $SUBMODULE_SHA

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: 13-secflow-service/image_build/secflow-app-entry-analyse
          file: 13-secflow-service/image_build/secflow-app-entry-analyse/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/runshine/secflow-app-entry-analyse:latest
            ghcr.io/runshine/secflow-app-entry-analyse:${{ needs.prepare.outputs.date_tag }}
