name: build-secflow-agent-service-tetragon-monitor-image
on:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-agent-service-tetragon-monitor-image.yaml
      - 100-agent-service-image/02-secflow-agent-service-tetragon-monitor/**

jobs:
  build-secflow-agent-service-tetragon-monitor-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image on native runner
        run: |
          DOCKER_BUILDKIT=0 docker build \
            -f 100-agent-service-image/02-secflow-agent-service-tetragon-monitor/Dockerfile \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            -t ghcr.io/runshine/secflow-agent-service-tetragon-monitor:latest-${{ matrix.arch }} \
            -t ghcr.io/runshine/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}-${{ matrix.arch }} \
            100-agent-service-image/02-secflow-agent-service-tetragon-monitor/

      - name: Push arch images
        run: |
          # docker push runshine0819/secflow-agent-service-tetragon-monitor:latest-${{ matrix.arch }}
          docker push ghcr.io/runshine/secflow-agent-service-tetragon-monitor:latest-${{ matrix.arch }}
          # docker push runshine0819/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}-${{ matrix.arch }}
          docker push ghcr.io/runshine/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}-${{ matrix.arch }}

  publish-multiarch-manifest:
    runs-on: ubuntu-latest
    needs: build-secflow-agent-service-tetragon-monitor-image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push Docker Hub manifests
        run: |
          # docker manifest create runshine0819/secflow-agent-service-tetragon-monitor:latest \
            # runshine0819/secflow-agent-service-tetragon-monitor:latest-amd64 \
            # runshine0819/secflow-agent-service-tetragon-monitor:latest-arm64
          # docker manifest create runshine0819/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }} \
            # runshine0819/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}-amd64 \
            # runshine0819/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}-arm64
          # docker manifest push runshine0819/secflow-agent-service-tetragon-monitor:latest
          # docker manifest push runshine0819/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}

      - name: Create and push GHCR manifests
        run: |
          docker manifest create ghcr.io/runshine/secflow-agent-service-tetragon-monitor:latest \
            ghcr.io/runshine/secflow-agent-service-tetragon-monitor:latest-amd64 \
            ghcr.io/runshine/secflow-agent-service-tetragon-monitor:latest-arm64
          docker manifest create ghcr.io/runshine/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }} \
            ghcr.io/runshine/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}-amd64 \
            ghcr.io/runshine/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}-arm64
          docker manifest push ghcr.io/runshine/secflow-agent-service-tetragon-monitor:latest
          docker manifest push ghcr.io/runshine/secflow-agent-service-tetragon-monitor:${{ steps.date.outputs.date_tag }}
