name: build-secflow-platform-system-analysis-image.
on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-platform-system-analysis-image.yaml
      - 13-secflow-service/image_build/secflow-platform-system-analysis/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          echo "date_tag=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build amd64 image
        run: |
          docker build \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --file 13-secflow-service/image_build/secflow-platform-system-analysis/Dockerfile \
            --tag ghcr.io/runshine/secflow-platform-system-analysis:amd64-latest \
            --tag ghcr.io/runshine/secflow-platform-system-analysis:amd64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-platform-system-analysis/

      - name: Push amd64 image
        run: |
          # docker push runshine0819/secflow-platform-system-analysis:amd64-latest
          docker push ghcr.io/runshine/secflow-platform-system-analysis:amd64-latest
          # docker push runshine0819/secflow-platform-system-analysis:amd64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/secflow-platform-system-analysis:amd64-${{ needs.prepare.outputs.date_tag }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build arm64 image
        run: |
          docker build \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --file 13-secflow-service/image_build/secflow-platform-system-analysis/Dockerfile \
            --tag ghcr.io/runshine/secflow-platform-system-analysis:arm64-latest \
            --tag ghcr.io/runshine/secflow-platform-system-analysis:arm64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-platform-system-analysis/

      - name: Push arm64 image
        run: |
          # docker push runshine0819/secflow-platform-system-analysis:arm64-latest
          docker push ghcr.io/runshine/secflow-platform-system-analysis:arm64-latest
          # docker push runshine0819/secflow-platform-system-analysis:arm64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/secflow-platform-system-analysis:arm64-${{ needs.prepare.outputs.date_tag }}

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Create and push multi-arch manifest (latest)
        run: |
          # docker manifest create runshine0819/secflow-platform-system-analysis:latest \
            # --amend runshine0819/secflow-platform-system-analysis:amd64-latest \
            # --amend runshine0819/secflow-platform-system-analysis:arm64-latest
          docker manifest create ghcr.io/runshine/secflow-platform-system-analysis:latest \
            --amend ghcr.io/runshine/secflow-platform-system-analysis:amd64-latest \
            --amend ghcr.io/runshine/secflow-platform-system-analysis:arm64-latest
          # docker manifest push runshine0819/secflow-platform-system-analysis:latest
          docker manifest push ghcr.io/runshine/secflow-platform-system-analysis:latest

      - name: Create and push multi-arch manifest (date tag)
        run: |
          # docker manifest create runshine0819/secflow-platform-system-analysis:${{ needs.prepare.outputs.date_tag }} \
            # --amend runshine0819/secflow-platform-system-analysis:amd64-${{ needs.prepare.outputs.date_tag }} \
            # --amend runshine0819/secflow-platform-system-analysis:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest create ghcr.io/runshine/secflow-platform-system-analysis:${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-platform-system-analysis:amd64-${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-platform-system-analysis:arm64-${{ needs.prepare.outputs.date_tag }}
          # docker manifest push runshine0819/secflow-platform-system-analysis:${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/runshine/secflow-platform-system-analysis:${{ needs.prepare.outputs.date_tag }}
