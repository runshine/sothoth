name: build-secflow-frontend-image
on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      # Frontend is tracked as a submodule in the main repo; workflow file updates
      # are kept as an explicit CI trigger path for submodule pointer changes.
      - .github/workflows/build-secflow-frontend-image.yaml
      - 13-secflow-service/image_build/secflow-frontend
      - 13-secflow-service/image_build/secflow-frontend/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Generate date tag
        id: date
        run: echo "date_tag=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build amd64 image
        run: |
          docker build \
            --file ./13-secflow-service/image_build/secflow-frontend/docker/docker.txt \
            --tag ghcr.io/runshine/secflow-frontend:amd64-latest \
            --tag ghcr.io/runshine/secflow-frontend:amd64-${{ needs.prepare.outputs.date_tag }} \
            ./13-secflow-service/image_build/secflow-frontend/

      - name: Push amd64 image
        run: |
          # docker push runshine0819/secflow-frontend:amd64-latest
          docker push ghcr.io/runshine/secflow-frontend:amd64-latest
          # docker push runshine0819/secflow-frontend:amd64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/secflow-frontend:amd64-${{ needs.prepare.outputs.date_tag }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: clean to default
        run: sed -i 's/https:\/\/secflow.819819.xyz//g' ./13-secflow-service/image_build/secflow-frontend/clients/base.ts

      - name: clean to default_local
        run: sed -i 's/http:\/\/localhost:8080//g' ./13-secflow-service/image_build/secflow-frontend/clients/base.ts

      - name: cat base.ts
        run: cat ./13-secflow-service/image_build/secflow-frontend/clients/base.ts
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build arm64 image
        run: |
          docker build \
            --file ./13-secflow-service/image_build/secflow-frontend/docker/docker.txt \
            --tag ghcr.io/runshine/secflow-frontend:arm64-latest \
            --tag ghcr.io/runshine/secflow-frontend:arm64-${{ needs.prepare.outputs.date_tag }} \
            ./13-secflow-service/image_build/secflow-frontend/

      - name: Push arm64 image
        run: |
          # docker push runshine0819/secflow-frontend:arm64-latest
          docker push ghcr.io/runshine/secflow-frontend:arm64-latest
          # docker push runshine0819/secflow-frontend:arm64-${{ needs.prepare.outputs.date_tag }}
          docker push ghcr.io/runshine/secflow-frontend:arm64-${{ needs.prepare.outputs.date_tag }}

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Create and push multi-arch manifest (latest)
        run: |
          # docker manifest create runshine0819/secflow-frontend:latest \
            # --amend runshine0819/secflow-frontend:amd64-latest \
            # --amend runshine0819/secflow-frontend:arm64-latest
          docker manifest create ghcr.io/runshine/secflow-frontend:latest \
            --amend ghcr.io/runshine/secflow-frontend:amd64-latest \
            --amend ghcr.io/runshine/secflow-frontend:arm64-latest
          # docker manifest push runshine0819/secflow-frontend:latest
          docker manifest push ghcr.io/runshine/secflow-frontend:latest

      - name: Create and push multi-arch manifest (date tag)
        run: |
          # docker manifest create runshine0819/secflow-frontend:${{ needs.prepare.outputs.date_tag }} \
            # --amend runshine0819/secflow-frontend:amd64-${{ needs.prepare.outputs.date_tag }} \
            # --amend runshine0819/secflow-frontend:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest create ghcr.io/runshine/secflow-frontend:${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-frontend:amd64-${{ needs.prepare.outputs.date_tag }} \
            --amend ghcr.io/runshine/secflow-frontend:arm64-${{ needs.prepare.outputs.date_tag }}
          # docker manifest push runshine0819/secflow-frontend:${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/runshine/secflow-frontend:${{ needs.prepare.outputs.date_tag }}
