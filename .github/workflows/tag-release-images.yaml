name: tag-release-images

on:
  workflow_dispatch:

jobs:
  tag-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Tag v1 (pre-refactor asyncio)
        run: |
          docker pull ghcr.io/runshine/secflow-app-system-analyse:20260611-074409-9343771
          docker tag ghcr.io/runshine/secflow-app-system-analyse:20260611-074409-9343771 ghcr.io/runshine/secflow-app-system-analyse:v1
          docker push ghcr.io/runshine/secflow-app-system-analyse:v1

      - name: Tag v2 (threading refactor)
        run: |
          docker pull ghcr.io/runshine/secflow-app-system-analyse:20260612-160344-caff02c
          docker tag ghcr.io/runshine/secflow-app-system-analyse:20260612-160344-caff02c ghcr.io/runshine/secflow-app-system-analyse:v2
          docker push ghcr.io/runshine/secflow-app-system-analyse:v2
