name: build-secflow-app-binary-security-image
on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-app-binary-security-image.yaml
      - 13-secflow-service/image_build/secflow-app-binary-security/**
      - 13-secflow-service/00-secflow-108-**
      - 99-external-service/13-secflow-00-ingress-for-release.yaml

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${MAIN_REPO_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using main repo sha: ${MAIN_REPO_SHA} (${SHORT_SHA}), commit ts: ${COMMIT_TS}, version: ${DATE_TAG}"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push amd64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --cache-from type=gha,scope=secflow-app-binary-security-amd64 \
            --cache-to type=gha,scope=secflow-app-binary-security-amd64,mode=max \
            --file 13-secflow-service/image_build/secflow-app-binary-security/Dockerfile \
            --tag ghcr.io/runshine/secflow-app-binary-security:amd64-latest \
            --tag ghcr.io/runshine/secflow-app-binary-security:amd64-${{ needs.prepare.outputs.date_tag }} \
            --push \
            13-secflow-service/image_build/secflow-app-binary-security/

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --cache-from type=gha,scope=secflow-app-binary-security-arm64 \
            --cache-to type=gha,scope=secflow-app-binary-security-arm64,mode=max \
            --file 13-secflow-service/image_build/secflow-app-binary-security/Dockerfile \
            --tag ghcr.io/runshine/secflow-app-binary-security:arm64-latest \
            --tag ghcr.io/runshine/secflow-app-binary-security:arm64-${{ needs.prepare.outputs.date_tag }} \
            --push \
            13-secflow-service/image_build/secflow-app-binary-security/

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/runshine/secflow-app-binary-security:latest \
            ghcr.io/runshine/secflow-app-binary-security:amd64-latest \
            ghcr.io/runshine/secflow-app-binary-security:arm64-latest

      - name: Create and push multi-arch manifest (date tag)
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/runshine/secflow-app-binary-security:${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/runshine/secflow-app-binary-security:amd64-${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/runshine/secflow-app-binary-security:arm64-${{ needs.prepare.outputs.date_tag }}
