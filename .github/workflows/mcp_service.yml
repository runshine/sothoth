name: mcp_service

on:
  push:
    branches:
      - 'v2.*'
    paths:
      - mcp_service/*

jobs:
  build_mcp_ssh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mcp_ssh
        uses: docker/build-push-action@v5
        with:
          context: ./mcp_service/mcp-ssh/mcp-ssh/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            runshine0819/mcp-ssh:latest
            ghcr.io/runshine/mcp-ssh:latest
          file: ./mcp_service/mcp-ssh/mcp-ssh/Dockerfile

  build_mcp_ssh_server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mcp_ssh_server
        uses: docker/build-push-action@v5
        with:
          context: ./mcp_service/mcp-ssh-server/mcp-ssh-server/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            runshine0819/mcp-ssh-server:latest
            ghcr.io/runshine/mcp-ssh-server:latest
          file: ./mcp_service/mcp-ssh-server/mcp-ssh-server/Dockerfile