name: build-secflow-app-system-analyse-image

on:
  workflow_dispatch:
  push:
    branches:
      - 'v2.*'
    paths:
      - .github/workflows/build-secflow-app-system-analyse-image.yaml
      - 13-secflow-service/image_build/secflow-app-system-analyse/**
      - 13-secflow-service/image_build/secflow-app-system-analyse

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${MAIN_REPO_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v6
        with:
          submodules: false
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Checkout submodule secflow-app-system-analyse
        run: |
          EXPECTED=$(git ls-tree HEAD 13-secflow-service/image_build/secflow-app-system-analyse | awk '{print $3}')
          echo "Expected submodule commit: $EXPECTED"
          rm -rf 13-secflow-service/image_build/secflow-app-system-analyse
          git clone \
            https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/ict-bin/system_analyse.git \
            13-secflow-service/image_build/secflow-app-system-analyse
          cd 13-secflow-service/image_build/secflow-app-system-analyse
          git checkout "$EXPECTED"
          ACTUAL=$(git rev-parse HEAD)
          echo "Actual submodule commit:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: submodule commit mismatch!"
            exit 1
          fi
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build amd64 image
        run: |
          docker build \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --file 13-secflow-service/image_build/secflow-app-system-analyse/Dockerfile \
            --tag ghcr.io/runshine/secflow-app-system-analyse:amd64-latest \
            --tag ghcr.io/runshine/secflow-app-system-analyse:amd64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-app-system-analyse/

      - name: Push amd64 image
        run: |
          docker push ghcr.io/runshine/secflow-app-system-analyse:amd64-latest
          docker push ghcr.io/runshine/secflow-app-system-analyse:amd64-${{ needs.prepare.outputs.date_tag }}

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v6
        with:
          submodules: false
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Checkout submodule secflow-app-system-analyse
        run: |
          EXPECTED=$(git ls-tree HEAD 13-secflow-service/image_build/secflow-app-system-analyse | awk '{print $3}')
          echo "Expected submodule commit: $EXPECTED"
          rm -rf 13-secflow-service/image_build/secflow-app-system-analyse
          git clone \
            https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/ict-bin/system_analyse.git \
            13-secflow-service/image_build/secflow-app-system-analyse
          cd 13-secflow-service/image_build/secflow-app-system-analyse
          git checkout "$EXPECTED"
          ACTUAL=$(git rev-parse HEAD)
          echo "Actual submodule commit:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: submodule commit mismatch!"
            exit 1
          fi
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build arm64 image
        run: |
          docker build \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --file 13-secflow-service/image_build/secflow-app-system-analyse/Dockerfile \
            --tag ghcr.io/runshine/secflow-app-system-analyse:arm64-latest \
            --tag ghcr.io/runshine/secflow-app-system-analyse:arm64-${{ needs.prepare.outputs.date_tag }} \
            13-secflow-service/image_build/secflow-app-system-analyse/

      - name: Push arm64 image
        run: |
          docker push ghcr.io/runshine/secflow-app-system-analyse:arm64-latest
          docker push ghcr.io/runshine/secflow-app-system-analyse:arm64-${{ needs.prepare.outputs.date_tag }}

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Create and push Docker Hub manifests
        run: |
          echo "Docker Hub manifest push disabled"

      - name: Create and push GHCR manifests
        run: |
          docker manifest create ghcr.io/runshine/secflow-app-system-analyse:latest \
            ghcr.io/runshine/secflow-app-system-analyse:amd64-latest \
            ghcr.io/runshine/secflow-app-system-analyse:arm64-latest
          docker manifest create ghcr.io/runshine/secflow-app-system-analyse:${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/runshine/secflow-app-system-analyse:amd64-${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/runshine/secflow-app-system-analyse:arm64-${{ needs.prepare.outputs.date_tag }}
          docker manifest push ghcr.io/runshine/secflow-app-system-analyse:latest
          docker manifest push ghcr.io/runshine/secflow-app-system-analyse:${{ needs.prepare.outputs.date_tag }}
