apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-system-analyse-runner
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-app-system-analyse-runner
  template:
    metadata:
      labels:
        name: secflow-app-system-analyse-runner
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-app-system-analyse-runner
        image: ghcr.io/runshine/secflow-app-system-analyse:20260519-8a15530
        imagePullPolicy: Always
        env:
          - name: SECFLOW_SYSTEM_ANALYSE_ROLE
            value: runner
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: TZ
            value: Asia/Shanghai
          - name: PORT
            value: "8080"
          - name: FILESERVER_ROOT
            value: /data/files
          - name: SECFLOW_SYSTEM_ANALYSE_DB_AUTO_MIGRATE
            value: "false"
          - name: SECFLOW_SYSTEM_ANALYSE_DB_POOL_SIZE_WORKER
            value: "8"
          - name: SECFLOW_SYSTEM_ANALYSE_DB_MAX_OVERFLOW_WORKER
            value: "8"
          - name: SECFLOW_SYSTEM_ANALYSE_DB_POOL_TIMEOUT_WORKER
            value: "10"
          - name: SECFLOW_SYSTEM_ANALYSE_DB_POOL_RECYCLE_WORKER
            value: "1800"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-system-analyse-config
          mountPath: /app/service.yaml
          subPath: service.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        livenessProbe:
          httpGet:
            path: /api/app/system-analyse/livez
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 60
        readinessProbe:
          httpGet:
            path: /api/app/system-analyse/readyz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /api/app/system-analyse/livez
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
      volumes:
      - name: secflow-app-system-analyse-config
        configMap:
          name: secflow-app-system-analyse-config
          items:
            - key: service.yaml
              path: service.yaml
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
