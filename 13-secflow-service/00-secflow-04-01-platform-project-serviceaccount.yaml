apiVersion: v1
kind: ServiceAccount
metadata:
  name: secflow-platform-project-serviceaccount
  namespace: secflow-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secflow-platform-project-serviceaccount-role
rules:
  # 允许管理Deployment
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 允许管理Service
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 允许管理Ingress
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 允许管理Pod（用于日志和状态检查）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 允许管理PVC
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 允许管理Job（用于文件拷贝和解压）
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 允许查看节点信息（用于NodePort服务）
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # 允许查看命名空间（用于验证）
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces/status"]
    verbs: ["get"]
  # 允许获取 resourcequotas（用于查询命名空间配额）
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  # 允许查看存储类（用于验证）
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  # 允许查看事件（用于调试）
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # 允许管理 Secret（用于创建 TLS Secret）
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 允许管理 ConfigMap（用于配置管理）
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [ "batch" ]
    resources: [ "jobs/status" ]
    verbs: [ "get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secflow-platform-project-serviceaccount-binding
subjects:
  - kind: ServiceAccount
    name: secflow-platform-project-serviceaccount
    namespace: secflow-ns
roleRef:
  kind: ClusterRole
  name: secflow-platform-project-serviceaccount-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secflow-platform-project-serviceaccount-admin-binding
subjects:
  - kind: ServiceAccount
    name: secflow-platform-project-serviceaccount
    namespace: secflow-ns
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io