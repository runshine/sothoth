apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-dataflow-analyse-worker
  namespace: secflow-ns
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      name: secflow-app-dataflow-analyse
      role: worker
  template:
    metadata:
      labels:
        name: secflow-app-dataflow-analyse
        role: worker
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-app-dataflow-analyse
        image: ghcr.io/runshine/secflow-app-dataflow-analyse:20260519-1c5e70a
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
          - name: PORT
            value: "8080"
          - name: SERVICE_YAML
            value: /app/service.yaml
          - name: FILESERVER_ROOT
            value: /data/files
          - name: DFA_AGENT_TIMEOUT_SECONDS
            value: "900"
          - name: DFA_ROLE
            value: worker
          - name: DFA_ENABLE_PUBLIC_API
            value: "false"
          - name: DFA_ENABLE_DISPATCHER
            value: "true"
          - name: DFA_ENABLE_EXECUTOR
            value: "true"
          - name: DFA_ENABLE_REGISTRY
            value: "false"
          - name: DFA_LEASE_TTL_SECONDS
            value: "90"
          - name: DFA_HEARTBEAT_INTERVAL_SECONDS
            value: "15"
          - name: DFA_MAX_LOCAL_RUNNING_TASKS
            value: "4"
          - name: DFA_CLUSTER_EXPECTED_WORKERS
            value: "6"
          - name: DFA_CLUSTER_EXPECTED_WORKER_CAPACITY
            value: "4"
          - name: DFA_DISPATCH_POLL_INTERVAL_SECONDS
            value: "3"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-dataflow-analyse-config
          mountPath: /app/service.yaml
          subPath: service.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "12Gi"
            cpu: "6"
          limits:
            memory: "16Gi"
            cpu: "8"
        startupProbe:
          httpGet:
            path: /api/app/dataflow-analyse/health
            port: 8080
          periodSeconds: 10
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /api/app/dataflow-analyse/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /api/app/dataflow-analyse/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: secflow-app-dataflow-analyse-config
        configMap:
          name: secflow-app-dataflow-analyse-config
          items:
            - key: service.yaml
              path: service.yaml
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
