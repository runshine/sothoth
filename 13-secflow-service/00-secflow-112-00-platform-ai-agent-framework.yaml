apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-ai-agent-framework-config
  namespace: secflow-ns
data:
  config.yaml: |
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_aiwf_"
      pool_size: 10
      max_overflow: 20

    auth_service:
      enabled: true
      host: "secflow-platform-auth"
      port: 80
      validate_human_token_path: "/api/auth/validate-human-token"
      validate_machine_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10

    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-platform-ai-agent-framework"
      service_name: "AI智能体工作流服务"
      host: "secflow-platform-ai-agent-framework"
      port: 80
      maturity: "开发中"
      description: "提供多智能体漏洞工作流定义、触发、执行和调度能力"
      api_prefix: "/api/ai-agent-framework"
      unregister_on_shutdown: false
      heartbeat_interval_seconds: 30
      menu:
        id: "ai-agent-framework"
        path: "/ai-agent-framework"
        icon: "workflow"
        order: 35
        level1_name: "漏洞分析"
        level2_name: "AI工作流"
        level3_name: ""

    service:
      workspace_base_dir: "/tmp/secflow-ai-agent-framework"
      default_execution_timeout_seconds: 7200
      execution_cancel_check_interval_seconds: 1
      trigger_retry_limit: 3

    scheduler:
      enabled: true
      worker_capacity: 2
      poll_interval_seconds: 2
      heartbeat_interval_seconds: 5
      worker_timeout_seconds: 20
      lease_duration_seconds: 30
      cleanup_interval_seconds: 10

    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-ai-agent-framework
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-platform-ai-agent-framework
  template:
    metadata:
      labels:
        name: secflow-platform-ai-agent-framework
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: secflow-platform-ai-agent-framework
          image: ghcr.io/runshine/secflow-platform-ai-agent-framework:latest
          imagePullPolicy: Always
          args:
            - serve
          env:
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATA_PVC_NAME
              value: secflow-platform-fileserver-data-nfs-pvc
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /api/ai-agent-framework/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/ai-agent-framework/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 150m
              memory: 256Mi
          volumeMounts:
            - name: secflow-platform-ai-agent-framework-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: secflow-platform-fileserver-data-nfs-pvc
              mountPath: /data
      volumes:
        - name: secflow-platform-ai-agent-framework-config
          configMap:
            name: secflow-platform-ai-agent-framework-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: secflow-platform-ai-agent-framework
  namespace: secflow-ns
spec:
  type: ClusterIP
  selector:
    name: secflow-platform-ai-agent-framework
  ports:
    - name: secflow-platform-ai-agent-framework
      port: 80
      targetPort: 8080
      protocol: TCP
