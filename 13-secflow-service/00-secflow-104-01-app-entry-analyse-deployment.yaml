# R6-fixes build-1779796710
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-entry-analyse
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-app-entry-analyse
  template:
    metadata:
      labels:
        name: secflow-app-entry-analyse
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-app-entry-analyse
        image: ghcr.io/runshine/secflow-app-entry-analyse:latest
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
          - name: PORT
            value: "8080"
          - name: FILESERVER_ROOT
            value: /data/files
          - name: WORKER_ISOLATION_MODE
            value: "none"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-entry-analyse-config
          mountPath: /app/service.yaml
          subPath: service.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /api/app/entry-analyse/health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /api/app/entry-analyse/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/app/entry-analyse/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
      volumes:
      - name: secflow-app-entry-analyse-config
        configMap:
          name: secflow-app-entry-analyse-config
          items:
            - key: service.yaml
              path: service.yaml
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
