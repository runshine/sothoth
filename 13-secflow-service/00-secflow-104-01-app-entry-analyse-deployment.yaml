apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-entry-analyse
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: secflow-app-entry-analyse
  template:
    metadata:
      labels:
        name: secflow-app-entry-analyse
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-app-entry-analyse
        image: ghcr.io/runshine/secflow-app-entry-analyse:latest
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
          - name: EA_RUNTIME_ROLE
            value: "api"
          - name: PORT
            value: "8080"
          - name: FILESERVER_ROOT
            value: /data/files
          - name: WORKER_ISOLATION_MODE
            value: "none"
          - name: EA_SESSION_INDEX_REFRESH_SECONDS
            value: "60"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-entry-analyse-config
          mountPath: /app/service.yaml
          subPath: service.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /api/app/entry-analyse/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/app/entry-analyse/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
      volumes:
      - name: secflow-app-entry-analyse-config
        configMap:
          name: secflow-app-entry-analyse-config
          items:
            - key: service.yaml
              path: service.yaml
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
