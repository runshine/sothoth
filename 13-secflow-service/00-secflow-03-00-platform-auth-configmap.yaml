apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-auth-config
  namespace: secflow-ns
data:
  config.yaml: |
    # SecFlow-User 配置文件
    # 数据库配置（MySQL）
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      charset: "utf8mb4"
    # 应用配置
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false
      
    # JWT配置
    jwt:
      secret_key: "secflow-secret-key-change-in-production"
      algorithm: "HS256"
      access_token_expire_minutes: 1440  # 24小时

    # 统一机机Token（用于微服务间认证）
    service_auth:
      machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      machine_token_record_file: "/tmp/secflow-machine-token.txt"
    
    # 服务注册配置
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu"
      service_id: "secflow-platform-auth"
      service_name: "用户服务"
      host: "0.0.0.0"
      port: 80
      maturity: "已上线"
      description: "用户管理与认证微服务"
      api_prefix: "/api/auth"
      menu:
        id: "user-manage"
        path: "/user-manage"
        icon: "user"
        order: 1
        # 一级菜单
        level1:
          name: "系统管理"
          name_en: "System"
        # 二级菜单
        level2:
          name: "用户管理"
          name_en: "User Management"
        # 三级菜单（可选）
        level3:
          name: null
          name_en: null
