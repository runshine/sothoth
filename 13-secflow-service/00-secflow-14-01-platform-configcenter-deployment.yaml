apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-configcenter
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-platform-configcenter
  template:
    metadata:
      labels:
        name: secflow-platform-configcenter
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-platform-configcenter
        image: ghcr.io/runshine/secflow-platform-configcenter:latest
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-platform-configcenter-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/configcenter/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/configcenter/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
      volumes:
      - name: secflow-platform-configcenter-config
        configMap:
          name: secflow-platform-configcenter-config
          items:
            - key: config.yaml
              path: config.yaml
