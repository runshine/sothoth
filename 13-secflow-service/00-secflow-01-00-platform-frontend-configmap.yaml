# nginx-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-frontend-config
  namespace: secflow-ns
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
    
        # 日志格式
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"'
                        ' proxy_to: "$upstream_addr"';
    
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
    
        # 开启gzip压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
    
            # 修正：正确的指令名称是 client_max_body_size
            client_max_body_size 500m;
    
            # 处理React Router的路由问题（主应用）
            location / {
                try_files $uri $uri/ /index.html;
            }
    
            # 缓存静态资源
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
    
            # 禁止访问隐藏文件
            location ~ /\. {
                deny all;
            }
    
            # 健康检查端点
            location /api/frontend/health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
  # 运行时配置文件，可在部署时修改
  config.js: |
    // SecFlow 运行时配置文件
    window.__SECFLOW_CONFIG__ = {
      // 知微平台域名 - 根据实际部署环境修改
      ZHIWEI_DOMAIN: "https://gaiasec.ai.icsl.huawei.com"
    };