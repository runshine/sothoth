apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-deploy-script
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: secflow-platform-deploy-script
  template:
    metadata:
      labels:
        name: secflow-platform-deploy-script
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-platform-deploy-script
        image: runshine0819/secflow-platform-deploy-script:latest  # 包含kubectl命令
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-platform-deploy-script-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secflow-platform-deploy-script-nfs-pvc
          mountPath: /app/resource
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/deploy-script/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/deploy-script/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30

      volumes:
      - name: secflow-platform-deploy-script-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-deploy-script-nfs-pvc  # 引用PVC
      - name: secflow-platform-deploy-script-config
        configMap:
          name: secflow-platform-deploy-script-config
          items:
            - key: config.yaml
              path: config.yaml

