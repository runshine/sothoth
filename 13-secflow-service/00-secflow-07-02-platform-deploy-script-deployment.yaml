apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-deploy-script
  namespace: secflow-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      name: secflow-platform-deploy-script
  template:
    metadata:
      labels:
        name: secflow-platform-deploy-script
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 80
        volumeMounts:
          - name: secflow-platform-deploy-script-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: secflow-platform-deploy-script-nfs-pvc
            mountPath: /data
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # 资源限制
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

      volumes:
      - name: secflow-platform-deploy-script-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-deploy-script-nfs-pvc  # 引用PVC
      - name: secflow-platform-deploy-script-nginx-config
        configMap:
          name: secflow-platform-deploy-script-nginx-config
          items:
            - key: nginx.conf
              path: nginx.conf

