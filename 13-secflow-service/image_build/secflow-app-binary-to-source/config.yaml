  name: "secflow"
  pool_size: 10
  max_overflow: 20

auth_service:
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

project_service:
  host: "secflow-platform-project"
  port: 80
  get_project_path: "/api/project"
  timeout: 10

configcenter_service:
  enabled: true
  base_url: "http://secflow-platform-configcenter/api/configcenter"
  timeout: 30

pi_re_agent:
  base_url: "http://secflow-pi-re-agent:8000"
  worker_urls: []
  api_key: null
  timeout: 30
  discovery_mode: "k8s_headless"
  discovery_service_name: "secflow-pi-re-agent-headless"
  discovery_namespace: "secflow-ns"
  discovery_port: 8000
  capacity_refresh_seconds: 10
  dispatch_interval_seconds: 2
  queued_buffer_per_worker: 1
  worker_probe_timeout_seconds: 5
  max_dispatch_batch_size: 16
  default_worker_max_concurrent_jobs: 3
  dispatcher_lease_seconds: 15
  batch_size: 8192
  max_retries: -1
  agent_run_timeout_seconds: 86400
  agent_timeout_retry_enabled: true
  agent_timeout_max_retries: 20
  engine: "turbo"
  concurrency: 8
  model: null
  llm_provider_key: "share_codex"
  agent_config_dir: "/data/pi-re-agent-config"

storage:
  project_root_template: "/data/files/{project_id}"
  app_root_name: "app/secflow-app-binary-to-source"
  output_root_name: "binary-to-source-outputs"
  require_input_exists: true

cache:
  enabled: true
  root_dir: "/data/files/.secflow-cache/binary-to-source"
  materialize_mode: "copy"
  cache_success_only: true

registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu"
  service_id: "secflow-app-binary-to-source-manager"
  service_name: "ELF源码还原服务"
  host: "secflow-app-binary-to-source-manager"
  port: 80
  maturity: "开发中"
  description: "项目隔离的ELF到源码还原适配服务，后端对接pi-re-agent"
  api_prefix: "/api/app/binary-to-source"
  menu:
    id: "secflow-app-binary-to-source"
    path: "/binary-to-source"
    icon: "cpu"
    order: 20
    level1:
      name: "开发工具"
      name_en: "DevTools"
    level2:
      name: "逆向分析"
      name_en: "Reverse"
    level3:
      name: "ELF源码还原"
      name_en: "Binary To Source"

app:
  host: "0.0.0.0"
  port: 8080
  debug: false

logging:
  level: "INFO"
