database:
  type: "mysql"
  host: "mysql.sothothv2-ns.svc.cluster.local"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  table_prefix: "secflow_app_binary_to_source_"
  pool_size: 10
  max_overflow: 20
  path: "./binary_to_source.db"

redis:
  url: "redis://redis.sothothv2-ns.svc.cluster.local:6379/0"
  key_prefix: "secflow:binary-to-source"
  worker_ttl_seconds: 45
  lock_ttl_seconds: 15

auth_service:
  enabled: true
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  timeout: 10

project_service:
  host: "secflow-platform-project"
  port: 80
  get_project_path: "/api/project"
  timeout: 10

celery:
  broker_url: "redis://redis.sothothv2-ns.svc.cluster.local:6379/1"
  result_backend: "redis://redis.sothothv2-ns.svc.cluster.local:6379/2"
  task_track_started: true
  task_time_limit_seconds: 7200
  task_soft_time_limit_seconds: 7000
  worker_queue_prefix: "b2s-worker"

scheduler:
  dispatch_interval_seconds: 3
  recovery_interval_seconds: 10
  stale_running_timeout_seconds: 3600
  queued_timeout_seconds: 300

task_policy:
  auto_retry_enabled: true
  max_auto_retries: 2
  transient_retry_delay_seconds: 30

storage:
  shared_root: "/data/binary-to-source"

registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu"
  service_id: "secflow-app-binary-to-source"
  service_name: "ELF源码还原服务"
  host: "secflow-app-binary-to-source-manager"
  port: 80
  maturity: "开发中"
  description: "基于Celery的ELF到源码还原任务服务"
  api_prefix: "/api/app/binary-to-source"
  menu:
    id: "binary-to-source"
    path: "/binary-to-source"
    icon: "cpu"
    order: 20
    level1:
      name: "开发工具"
      name_en: "DevTools"
    level2:
      name: "逆向分析"
      name_en: "Reverse"
    level3:
      name: "ELF源码还原"
      name_en: "Binary To Source"

app:
  host: "0.0.0.0"
  port: 8080
  debug: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
