# SecFlow Deploy Script File Management Service Configuration

# Application Configuration
app:
  host: "0.0.0.0"
  port: 10007
  debug: false

# File Root Directory Configuration
file_root: "./resource"

# Auth Service Configuration (call external auth service)
auth_service:
  enabled: false
  host: "192.168.12.44"
  port: 10000
  validate_token_path: "/api/auth/validate-human-token"
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

# Menu Registration Center Configuration
registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secflow-deploy-script"
  service_name: "部署脚本管理服务"
  host: "0.0.0.0"
  port: 10006
  maturity: "已上线"
  description: "提供部署脚本的文件管理功能"
  api_prefix: "/api/deploy-script"
  menu:
    id: "deploy-script-manage"
    path: "/deploy-script"
    icon: "code"
    order: 10
    level1:
      name: "系统工具"
      name_en: "System Tools"
    level2:
      name: "部署脚本"
      name_en: "Deploy Scripts"