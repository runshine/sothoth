# Secmate-NG Manager 配置文件

# 应用配置
app:
  host: "0.0.0.0"
  port: 10011
  debug: false
  # CORS允许的源列表（生产环境使用，开发模式下自动允许所有源）
  allowed_origins:
    - "https://secmate-ng.ai.icsl.huawei.com"
    - "http://localhost:3000"

# 数据库配置 (支持 mysql 和 sqlite)
database:
  type: "mysql"
  host: "172.31.30.100"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  table_prefix: "secflow_app_secmate_ng_"
  pool_size: 10
  max_overflow: 20
  path: "./secmate_ng_manager.db"

# K8s API Service配置（通过secflow-platform-k8s管理K8s资源）
k8s_api_service:
  host: "secflow-platform-k8s"
  port: 80
  timeout: 30
  use_user_token: true

# 认证服务配置
auth_service:
  enabled: true
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

# Secmate-NG配置
secmate_ng:
  image: "your-registry/secmate-ng:latest"
  image_pull_policy: "Always"
  service_type: "ClusterIP"
  service_port: 80
  container_port: 80
  # 通用环境变量（所有实例共享）
  common_env:
    LOG_LEVEL: "INFO"
    TZ: "Asia/Shanghai"
  # Secmate-NG 特定环境变量（镜像默认值）
  default_secmate_env: {}
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# PVC配置
pvc:
  storage_class: "standard"
  storage_size: "5Gi"
  access_mode: "ReadWriteOnce"

# Ingress配置
ingress:
  base_domain: "secmate-ng.ai.icsl.huawei.com"
  tls_secret_name: "wildcard-secflow-tls"
  ingress_class: "nginx"
  tls_enabled: true

# 任务管理配置
tasks:
  retention_days: 7
  cleanup_interval_hours: 24
  max_concurrent_tasks: 10

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 服务注册配置
registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secmate-ng-manager"
  service_name: "Secmate-NG管理器"
  host: "0.0.0.0"
  port: 10011
  maturity: "开发中"
  description: "Secmate-NG实例管理微服务"
  api_prefix: "/api/app/secmate-ng"
  menu:
    id: "secmate-ng-manager"
    path: "/secmate-ng-manager"
    icon: "security"
    order: 20
    level1:
      name: "安全工具"
      name_en: "SecurityTools"
    level2:
      name: "Secmate-NG"
      name_en: "Secmate-NG"
    level3:
      name: null
      name_en: null
