# SecFlow 工作流状态管理服务配置

database:
  host: "172.31.30.100"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  table_prefix: "secflow_workflow_"
  pool_size: 10
  max_overflow: 20

auth_service:
  enabled: false  # 认证开关，设为false时跳过认证
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

# K8S微服务配置（用于查询资源状态）
k8s_service:
  enabled: true  # 是否启用K8S微服务调用模式
  host: "secflow-platform-k8s"
  port: 80
  timeout: 30

# Workflow微服务配置（用于回调通知）
workflow_service:
  host: "secflow-platform-workflow"
  port: 80
  timeout: 30

# 状态同步配置
status_sync:
  batch_size: 10  # 批量同步节点数
  retry_count: 3  # 重试次数
  retry_interval: 2  # 重试间隔（秒）

registry:
  enabled: false
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secflow-workflow-status"
  service_name: "工作流状态管理服务"
  host: "0.0.0.0"
  port: 80
  maturity: "开发中"
  description: "提供工作流实例和节点状态的查询与同步管理"
  api_prefix: "/api/workflow-status"
  menu:
    id: "workflow-status"
    path: "/workflow-status"
    icon: "activity"
    order: 15

app:
  host: "0.0.0.0"
  port: 8080
  debug: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
