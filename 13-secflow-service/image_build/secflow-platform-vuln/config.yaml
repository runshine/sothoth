database:
  host: "mysql.sothothv2-ns.svc.cluster.local"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  table_prefix: "secflow_vuln_"
  pool_size: 10
  max_overflow: 20

auth_service:
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: ""
  timeout: 10

project_service:
  host: "secflow-platform-project"
  port: 80
  get_project_path: "/api/project"
  timeout: 10

storage:
  backend: "shared_pvc"
  base_path: "/data/vuln-storage"
  future_backend: "s3"

service_registry:
  heartbeat_timeout_seconds: 90
  allow_dynamic_register: true

engine:
  dispatch_interval_seconds: 5
  max_parallel_actions_per_case: 5
  action_timeout_default: 300
  retry_default: 1
  auto_transition_enabled: true

workflow:
  default_workflow_code: "default_vuln_lifecycle"

registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu"
  service_id: "secflow-platform-vuln"
  service_name: "漏洞生命周期引擎"
  host: "secflow-platform-vuln"
  port: 80
  maturity: "开发中"
  description: "平台级漏洞生命周期编排引擎，负责能力服务注册、Case 编排、结果汇聚和阶段推进"
  api_prefix: "/api/vuln"
  menu:
    id: "vuln-engine"
    path: "/vuln-engine"
    icon: "shield-alert"
    order: 30
    level1:
      name: "安全运营"
      name_en: "Security Operations"
    level2:
      name: "漏洞引擎"
      name_en: "Vulnerability Engine"
    level3:
      name: null
      name_en: null

app:
  host: "0.0.0.0"
  port: 8080
  debug: false
