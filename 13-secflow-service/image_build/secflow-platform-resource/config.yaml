# secflow-input-management Configuration

# Database Configuration (MySQL)
database:
  host: "172.31.30.100"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  pool_size: 10
  max_overflow: 20

# Application Configuration
app:
  host: "0.0.0.0"
  port: 10005
  debug: false
  upload_dir: "/tmp/uploads"
  temp_dir: "/tmp/temp"
  download_base_url: "http://192.168.12.44:10002"

# Auth Service Configuration (for token validation)
auth_service:
  base_url: "http://192.168.12.44:10000"
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
  timeout: 10
  # Token缓存有效期（秒），默认15分钟
  # 在缓存有效期内，同一Token的验证请求将直接从缓存返回，不再请求auth服务
  token_cache_ttl: 900

# Secflow Project Service Configuration (for project validation)
project_service:
  base_url: "http://192.168.12.44:10001"
  get_project_path: "/api/project"
  timeout: 10

# Kubernetes Configuration
k8s:
  # 连接方式: "kubeconfig" (集群外) 或 "incluster" (集群内)
  connection_mode: "kubeconfig"
  # kubeconfig文件路径 (仅当connection_mode为kubeconfig时使用)
  kubeconfig_path: "/home/runshine/.kube/config"
  # 默认的存储类名称
  storage_class_name: "nfs-storage-192.168.13.66"
  # PVC大小模板 (单位: Gi)
  pvc_size: 10
  # POD超时时间 (秒)
  pod_timeout: 300
  # 资源复制超时 (秒)
  resource_copy_timeout: 1800

# K8S Service Gateway Configuration (统一收口到platform-k8s)
k8s_service:
  enabled: true
  host: "192.168.12.44"
  port: 10008
  base_url: "http://192.168.12.44:10008/api/k8s"
  timeout: 30

# Async Task Configuration
task:
  # 任务日志目录
  log_dir: "/tmp/task_log"
  # 任务日志保留天数
  log_retention_days: 7
  # 最大并发任务数
  max_concurrent_tasks: 10
  # 任务检查间隔 (秒)
  check_interval: 5

# Menu Service Configuration (服务注册中心)
registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secflow-resource"
  service_name: "资源管理服务"
  host: "0.0.0.0"
  port: 10002
  maturity: "已上线"
  description: "项目输入资源管理 - 提供软件发布包、软件文档包、软件代码包的上传、查询、下载功能"
  api_prefix: "/api/resource"
  menu:
    id: "resource-manage"
    path: "/resource-manage"
    icon: "folder"
    order: 2
    # 一级菜单
    level1:
      name: "系统管理"
      name_en: "System"
    # 二级菜单
    level2:
      name: "资源管理"
      name_en: "Resource Management"
    # 三级菜单（可选）
    level3:
      name: null
      name_en: null
