apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirmera-platform-schedule-scheduler
  namespace: secflow-ns
  labels:
    app: chirmera-platform-schedule
    component: scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chirmera-platform-schedule
      component: scheduler
  template:
    metadata:
      labels:
        app: chirmera-platform-schedule
        component: scheduler
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: chirmera-platform-schedule
          image: ghcr.io/runshine/chirmera-platform-schedule:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: schedule-config
              mountPath: /app/config.yaml
              subPath: config.yaml
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/chirmera-platform-schedule/health
              port: 8080
          readinessProbe:
            httpGet:
              path: /api/chirmera-platform-schedule/ready
              port: 8080
      volumes:
        - name: schedule-config
          configMap:
            name: chirmera-platform-schedule-config
            items:
              - key: config.yaml
                path: config.yaml
