# Local-first config for secflow-app-vuln-verify.
# No Kubernetes, Auth service, Project service, ConfigCenter, Menu service, or remote MySQL is required.

database:
  # Default uses local SQLite inside the container. For MySQL, set DATABASE_URL
  # or change driver/mysql fields below.
  driver: "sqlite"
  sqlite_path: "/data/vuln-verify/vuln_verify.db"
  # driver: "mysql"
  # host: "host.docker.internal"
  # port: 3306
  # username: "secflow"
  # password: "secflow"
  # name: "secflow"

local_llm:
  # Environment variables override these values:
  #   OPENAI_API_KEY / LLM_API_KEY
  #   OPENAI_BASE_URL / LLM_API_BASE
  #   OPENAI_MODEL / LLM_MODEL
  provider_key: "local_openai"
  provider_type: "openai"
  api_base: "https://api.openai.com/v1"
  api_key: null
  model: "gpt-4.1"
  context_window: 128000
  sync_on_startup: true
  sync_before_task: true

auth_service:
  # false = no Authorization header required. For a simple local shared token,
  # set enabled=true and SECFLOW_DEV_TOKEN or dev_token below.
  enabled: false
  dev_token: null

project_service:
  enabled: false

configcenter:
  enabled: false
  sync_on_startup: false
  sync_before_task: false

registry:
  enabled: false

storage:
  project_root_template: "/data/files/{project_id}"
  app_root_name: "app/secflow-app-vuln-verify"
  require_input_exists: true
  allow_external_input_paths: true

worker:
  enabled: true
  poll_interval_seconds: 3
  lease_seconds: 300
  heartbeat_interval_seconds: 15
  max_local_running_tasks: 1
  default_concurrency: 4
  max_concurrency: 16
  task_timeout_seconds: 0

app:
  host: "0.0.0.0"
  port: 8080
  debug: false

logging:
  level: "INFO"
