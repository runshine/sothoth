[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-dispatch"
version = "0.1.0"
description = "Deterministic vulnerability report router"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vuln-dispatch = "vuln_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
