[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-verify"
version = "0.1.0"
description = "Vulnerability verification pipeline - Router + Verifier"
requires-python = ">=3.11"
dependencies = [
    "vuln-dispatch",
]

[tool.uv.sources]
vuln-dispatch = { workspace = true }

[tool.uv.workspace]
members = ["packages/vuln-dispatch"]

[project.scripts]
vuln-verify = "vuln_verify.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
