apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secflow-app-poc-gen-verify-data-nfs-pvc
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify }
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-storage-192.168.13.66   # the platform's shared NFS storage class
  resources: { requests: { storage: 200Gi } }
