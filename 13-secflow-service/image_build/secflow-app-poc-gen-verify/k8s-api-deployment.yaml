apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-poc-gen-verify
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify, role: api }
spec:
  replicas: 1
  selector: { matchLabels: { name: secflow-app-poc-gen-verify, role: api } }
  template:
    metadata: { labels: { name: secflow-app-poc-gen-verify, role: api } }
    spec:
      securityContext: { fsGroup: 1000 }
      imagePullSecrets: [{ name: ghcr-secret }]   # private ghcr.io/runshine/* pull secret
      containers:
        - name: secflow-app-poc-gen-verify
          image: ghcr.io/runshine/secflow-app-poc-gen-verify:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities: { add: [SYS_PTRACE] }   # gdb ptrace (poc CLI may invoke gdb)
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: TZ, value: Asia/Shanghai }
            - { name: SERVICE_YAML, value: /app/service.yaml }
            - { name: POC_ROLE, value: api }
            - { name: POC_ENABLE_PUBLIC_API, value: "true" }
            - { name: POC_ENABLE_REGISTRY, value: "true" }
            - { name: POC_GEN_VERIFY_STATE_ROOT, value: /var/lib/secflow-poc-gen-verify }
            - { name: POC_GEN_VERIFY_WORKSPACE, value: /workspace }
            - { name: POC_GEN_VERIFY_POC_BIN, value: poc }
            - { name: POC_GEN_VERIFY_CLAUDE_MODEL, value: glm-5.2 }
            - { name: POC_SCHEDULER_HOST, value: secflow-app-poc-gen-verify-redis }
            # LOCAL_GLM (模型配置中心): http://172.31.29.10 speaks Anthropic /v1/messages
            - { name: ANTHROPIC_BASE_URL, value: "http://172.31.29.10" }
            - { name: ANTHROPIC_MODEL, value: glm-5.2 }
            - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
            - name: POC_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - secretRef: { name: secflow-app-poc-gen-verify-secret, optional: true }
          volumeMounts:
            - { name: cfg, mountPath: /app/service.yaml, subPath: service.yaml }
            - { name: poc-data, mountPath: /var/lib/secflow-poc-gen-verify }
            - { name: poc-data, mountPath: /workspace, subPath: workspace }
            - { name: fileserver, mountPath: /data }   # shared platform fileserver -> /data/files/{project_id}
          resources: { requests: { cpu: "1", memory: "2Gi" }, limits: { cpu: "4", memory: "8Gi" } }
          readinessProbe: { httpGet: { path: /api/app/poc-gen-verify/ready, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          livenessProbe:  { httpGet: { path: /api/app/poc-gen-verify/health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
      volumes:
        - name: cfg
          configMap: { name: secflow-app-poc-gen-verify-config, items: [{ key: service.yaml, path: service.yaml }] }
        - name: poc-data
          persistentVolumeClaim: { claimName: secflow-app-poc-gen-verify-data-nfs-pvc }
        - name: fileserver
          persistentVolumeClaim: { claimName: secflow-platform-fileserver-data-nfs-pvc }
