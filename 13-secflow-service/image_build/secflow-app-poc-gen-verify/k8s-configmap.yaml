apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-poc-gen-verify-config
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify }
data:
  service.yaml: |
    service_id: secflow-app-poc-gen-verify
    service_name: PoC 生成与验证服务
    api_prefix: /api/app/poc-gen-verify
    host: secflow-app-poc-gen-verify
    port: 80
    maturity: alpha
    description: "PoC 生成与 GDB 验证服务"
    database:
