      username: "secflow_poc_gen_verify"
      password: "Huawei12#$"
      name: "secflow_poc_gen_verify"
      pool_size: 5
      max_overflow: 10
    auth_service:
      host: "secflow-platform-auth"
      port: 80
      validate_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: secflow-app-poc-gen-verify
      service_name: "PoC 生成与验证"
      host: secflow-app-poc-gen-verify
      port: 80
      maturity: alpha
      description: "PoC 生成与 GDB 验证服务"
      api_prefix: /api/app/poc-gen-verify
      unregister_on_shutdown: false
      heartbeat_interval_seconds: 30
      menu:
        id: app-poc-gen-verify
        path: /app/poc-gen-verify
        icon: bug
        order: 115
        level1: { name: "应用工具", name_en: "App Tools" }
        level2: { name: "PoC 生成与验证", name_en: "PoC Gen & Verify" }
        level3: { name: "", name_en: "" }
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false
    engine:
      # 漏洞判定引擎契约（Contract v2.3）。name 必须与平台管理员预注册的 engine_name 一致。
      name: secflow-app-poc-gen-verify
      version: "1.0.0"
      endpoint_prefix: /api/app/poc-gen-verify/intake
      heartbeat_url: "http://secflow-platform-vuln/api/vuln/internal/vuln-confirm/engines/heartbeat"
