      vuln_categories_url: "http://secflow-platform-vuln/api/vuln/vuln-categories"
      vuln_categories_timeout_seconds: 5.0
      vuln_categories_cache_ttl_seconds: 1800
      emit_confirmed_category: true
      default_confirmed_category: "内存安全类型"
