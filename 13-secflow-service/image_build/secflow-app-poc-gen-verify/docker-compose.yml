# Local dev / testing stack for secflow-app-poc-gen-verify.
# Brings up Redis + MySQL + the API + a Celery worker + the scheduler dispatcher.
# The `poc` CLI + claude-code + gdb are baked into the image (build once).
#
#   docker compose up --build
#   curl http://127.0.0.1:8080/api/app/poc-gen-verify/health
#
# The GLM auth token must be supplied via ANTHROPIC_AUTH_TOKEN in a .env file
# (next to this compose file) for the worker to actually run `claude`.
services:
  redis:
    image: redis:8.0-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: "Huawei12#$"
      MYSQL_DATABASE: secflow
      MYSQL_USER: secflow
      MYSQL_PASSWORD: "Huawei12#$"
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: secflow-app-poc-gen-verify:dev
    command: ["python3", "-m", "app.main"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SERVICE_YAML: /app/service.yaml
      POC_ROLE: api
      POC_ENABLE_PUBLIC_API: "true"
      POC_ENABLE_REGISTRY: "false"
      POC_GEN_VERIFY_STATE_ROOT: /var/lib/secflow-poc-gen-verify
      POC_GEN_VERIFY_WORKSPACE: /workspace
      POC_GEN_VERIFY_POC_BIN: poc
      POC_GEN_VERIFY_CLAUDE_MODEL: glm-5.2
      POC_SCHEDULER_HOST: redis
      ANTHROPIC_BASE_URL: "http://172.31.29.10"   # LOCAL_GLM (模型配置中心)
      ANTHROPIC_MODEL: glm-5.2
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      TZ: Asia/Shanghai
    env_file: [.env]
    ports: ["8080:8080"]
    volumes:
      - ./service.dev.yaml:/app/service.yaml
      - poc-state:/var/lib/secflow-poc-gen-verify
      - poc-workspace:/workspace

  worker:
    build: .
    image: secflow-app-poc-gen-verify:dev
    command: ["celery", "-A", "app.celery_app", "worker", "-P", "prefork", "-c", "1",
              "--queues=poc", "--loglevel=info", "--hostname=poc-worker@%h"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SERVICE_YAML: /app/service.yaml
      POC_ROLE: worker
      POC_GEN_VERIFY_STATE_ROOT: /var/lib/secflow-poc-gen-verify
      POC_GEN_VERIFY_WORKSPACE: /workspace
      POC_GEN_VERIFY_POC_BIN: poc
      POC_GEN_VERIFY_CLAUDE_MODEL: glm-5.2
      POC_SCHEDULER_HOST: redis
      POC_LEASE_TTL_SECONDS: "300"
      POC_HEARTBEAT_INTERVAL_SECONDS: "60"
      POC_CELERY_MAX_TASKS_PER_CHILD: "10"
      ANTHROPIC_BASE_URL: "http://172.31.29.10"   # LOCAL_GLM (模型配置中心)
      ANTHROPIC_MODEL: glm-5.2
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      TZ: Asia/Shanghai
    env_file: [.env]
    volumes:
      - ./service.dev.yaml:/app/service.yaml
      - poc-state:/var/lib/secflow-poc-gen-verify
      - poc-workspace:/workspace

  scheduler:
    build: .
    image: secflow-app-poc-gen-verify:dev
    command: ["python3", "-m", "app.dispatcher"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SERVICE_YAML: /app/service.yaml
      POC_ROLE: scheduler
      POC_SCHEDULER_HOST: redis
      POC_DISPATCHER_PUMP_INTERVAL: "3"
      POC_DISPATCHER_STALE_INTERVAL: "30"
      TZ: Asia/Shanghai
    volumes:
      - ./service.dev.yaml:/app/service.yaml

volumes:
  redis-data:
  mysql-data:
  poc-state:
  poc-workspace:
