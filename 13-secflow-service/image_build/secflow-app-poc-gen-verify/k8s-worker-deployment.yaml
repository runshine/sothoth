apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-poc-gen-verify-worker
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify, role: worker }
spec:
  replicas: 8
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector: { matchLabels: { name: secflow-app-poc-gen-verify, role: worker } }
  template:
    metadata: { labels: { name: secflow-app-poc-gen-verify, role: worker } }
    spec:
      imagePullSecrets: [{ name: ghcr-secret }]
      containers:
        - name: poc-gen-verify-worker
          image: ghcr.io/runshine/secflow-app-poc-gen-verify:latest
          imagePullPolicy: Always
          # Run as root: can read any file on the fileserver (600/root uploaded by other services).
          # umask 022: all created files are 644/755 → the api pod (scanner) can read them.
          # --dangerously-skip-permissions is NOT passed (claude refuses root with that flag).
          # Instead, settings.json defaultMode:"auto" + skipDangerousModePermissionPrompt:true
          # (already baked in the image) auto-approve all tool calls in headless -p mode.
          securityContext:
            runAsUser: 0
            capabilities: { add: [SYS_PTRACE] }   # gdb ptrace for the poc CLI
          command: ["/bin/bash", "-c"]
          args:
            - "umask 022 && export HOME=/home/scanner && exec /usr/bin/tini -- /app/entrypoint.sh celery -A app.celery_app worker -P prefork -c 1 --queues=poc --loglevel=info --hostname=poc-worker@%h"
          env:
            - { name: TZ, value: Asia/Shanghai }
            - { name: HOME, value: /home/scanner }
            - { name: SERVICE_YAML, value: /app/service.yaml }
            - { name: POC_ROLE, value: worker }
            - { name: POC_GEN_VERIFY_STATE_ROOT, value: /tmp/secflow-poc-gen-verify }
            - { name: POC_GEN_VERIFY_WORKSPACE, value: /workspace }
            - { name: POC_GEN_VERIFY_POC_BIN, value: poc }
            - { name: POC_GEN_VERIFY_CLAUDE_MODEL, value: glm-5.2 }
            - { name: POC_SCHEDULER_HOST, value: secflow-app-poc-gen-verify-redis }
            - { name: POC_LEASE_TTL_SECONDS, value: "300" }
            - { name: POC_HEARTBEAT_INTERVAL_SECONDS, value: "60" }
            - { name: POC_CELERY_MAX_TASKS_PER_CHILD, value: "10" }
            - { name: ANTHROPIC_BASE_URL, value: "http://172.31.29.10" }
            - { name: ANTHROPIC_MODEL, value: glm-5.2 }
            - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
            - name: POC_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - secretRef: { name: secflow-app-poc-gen-verify-secret, optional: true }
          volumeMounts:
            - { name: cfg, mountPath: /app/service.yaml, subPath: service.yaml }
            - { name: fileserver, mountPath: /data }
          resources: { requests: { cpu: "2", memory: "4Gi" }, limits: { cpu: "4", memory: "8Gi" } }
          livenessProbe:
            exec: { command: ["sh", "-c", "pgrep -f 'celery.*app.celery_app' >/dev/null"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec: { command: ["sh", "-c", "pgrep -f 'celery.*app.celery_app' >/dev/null"] }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: cfg
          configMap: { name: secflow-app-poc-gen-verify-config, items: [{ key: service.yaml, path: service.yaml }] }
        - name: fileserver
          persistentVolumeClaim: { claimName: secflow-platform-fileserver-data-nfs-pvc }
