apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-poc-gen-verify-worker
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify, role: worker }
spec:
  replicas: 8
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector: { matchLabels: { name: secflow-app-poc-gen-verify, role: worker } }
  template:
    metadata: { labels: { name: secflow-app-poc-gen-verify, role: worker } }
    spec:
      securityContext: { fsGroup: 1000 }
      imagePullSecrets: [{ name: ghcr-secret }]
      # Sidecar: runs as root, continuously chmods poc-gen-verify files on the fileserver
      # so the scanner user (worker) can read them. Handles files uploaded AFTER pod startup
      # (the old initContainer only ran once at startup → new 600/root files stayed unreadable).
      # Runs every 5s → new files become readable within 5s of upload.
      initContainers:
        - name: chmod-once
          image: ghcr.io/runshine/secflow-app-poc-gen-verify:latest
          imagePullPolicy: IfNotPresent
          securityContext: { runAsUser: 0 }
          command: [sh, -c, "find /data/files/*/app/secflow-app-poc-gen-verify -exec chmod a+rX {} + 2>/dev/null; find /data/files/*/app/secflow-app-poc-gen-verify/workspaces -type d -exec chmod a+rwx {} + 2>/dev/null || true"]
          volumeMounts:
            - { name: fileserver, mountPath: /data }
      containers:
        - name: chmod-sidecar
          image: ghcr.io/runshine/secflow-app-poc-gen-verify:latest
          imagePullPolicy: IfNotPresent
          securityContext: { runAsUser: 0 }
          command: [sh, -c, "while true; do find /data/files/*/app/secflow-app-poc-gen-verify -exec chmod a+rX {} + 2>/dev/null; find /data/files/*/app/secflow-app-poc-gen-verify/workspaces -type d -exec chmod a+rwx {} + 2>/dev/null || true; sleep 5; done"]
          volumeMounts:
            - { name: fileserver, mountPath: /data }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
        - name: poc-gen-verify-worker
          image: ghcr.io/runshine/secflow-app-poc-gen-verify:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities: { add: [SYS_PTRACE] }   # gdb ptrace for the poc CLI
          # entrypoint.sh (claude config setup) MUST run before celery — the poc
          # CLI spawns `claude`, which needs ~/.claude.json + ~/.claude/settings.json.
          command: ["/usr/bin/tini", "--", "/app/entrypoint.sh"]
          args: ["celery", "-A", "app.celery_app", "worker", "-P", "prefork", "-c", "1",
                 "--queues=poc", "--loglevel=info", "--hostname=poc-worker@%h"]
          env:
            - { name: TZ, value: Asia/Shanghai }
            - { name: SERVICE_YAML, value: /app/service.yaml }
            - { name: POC_ROLE, value: worker }
            - { name: POC_GEN_VERIFY_STATE_ROOT, value: /tmp/secflow-poc-gen-verify }
            - { name: POC_GEN_VERIFY_WORKSPACE, value: /workspace }
            - { name: POC_GEN_VERIFY_POC_BIN, value: poc }
            - { name: POC_GEN_VERIFY_CLAUDE_MODEL, value: glm-5.2 }
            - { name: POC_SCHEDULER_HOST, value: secflow-app-poc-gen-verify-redis }
            - { name: POC_LEASE_TTL_SECONDS, value: "300" }
            - { name: POC_HEARTBEAT_INTERVAL_SECONDS, value: "60" }
            - { name: POC_CELERY_MAX_TASKS_PER_CHILD, value: "10" }
            # LOCAL_GLM (模型配置中心): http://172.31.29.10 speaks Anthropic /v1/messages
            - { name: ANTHROPIC_BASE_URL, value: "http://172.31.29.10" }
            - { name: ANTHROPIC_MODEL, value: glm-5.2 }
            - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
            - name: POC_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - secretRef: { name: secflow-app-poc-gen-verify-secret, optional: true }
          volumeMounts:
            - { name: cfg, mountPath: /app/service.yaml, subPath: service.yaml }
            - { name: fileserver, mountPath: /data }   # shared platform fileserver -> /data/files/{project_id}
          resources: { requests: { cpu: "2", memory: "4Gi" }, limits: { cpu: "4", memory: "8Gi" } }
          # worker runs celery (not uvicorn) — liveness via process check
          livenessProbe:
            exec: { command: ["sh", "-c", "pgrep -f 'celery.*app.celery_app' >/dev/null"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec: { command: ["sh", "-c", "pgrep -f 'celery.*app.celery_app' >/dev/null"] }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: cfg
          configMap: { name: secflow-app-poc-gen-verify-config, items: [{ key: service.yaml, path: service.yaml }] }
        - name: fileserver
          persistentVolumeClaim: { claimName: secflow-platform-fileserver-data-nfs-pvc }
