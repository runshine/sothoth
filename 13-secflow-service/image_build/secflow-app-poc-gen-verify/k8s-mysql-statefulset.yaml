apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secflow-app-poc-gen-verify-mysql
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify, component: mysql }
spec:
  serviceName: secflow-app-poc-gen-verify-mysql
  replicas: 1
  selector:
    matchLabels: { name: secflow-app-poc-gen-verify, component: mysql }
  template:
    metadata:
      labels: { name: secflow-app-poc-gen-verify, component: mysql }
    spec:
      containers:
        - name: mysql
          image: ghcr.io/runshine/mysql:9.5.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: secflow-app-poc-gen-verify-mysql-secret }
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          livenessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "mysqladmin ping -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "mysqladmin ping -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels: { name: secflow-app-poc-gen-verify, component: mysql }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 50Gi }
        storageClassName: local-path
        volumeMode: Filesystem
