# Example secret — create with: kubectl apply -f k8s-secret.example.yaml (after editing)
# OR: kubectl create secret generic secflow-app-poc-gen-verify-secret \
#       --from-literal=ANTHROPIC_AUTH_TOKEN='sk-ws-...'
apiVersion: v1
kind: Secret
metadata:
  name: secflow-app-poc-gen-verify-secret
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify }
type: Opaque
stringData:
  # LOCAL_GLM (模型配置中心) auth token (Bearer). claude reads this from env.
  # Real value created out-of-band via:
  #   kubectl create secret generic secflow-app-poc-gen-verify-secret -n secflow-ns \
  #     --from-literal=ANTHROPIC_AUTH_TOKEN='sk-...LOCAL_GLM key...'
  ANTHROPIC_AUTH_TOKEN: "sk-ws-REPLACE_ME"
