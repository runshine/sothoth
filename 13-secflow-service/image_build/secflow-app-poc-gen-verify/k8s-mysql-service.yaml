apiVersion: v1
kind: Service
metadata:
  name: secflow-app-poc-gen-verify-mysql
  namespace: secflow-ns
  labels: { name: secflow-app-poc-gen-verify, component: mysql }
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  selector: { name: secflow-app-poc-gen-verify, component: mysql }
