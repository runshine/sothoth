# This manifest intentionally does not hardcode Codex/OpenCode credentials.
# First-round deployment-time LLM Provider injection is wired through the compose-style
# platform template `docker-compose.platform.yml`, not through a separate runtime injector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-ipc-audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secflow-app-ipc-audit
  template:
    metadata:
      labels:
        app: secflow-app-ipc-audit
    spec:
      containers:
        - name: secflow-app-ipc-audit
          image: secflow-app-ipc-audit:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 8080
          env:
            - name: IPC_AUDIT_DATABASE_URL
              value: sqlite:////var/lib/secflow-ipc-audit/ipc-audit.db
            - name: IPC_AUDIT_STATE_ROOT
              value: /var/lib/secflow-ipc-audit
            - name: IPC_AUDIT_EXECUTION_MODE
              value: agentflow_cli
            - name: IPC_AUDIT_MAX_PARALLEL_TASKS
              value: "1"
            - name: IPC_AUDIT_DEFAULT_WORKSPACE_ID
              value: oh61-main
            - name: IPC_AUDIT_CODEX_BIN
              value: /usr/local/bin/codex
            - name: IPC_AUDIT_OPENCODE_BIN
              value: /usr/local/bin/opencode
            - name: IPC_AUDIT_AGENTFLOW_ROOT
              value: /home/icsl/agentflow-alpha
            - name: IPC_AUDIT_AGENTFLOW_PYTHON_BIN
              value: /usr/local/bin/python3
            - name: IPC_AUDIT_AGENTFLOW_AGENT
              value: opencode
            - name: HDC_BIN
              value: /workspace/openharmony_6_1/vendor/edu/docker/src/hdc
            - name: LD_LIBRARY_PATH
              value: /workspace/openharmony_6_1/vendor/edu/docker/src
            - name: OHEMU_HELPER_BIN
              value: /usr/local/bin/ipc-audit-qemu
            - name: OHEMU_WORKSPACE_ROOT
              value: /workspace/openharmony_6_1
            - name: OHEMU_QCOW2_PREPARED_ROOT
              value: /workspace/openharmony_6_1/vendor/edu/docker/volumes/qcow2_cache
            - name: OHEMU_RUNTIME_ROOT
              value: /var/lib/secflow-ipc-audit/ohemu
            - name: OHEMU_ARCH
              value: arm64
            - name: OHEMU_NETWORK_MODE
              value: bridge
            - name: OHEMU_HDC_BIND
              value: 127.0.0.1
            - name: OHEMU_HDC_BASE_PORT
              value: "55555"
            - name: OHEMU_WAIT_FOR_HDC_READY
              value: "1"
            - name: OHEMU_HDC_READY_TIMEOUT
              value: "180"
            - name: IPC_AUDIT_WORKSPACES_JSON
              value: >-
                [{"workspace_id":"oh61-main","display_name":"OpenHarmony 6.1 Main Tree","repo_root":"/workspace/openharmony_6_1","entries_file":".audit/ipc_entries.txt","bundle_scan_roots":["base","foundation"],"allow_custom_project_path":true,"supports_poc":true,"default_pipeline_mode":"custom_graph","is_default":true}]
          volumeMounts:
            - name: ipc-audit-state
              mountPath: /var/lib/secflow-ipc-audit
            - name: oh-workspace
              mountPath: /workspace/openharmony_6_1
              readOnly: true
            - name: agentflow-root
              mountPath: /home/icsl/agentflow-alpha
              readOnly: true
            - name: dev-net-tun
              mountPath: /dev/net/tun
          readinessProbe:
            httpGet:
              path: /api/app/ipc-audit/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/app/ipc-audit/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: ipc-audit-state
          persistentVolumeClaim:
            claimName: secflow-ipc-audit-state-pvc
        - name: oh-workspace
          persistentVolumeClaim:
            claimName: openharmony-workspace-pvc
        - name: agentflow-root
          hostPath:
            path: /home/icsl/agentflow-alpha
            type: Directory
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: secflow-app-ipc-audit
spec:
  selector:
    app: secflow-app-ipc-audit
  ports:
    - port: 80
      targetPort: 8080
