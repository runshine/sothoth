[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-dynamic-verify"
version = "0.2.0"
description = "Qiling-based firmware vulnerability POC dynamic verification"
requires-python = ">=3.11"
dependencies = ["qiling>=1.4.0"]

[project.scripts]
poc-dynamic-verify = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
