# SecFlow Project Management Service Configuration

# Database Configuration (MySQL)
database:
  host: "172.31.30.100"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  table_prefix: "secflow_"
  pool_size: 10
  max_overflow: 20

# Auth Service Configuration
auth_service:
  host: "192.168.12.44"
  port: 10000
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
  timeout: 10
  # Token缓存配置
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

# Menu Registration Center Configuration
registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secflow-project"
  service_name: "项目管理服务"
  host: "0.0.0.0"
  port: 10004
  maturity: "已上线"
  description: "提供项目的创建、查询、删除、修改等功能"
  api_prefix: "/api/project"
  menu:
    id: "project-manage"
    path: "/project"
    icon: "folder"
    order: 2
    # 一级菜单
    level1:
      name: "系统管理"
      name_en: "System"
    # 二级菜单
    level2:
      name: "用户管理"
      name_en: "User Management"
    # 三级菜单（可选）
    level3:
      name: "项目管理"
      name_en: "Project Management"

# Kubernetes Configuration
kubernetes:
  # true: 在K8S集群内运行，使用serviceaccount
  # false: 集群外调试，使用kubeconfig
  in_cluster: false
  # Kubeconfig路径（集群外调试时使用）
  kubeconfig: "/home/runshine/.kube/config"
  # 连接超时时间（秒）
  connection_timeout: 30

# K8S API Service配置（统一通过secflow-platform-k8s）
k8s_service:
  host: "secflow-platform-k8s"
  port: 80
  timeout: 30

# TLS Secret Configuration
# 用于在项目的K8S Namespace中创建TLS Secret
tls_secret:
  # 目标项目命名空间中的 TLS Secret 名称
  name: "wildcard-sothothv2.com-tls"
  # 源公共TLS Secret所在命名空间
  source_namespace: "secflow-ns"
  # 源公共TLS Secret名称（由setup-ingress-tls.sh初始化）
  source_secret_name: "wildcard-sothothv2.com-tls"

# Application Configuration
app:
  host: "0.0.0.0"
  port: 10001
  debug: false

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
