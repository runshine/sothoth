apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-user
  namespace: sothothv2-ns
  labels:
    app: secflow-user
    version: v1
spec:
  replicasCount: 3
  selector:
    matchLabels:
      app: secflow-user
  template:
    metadata:
      labels:
        app: secflow-user
        version: v1
    spec:
      containers:
        - name: secflow-user
          image: secflow-user:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /app
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: secflow-user-config
---
apiVersion: v1
kind: Service
metadata:
  name: secflow-user
  namespace: sothothv2-ns
spec:
  type: ClusterIP
  selector:
    app: secflow-user
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http