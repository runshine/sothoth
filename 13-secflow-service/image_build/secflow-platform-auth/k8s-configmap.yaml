apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-user-config
  namespace: sothothv2-ns
data:
  config.yaml: |
    # 数据库配置（MySQL）
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      charset: "utf8mb4"

    # 应用配置
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    # JWT配置
    jwt:
      secret_key: "secflow-jwt-secret-key-change-in-production"
      algorithm: "HS256"
      access_token_expire_minutes: 1440

    # Project Service Configuration
    project_service:
      host: "secflow-platform-project"
      port: 80
      project_list_path: "/api/project/list"
      timeout: 10
