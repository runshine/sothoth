database:
  host: "mysql.sothothv2-ns.svc.cluster.local"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  pool_size: 5
  max_overflow: 10

auth_service:
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "replace-me"
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

project_service:
  host: "secflow-platform-project"
  port: 80
  get_project_path: "/api/project"
  timeout: 10

http_client:
  keepalive_expiry_seconds: 5
  max_keepalive_connections: 20
  max_connections: 100
  retry_count: 1

storage:
  project_root_template: "/data/files/{project_id}"
  app_root_name: "app/secflow-app-binary-security"
  fileserver_subproject_name: "__binary_security__"
  require_input_exists: true
  min_free_disk_bytes: 1073741824
  max_upload_file_bytes: 2147483648
  max_source_archive_bytes: 2147483648
  max_source_extract_bytes: 8589934592
  max_source_extract_files: 200000

scheduler:
  enabled: true
  poll_interval_seconds: 5
  task_concurrency: 2
  stage_poll_interval_seconds: 5
  downstream_reconcile_interval_seconds: 30
  readless_reconcile_interval_seconds: 300
  heartbeat_update_interval_seconds: 15
  downstream_reconcile_grace_seconds: 30
  shutdown_grace_seconds: 10
  archive_job_concurrency: 4
  archive_reclaim_timeout_seconds: 300
  archive_reclaim_max_attempts: 3
  downstream_sync_concurrency: 8
  downstream_action_concurrency: 8
  downstream_request_timeout_seconds: 120

queue:
  enabled: true
  redis_url: "redis://secflow-app-binary-security-redis.secflow-ns.svc.cluster.local:6379/0"
  task_queue_key: "secflow:binary-security:tasks"
  block_timeout_seconds: 5
  reconcile_interval_seconds: 30
  seed_batch_size: 20
  startup_ready_timeout_seconds: 60
  startup_retry_interval_seconds: 2

runtime_policy:
  pipeline_mode: barrier
  max_stage_parallelism: 4
  max_retries_per_item: 2
  continue_on_item_failure: true

services:
  firmware_unpacker:
    base_url: "http://secflow-app-firmware-unpacker"
    timeout: 60
  system_analyse:
    base_url: "http://secflow-app-system-analyse"
    timeout: 60
  binary_to_source:
    base_url: "http://secflow-app-binary-to-source-manager"
    timeout: 60
  entry_analyse:
    base_url: "http://secflow-app-entry-analyse"
    timeout: 60
  dataflow_vuln_scan:
    base_url: "http://secflow-app-dataflow-vuln-scan"
    timeout: 120
  fileserver:
    base_url: "http://secflow-platform-fileserver/api/fileserver"
    timeout: 30
    data_mount_path: "/data"
    project_files_dirname: "files"
    subproject_name: "__binary_security__"

registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu"
  service_id: "secflow-app-binary-security"
  service_name: "二进制安全编排服务"
  host: "secflow-app-binary-security"
  port: 80
  maturity: "开发中"
  description: "统一串联固件解包、系统分析、反编译、入口分析和数据流漏洞挖掘"
  api_prefix: "/api/app/binary-security"
  menu:
    id: "secflow-app-binary-security"
    path: "/binary-security"
    icon: "shield"
    order: 26
    level1:
      name: "安全执行"
      name_en: "Execution"
    level2:
      name: "二进制安全"
      name_en: "BinarySecurity"
    level3:
      name: "统一编排"
      name_en: "Orchestration"

app:
  host: "0.0.0.0"
  port: 8080
  debug: false
  timeout_keep_alive_seconds: 30

logging:
  level: "INFO"

# Build trigger note:
# Keep a no-op tracked change available when we need to force the
# binary-security image workflow after orchestration-only fixes.
