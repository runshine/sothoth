apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-binary-security-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      name: secflow-app-binary-security
      role: worker
  template:
    metadata:
      labels:
        name: secflow-app-binary-security
        role: worker
    spec:
      terminationGracePeriodSeconds: 120
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: secflow-app-binary-security-worker
          image: ghcr.io/runshine/secflow-app-binary-security:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SECFLOW_BINARY_SECURITY_CONFIG
              value: /app/config.yaml
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: SECFLOW_BINARY_SECURITY_ROLE
              value: worker
            - name: SECFLOW_BINARY_SECURITY_ENABLE_SCHEDULER
              value: "true"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: BOOT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
            - containerPort: 18080
              name: probe
          volumeMounts:
            - name: secflow-app-binary-security-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: secflow-platform-fileserver-data-nfs-pvc
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /api/app/binary-security/health
              port: 18080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/app/binary-security/health
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/app/binary-security/ready
              port: 18080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 30"]
      volumes:
        - name: secflow-app-binary-security-config
          configMap:
            name: secflow-app-binary-security-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
