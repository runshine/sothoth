apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secflow-app-dataflow-vuln-scanner-worker
  namespace: secflow-ns
spec:
  serviceName: secflow-app-dataflow-vuln-scanner-worker-headless
  replicas: 2
  selector:
    matchLabels:
      app: secflow-app-dataflow-vuln-scanner
      role: worker
  template:
    metadata:
      labels:
        app: secflow-app-dataflow-vuln-scanner
        role: worker
        name: secflow-app-dataflow-vuln-scanner-worker
    spec:
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: secflow-app-dataflow-vuln-scanner
            role: worker
      containers:
      - name: secflow-app-dataflow-vuln-scanner-worker
        image: ghcr.io/runshine/secflow-app-dataflow-vuln-scanner:20260513-7d01e0f
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                curl -fsS -m 55 -X POST \
                  -H "Authorization: Bearer ${SECFLOW_DATAFLOW_SERVICE_MACHINE_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{"reason":"worker pod terminating","wait_seconds":45}' \
                  http://127.0.0.1:8080/api/v1/jobs/drain || true
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: CONFIG_PATH
          value: /app/config.yaml
        - name: SECFLOW_DATAFLOW_ROLE
          value: worker
        - name: PI_MODELS_JSON
          value: /root/.pi/agent/models.json
        - name: PI_CODING_AGENT_DIR
          value: /root/.pi/agent
        - name: QT_QPA_PLATFORM
          value: offscreen
        - name: POD_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SECFLOW_DATAFLOW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secflow-app-dataflow-vuln-scanner-secret
              key: db-password
        - name: SECFLOW_DATAFLOW_SERVICE_MACHINE_TOKEN
          valueFrom:
            secretKeyRef:
              name: secflow-app-dataflow-vuln-scanner-secret
              key: service-machine-token
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-dataflow-vuln-scanner-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secflow-platform-fileserver-data
          mountPath: /data
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "4"
        readinessProbe:
          httpGet:
            path: /api/dataflow-vuln-scanner/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/dataflow-vuln-scanner/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: secflow-app-dataflow-vuln-scanner-config
        configMap:
          name: secflow-app-dataflow-vuln-scanner-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: secflow-platform-fileserver-data
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
---
