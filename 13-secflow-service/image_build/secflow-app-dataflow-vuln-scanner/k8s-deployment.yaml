apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-dataflow-vuln-scanner
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-app-dataflow-vuln-scanner
  template:
    metadata:
      labels:
        name: secflow-app-dataflow-vuln-scanner
    spec:
      containers:
      - name: secflow-app-dataflow-vuln-scanner
        image: ghcr.io/q1ngh3/secflow-app-dataflow-vuln-scanner:latest
        imagePullPolicy: Always
        args:
        - serve
        env:
        - name: CONFIG_PATH
          value: /app/config.yaml
        - name: POD_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-dataflow-vuln-scanner-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secflow-platform-fileserver-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /api/dataflow-vuln-scanner/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /api/dataflow-vuln-scanner/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: secflow-app-dataflow-vuln-scanner-config
        configMap:
          name: secflow-app-dataflow-vuln-scanner-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: secflow-platform-fileserver-data
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: secflow-app-dataflow-vuln-scanner
  namespace: secflow-ns
spec:
  type: ClusterIP
  selector:
    name: secflow-app-dataflow-vuln-scanner
  ports:
  - name: http
    port: 80
    targetPort: 8080
