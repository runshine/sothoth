apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-dataflow-vuln-scanner
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-app-dataflow-vuln-scanner
  template:
    metadata:
      labels:
        name: secflow-app-dataflow-vuln-scanner
    spec:
      containers:
      - name: secflow-app-dataflow-vuln-scanner
        image: ghcr.io/q1ngh3/secflow-app-dataflow-vuln-scanner:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -lc
        args:
        - |
          set -euo pipefail
          restore_archive() {
            local archive_path="$1"
            local target_dir="$2"
            if [ ! -f "$archive_path" ]; then
              return 0
            fi
            echo "[bootstrap] restoring ${target_dir} from ${archive_path}"
            rm -rf "$target_dir"
            mkdir -p /root
            tar --no-same-owner -xzf "$archive_path" -C /root
          }
          restore_archive /opt/runtime-bootstrap/pi-home.tar.gz /root/.pi
          restore_archive /opt/runtime-bootstrap/copilot-home.tar.gz /root/.copilot
          export PI_BOOTSTRAP_DIR=/opt/runtime-bootstrap-disabled
          exec /usr/local/bin/secflow-entrypoint serve
        env:
          - name: TZ
            value: Asia/Shanghai
        - name: CONFIG_PATH
          value: /app/config.yaml
        - name: POD_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-dataflow-vuln-scanner-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secflow-platform-fileserver-data
          mountPath: /data
        - name: secflow-app-dataflow-vuln-scanner-runtime-home
          mountPath: /opt/runtime-bootstrap
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/dataflow-vuln-scanner/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /api/dataflow-vuln-scanner/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: secflow-app-dataflow-vuln-scanner-config
        configMap:
          name: secflow-app-dataflow-vuln-scanner-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: secflow-platform-fileserver-data
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
      - name: secflow-app-dataflow-vuln-scanner-runtime-home
        secret:
          secretName: secflow-app-dataflow-vuln-scanner-runtime-home
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: secflow-app-dataflow-vuln-scanner
  namespace: secflow-ns
spec:
  type: ClusterIP
  selector:
    name: secflow-app-dataflow-vuln-scanner
  ports:
  - name: http
    port: 80
    targetPort: 8080
