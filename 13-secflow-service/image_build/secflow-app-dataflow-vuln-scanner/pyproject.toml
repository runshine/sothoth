[project]
name = "workflow-framework"
version = "0.1.0"
description = "Multi-agent collaborative workflow framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "structlog>=23.0",
    "jsonschema>=4.0",
    "aiofiles>=23.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
workflow-run = "src.main:cli_entry"
