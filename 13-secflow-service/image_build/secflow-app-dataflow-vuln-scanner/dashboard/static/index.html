<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漏洞扫描 Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="header">
  <div class="header-left">
    <span class="logo">🛡️</span>
    <h1>漏洞扫描 Dashboard</h1>
  </div>
  <div class="header-right">
    <label class="toggle-label">
      <input type="checkbox" id="autoRefresh" checked>
      <span class="toggle-slider"></span>
      自动刷新
    </label>
    <button id="btnRefresh" class="btn btn-sm" onclick="App.refresh()">↻ 刷新</button>
  </div>
</header>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <input type="text" id="searchInput" placeholder="搜索 runs..." oninput="App.filterRuns(this.value)">
    </div>
    <div id="runsList" class="runs-list"></div>
  </aside>

  <main id="mainContent">
    <div id="welcomeView" class="welcome">
      <div class="welcome-icon">📊</div>
      <h2>选择一个 Run 查看详情</h2>
      <p>左侧列表显示所有运行记录，点击查看详细分析结果</p>
    </div>

    <div id="runDetail" class="run-detail" style="display:none">
      <div class="detail-header">
        <div class="detail-title">
          <h2 id="runName"></h2>
          <span id="runStatus" class="badge"></span>
          <span id="runMode" class="badge badge-mode"></span>
        </div>
        <div id="runMeta" class="detail-meta"></div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-tab="overview" onclick="App.switchTab('overview')">概览</button>
        <button class="tab" data-tab="cycles" onclick="App.switchTab('cycles')">评审轮次</button>
        <button class="tab" data-tab="results" onclick="App.switchTab('results')">漏洞结果</button>
        <button class="tab" data-tab="sessions" onclick="App.switchTab('sessions')">会话记录</button>
        <button class="tab" data-tab="files" onclick="App.switchTab('files')">文件浏览</button>
        <button class="tab" data-tab="log" onclick="App.switchTab('log')">运行日志</button>
        <button class="tab tab-danger" onclick="App.showDeleteModal()">🗑 删除</button>
      </nav>

      <div id="tabOverview" class="tab-content active">
        <div class="grid-2">
          <div class="card" id="scoreChart"></div>
          <div class="card" id="issuesCard"></div>
        </div>
        <div class="card" id="manifestCard"></div>
        <div class="card" id="cycleTimeline"></div>
      </div>

      <div id="tabCycles" class="tab-content">
        <div id="cyclesContainer"></div>
      </div>

      <div id="tabResults" class="tab-content">
        <div id="resultsContainer"></div>
      </div>

      <div id="tabSessions" class="tab-content">
        <div id="sessionsContainer"></div>
      </div>

      <div id="tabFiles" class="tab-content">
        <div id="filesContainer"></div>
      </div>

      <div id="tabLog" class="tab-content">
        <div class="card">
          <pre id="logContent" class="log-viewer"></pre>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Delete confirmation modal -->
<div id="deleteModal" class="modal" onclick="if(event.target===this)App.closeDeleteModal()">
  <div class="modal-content" style="max-width:440px">
    <div class="modal-header">
      <span>⚠️ 确认删除</span>
      <button onclick="App.closeDeleteModal()" class="btn-close">✕</button>
    </div>
    <div class="modal-body" style="text-align:center">
      <p style="margin-bottom:8px">确定要删除运行记录 <strong id="deleteRunName"></strong> 吗？</p>
      <p class="text-muted" style="font-size:12px">此操作将永久删除本地文件夹，不可恢复</p>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
        <button class="btn" onclick="App.closeDeleteModal()">取消</button>
        <button class="btn btn-danger" id="confirmDeleteBtn" onclick="App.confirmDeleteRun()">删除</button>
      </div>
    </div>
  </div>
</div>

<!-- File viewer modal -->
<div id="fileModal" class="modal" onclick="if(event.target===this)App.closeFile()">
  <div class="modal-content">
    <div class="modal-header">
      <span id="fileModalTitle"></span>
      <button onclick="App.closeFile()" class="btn-close">✕</button>
    </div>
    <div id="fileModalBody" class="modal-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
