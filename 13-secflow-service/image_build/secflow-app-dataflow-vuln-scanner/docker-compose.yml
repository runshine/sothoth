x-dataflow-vuln-scanner-env: &dataflow-vuln-scanner-env
  CONFIG_PATH: /app/config.yaml
  SECFLOW_DATAFLOW_ROLE: ${SECFLOW_DATAFLOW_ROLE:-standalone}
  POD_NAMESPACE: ${POD_NAMESPACE:-secflow-ns}
  HOME: /root
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

x-dataflow-vuln-scanner-base: &dataflow-vuln-scanner-base
  image: ${IMAGE_NAME:-secflow-app-dataflow-vuln-scanner:latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INSTALL_PI_CLI: ${INSTALL_PI_CLI:-1}
      PI_NPM_PACKAGE: ${PI_NPM_PACKAGE:-@mariozechner/pi-coding-agent}
  working_dir: /app
  environment:
    <<: *dataflow-vuln-scanner-env
  volumes:
    - ${HOST_CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
    - ${HOST_RUNS_DIR:-./runs}:/app/runs
    - ${HOST_DATA_DIR:-./docker/data}:/data
    - ${HOST_PI_HOME:-./.docker-pi-home}:/root/.pi

services:
  dataflow-vuln-scanner:
    <<: *dataflow-vuln-scanner-base
    environment:
      <<: *dataflow-vuln-scanner-env
      SECFLOW_DATAFLOW_ROLE: manager
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    command:
      - serve

  dataflow-vuln-scanner-worker:
    <<: *dataflow-vuln-scanner-base
    container_name: dataflow-vuln-scanner-worker
    environment:
      <<: *dataflow-vuln-scanner-env
      SECFLOW_DATAFLOW_ROLE: worker
    command:
      - serve

  vuln-scan:
    <<: *dataflow-vuln-scanner-base
    profiles:
      - cli
    volumes:
      - ${HOST_CONFIG_FILE:-./config.yaml}:/app/config.yaml:ro
      - ${HOST_RUNS_DIR:-./runs}:/app/runs
      - ${HOST_INPUT_DIR:-./docker/input}:/data:ro
      - ${HOST_PI_HOME:-./.docker-pi-home}:/root/.pi
    command:
      - --data-flow
      - /data/${DATA_FLOW_FILENAME:-data_flow.md}
      - --source-dir
      - /data/${SOURCE_DIRNAME:-source}
      - --run-name
      - ${RUN_NAME:-docker_scan}
      - --model
      - ${MODEL:-icsl/zai-org/GLM-5}
      - --provider
      - ${PROVIDER:-anthropic}
      - --thinking
      - ${THINKING:-high}
      - --max-cycles
      - "${MAX_CYCLES:-10}"
      - --worker-timeout
      - "${WORKER_TIMEOUT:-1800}"
      - --advisor-timeout
      - "${ADVISOR_TIMEOUT:-1800}"
      - --result-review-concurrency
      - "${RESULT_REVIEW_CONCURRENCY:-3}"
