apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-workflow-config
  namespace: secflow
data:
  config.yaml: |
    # SecFlow Workflow Service Configuration

    # Database Configuration (MySQL)
    database:
      host: "10.112.2.4"
      port: 3306
      username: "root"
      password: "password"
      name: "sothoth"
      table_prefix: "secflow_platform_workflow_"
      pool_size: 10
      max_overflow: 20

    # Auth Service Configuration
    auth_service:
      host: "secflow-platform-auth.secflow.svc.cluster.local"
      port: 8080
      validate_token_path: "/api/auth/validate-human-token"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15

    # Menu Registration Center Configuration
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu.secflow.svc.cluster.local:80"
      service_id: "secflow-workflow"
      service_name: "工作流编排服务"
      host: "0.0.0.0"
      port: 8080
      maturity: "开发中"
      description: "提供应用模板、JOB模板和工作流编排管理功能"
      api_prefix: "/api/workflow"
      menu:
        id: "workflow-manage"
        path: "/workflow"
        icon: "workflow"
        order: 5
        level1:
          name: "系统管理"
          name_en: "System"
        level2:
          name: "编排管理"
          name_en: "Orchestration"
        level3:
          name: "工作流编排"
          name_en: "Workflow"

    # Kubernetes Configuration
    kubernetes:
      connection_mode: "incluster"
      connection_timeout: 30

    # Application Configuration
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    # Logging Configuration
    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-workflow-secret
  namespace: secflow
type: Opaque
stringData:
  database-password: "password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-workflow-service
  namespace: secflow
  labels:
    app: secflow-workflow-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secflow-workflow-service
  template:
    metadata:
      labels:
        app: secflow-workflow-service
        version: v1
    spec:
      serviceAccountName: secflow-workflow-sa
      containers:
        - name: secflow-workflow
          image: ghcr.io/runshine/secflow-platform-workflow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: CONFIG_PATH
              value: /app/config/config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/workflow/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/workflow/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: secflow-workflow-config
---
apiVersion: v1
kind: Service
metadata:
  name: secflow-workflow-service
  namespace: secflow
  labels:
    app: secflow-workflow-service
spec:
  type: ClusterIP
  selector:
    app: secflow-workflow-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secflow-workflow-sa
  namespace: secflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secflow-workflow-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secflow-workflow-binding
subjects:
  - kind: ServiceAccount
    name: secflow-workflow-sa
    namespace: secflow
roleRef:
  kind: ClusterRole
  name: secflow-workflow-role
  apiGroup: rbac.authorization.k8s.io
