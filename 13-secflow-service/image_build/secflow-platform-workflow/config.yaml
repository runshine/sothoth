# SecFlow Workflow Service Configuration

# Database Configuration (MySQL)
database:
  host: "172.31.30.100"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  table_prefix: "secflow_workflow_"
  pool_size: 10
  max_overflow: 20

# Auth Service Configuration
auth_service:
  enabled: true
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

# Menu Registration Center Configuration
registry:
  enabled: false
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secflow-workflow"
  service_name: "工作流编排服务"
  host: "0.0.0.0"
  port: 80
  maturity: "开发中"
  description: "提供应用模板、JOB模板和工作流编排管理功能"
  api_prefix: "/api/workflow"
  menu:
    id: "workflow-manage"
    path: "/workflow"
    icon: "workflow"
    order: 5
    level1:
      name: "系统管理"
      name_en: "System"
    level2:
      name: "编排管理"
      name_en: "Orchestration"
    level3:
      name: "工作流编排"
      name_en: "Workflow"

# K8S Service Configuration (调用K8S微服务)
k8s_service:
  enabled: true  # 是否启用K8S微服务调用模式
  host: "secflow-platform-k8s"
  port: 80
  timeout: 30

# Workflow Status Service Configuration
workflow_status_service:
  enabled: true
  host: "secflow-platform-workflow-status"
  port: 80
  timeout: 30

# Fileserver Service Configuration
fileserver_service:
  enabled: true
  host: "secflow-platform-fileserver"
  port: 80
  timeout: 30
  project_mount_strategy: "nfs"
  project_mount_nfs_server: "172.31.30.81"
  project_mount_nfs_base_path: "/nvme/share_k8s/secflow-ns-secflow-platform-fileserver-data-nfs-pvc-pvc-64baa81c-80d0-4b69-91ca-a6a8d4f03292"

# Config Center Service Configuration
configcenter_service:
  enabled: true
  host: "secflow-platform-configcenter"
  port: 80
  timeout: 30

# Application Configuration
app:
  host: "0.0.0.0"
  port: 8080
  debug: false

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
