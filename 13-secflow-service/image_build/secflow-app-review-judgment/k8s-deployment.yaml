apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-review-judgment-api
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secflow-app-review-judgment
      role: api
  template:
    metadata:
      labels:
        app: secflow-app-review-judgment
        role: api
        name: secflow-app-review-judgment-api
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: secflow-app-review-judgment
            role: api
      containers:
      - name: secflow-app-review-judgment-api
        image: ghcr.io/runshine/secflow-app-review-judgment:latest
        imagePullPolicy: Always
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: CONFIG_PATH
          value: /app/config.yaml
        - name: SECFLOW_REVIEW_JUDGMENT_ROLE
          value: api
        - name: POD_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SECFLOW_REVIEW_JUDGMENT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secflow-app-review-judgment-secret
              key: db-password
        - name: SECFLOW_REVIEW_JUDGMENT_SERVICE_MACHINE_TOKEN
          valueFrom:
            secretKeyRef:
              name: secflow-app-review-judgment-secret
              key: service-machine-token
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-review-judgment-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secflow-platform-fileserver-data
          mountPath: /data
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /api/review-judgment/ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/review-judgment/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: secflow-app-review-judgment-config
        configMap:
          name: secflow-app-review-judgment-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: secflow-platform-fileserver-data
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: secflow-app-review-judgment
  namespace: secflow-ns
spec:
  type: ClusterIP
  selector:
    app: secflow-app-review-judgment
    role: api
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-review-judgment-config
  namespace: secflow-ns
data:
  config.yaml: |
    app:
      host: 0.0.0.0
      port: 8080
      debug: false

    database:
      host: 172.31.30.100
      port: 3306
      username: secflow
      password: "${SECFLOW_REVIEW_JUDGMENT_DB_PASSWORD}"
      name: secflow
      table_prefix: secflow_review_judgment_
      pool_size: 20
      max_overflow: 10
      pool_timeout: 30

    auth_service:
      enabled: true
      host: secflow-platform-auth
      port: 80
      validate_human_token_path: /api/auth/validate-human-token
      validate_machine_token_path: /api/auth/validate-token
      service_machine_token: "${SECFLOW_REVIEW_JUDGMENT_SERVICE_MACHINE_TOKEN}"
      timeout: 10

    project_service:
      enabled: true
      host: secflow-platform-project
      port: 80
      get_project_path: /api/project
      health_path: /api/project/health
      timeout: 10

    vuln_engine_service:
      enabled: true
      base_url: http://secflow-platform-vuln
      timeout: 30

    registry:
      enabled: false
      menu_service_url: http://secflow-platform-menu
      service_id: secflow-app-review-judgment
      service_name: 评审研判服务
      host: secflow-app-review-judgment
      port: 80
      maturity: 开发中
      description: 提供漏洞评审研判 CLI 调用与任务管理能力
      api_prefix: /api/review-judgment

    service:
      workspace_base_dir: /data/files
      public_api_prefix: /api/review-judgment
      admin_proxy_prefix: /api/review-judgment-admin-proxy

    scheduler:
      enabled: true
      role: api
      pod_namespace: secflow-ns

    logging:
      level: INFO