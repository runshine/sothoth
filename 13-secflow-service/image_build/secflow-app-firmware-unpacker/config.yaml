# Firmware Unpacker 配置文件

# 应用配置
app:
  host: "0.0.0.0"
  port: 8080
  debug: false

# 数据库配置（支持 mysql 和 sqlite）
database:
  type: "mysql"
  host: "mysql.sothothv2-ns.svc.cluster.local"
  port: 3306
  username: "secflow"
  password: "Huawei12#$"
  name: "secflow"
  table_prefix: "secflow_app_firmware_unpacker_"
  pool_size: 10
  max_overflow: 20
  path: "./firmware_unpacker.db"

# 认证服务配置
auth_service:
  enabled: true
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

# 项目服务配置
project_service:
  enabled: true
  host: "secflow-platform-project"
  port: 80
  get_project_path: "/api/project"
  timeout: 10

# 服务运行时配置
service:
  max_background_workers: 8
  task_retention_days: 7

# Worker 运行时配置
worker:
  heartbeat_interval_seconds: 15
  dead_threshold_seconds: 90
  claim_interval_seconds: 2
  claim_batch_size: 8

# 服务注册配置
registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secflow-app-firmware-unpacker"
  service_name: "固件解包服务"
  host: "secflow-app-firmware-unpacker"
  port: 80
  maturity: "开发中"
  description: "基于 pi coding agent 的固件自动解包服务"
  api_prefix: "/api/app/firmware-unpacker"
  unregister_on_shutdown: false
  heartbeat_interval_seconds: 30
  menu:
    id: "firmware-unpacker"
    path: "/firmware-unpacker"
    icon: "box"
    order: 20
    level1:
      name: "开发工具"
      name_en: "DevTools"
    level2:
      name: "逆向分析"
      name_en: "Reverse"
    level3:
      name: "固件解包"
      name_en: "Firmware Unpacker"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
