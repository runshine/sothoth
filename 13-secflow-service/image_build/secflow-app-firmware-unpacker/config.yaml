agentflow:
  profile: "production"
  runs_dir: "/data/files/.agentflow/runs"
  max_concurrent_runs: 2
  node_timeout_seconds: 1800
  use_worktree: false
  graph_optimization_enabled: false
  graph_optimizer: "codex"
  graph_optimization_rounds: 1
  evolution_archive_dir: ""
  cleanup_runs_retention_days: 7

database:
  type: "sqlite"
  path: "./firmware_unpacker.db"
  host: "localhost"
  port: 3306
  username: "root"
  password: ""
  name: "secflow"
  table_prefix: "secflow_app_firmware_unpacker_"
  pool_size: 10
  max_overflow: 20

auth_service:
  enabled: true
  host: "secflow-platform-auth"
  port: 80
  validate_token_path: "/api/auth/validate-token"
  service_machine_token: null
  timeout: 10
  token_cache_enabled: true
  token_cache_ttl_minutes: 15

project_service:
  enabled: true
  host: "secflow-platform-project"
  port: 80
  get_project_path: "/api/project"
  timeout: 10

configcenter_service:
  enabled: true
  base_url: "http://secflow-platform-configcenter/api/configcenter"
  timeout: 30

# 服务运行时配置
service:
  max_background_workers: 8
  task_retention_days: 7

# Worker 运行时配置
worker:
  heartbeat_interval_seconds: 30
  dead_threshold_seconds: 300
  claim_interval_seconds: 2
  claim_batch_size: 8

# 服务注册配置
registry:
  enabled: true
  menu_service_url: "http://secflow-platform-menu:80"
  service_id: "secflow-app-firmware-unpacker"
  service_name: "固件解包服务"
  host: "secflow-app-firmware-unpacker"
  port: 80
  maturity: "开发中"
  description: "基于 pi coding agent 的固件自动解包服务"
  api_prefix: "/api/app/firmware-unpacker"
  unregister_on_shutdown: false
  heartbeat_interval_seconds: 30
  menu:
    id: "firmware-unpacker"
    path: "/firmware-unpacker"
    icon: "box"
    order: 20
    level1:
      name: "开发工具"
      name_en: "DevTools"
    level2:
      name: "逆向分析"
      name_en: "Reverse"
    level3:
      name: "固件解包"
      name_en: "Firmware Unpacker"

app:
  host: "0.0.0.0"
  port: 8080
  debug: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
