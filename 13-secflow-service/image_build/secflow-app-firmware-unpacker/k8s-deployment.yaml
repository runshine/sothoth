apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-firmware-unpacker-api
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-app-firmware-unpacker
      component: api
  template:
    metadata:
      labels:
        name: secflow-app-firmware-unpacker
        component: api
    spec:
      serviceAccountName: secflow-app-firmware-unpacker-serviceaccount
      dnsPolicy: ClusterFirstWithHostNet
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              name: secflow-app-firmware-unpacker
              component: api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    name: secflow-app-firmware-unpacker
                    component: api
      containers:
        - name: secflow-app-firmware-unpacker
          image: ghcr.io/runshine/secflow-app-firmware-unpacker:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: FIRMWARE_UNPACKER_CONFIG
              value: /app/config.yaml
            - name: SECFLOW_PROBE_PORT
              value: "18080"
            - name: SECFLOW_MAIN_PID_FILE
              value: /tmp/secflow-main.pid
            - name: SECFLOW_MAIN_STARTED_AT_FILE
              value: /tmp/secflow-main.started_at
            - name: SECFLOW_PROBE_STARTUP_GRACE_SECONDS
              value: "30"
            - name: SECFLOW_PROBE_SERVICE_NAME
              value: secflow-app-firmware-unpacker
            - name: FIRMWARE_UNPACKER_RUNTIME_ROLE
              value: api
            - name: UNPACKER_AGENT_DIR
              value: /app/app/agent
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GUNICORN_THREADS
              value: "512"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_CPU_LIMIT_MILLICORES
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: limits.cpu
                  divisor: 1m
            - name: POD_MEMORY_LIMIT_MIB
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: limits.memory
                  divisor: 1Mi
            - name: POD_CPU_REQUEST_MILLICORES
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: requests.cpu
                  divisor: 1m
            - name: POD_MEMORY_REQUEST_MIB
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: requests.memory
                  divisor: 1Mi
          ports:
            - containerPort: 8080
            - containerPort: 18080
              name: probe
          volumeMounts:
            - name: secflow-app-firmware-unpacker-config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          startupProbe:
            httpGet:
              path: /startupz
              port: 18080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: secflow-app-firmware-unpacker-config
          configMap:
            name: secflow-app-firmware-unpacker-config
            items:
              - key: config.yaml
                path: config.yaml
---
