apiVersion: v1
kind: Service
metadata:
  name: secflow-menu
  namespace: secflow-ns
  labels:
    app: secflow-menu
spec:
  # ClusterIP 类型，仅集群内部访问
  type: ClusterIP
  selector:
    app: secflow-menu
  ports:
  - name: http
    protocol: TCP
    port: 5000
    targetPort: http
  # 连接超时配置
  sessionAffinity: None