# SecFlow Menu Service 配置文件

# 服务配置
host: "0.0.0.0"      # 服务监听地址
port: 10002           # 服务监听端口
debug: false         # 调试模式

# 心跳超时配置（秒）
heartbeat_timeout: 120.0
service_retention_seconds: 3600.0

# 清理过期服务间隔（秒）
cleanup_interval: 30

# Redis 共享状态配置。多副本部署时建议开启。
redis_enabled: true
redis_url: "redis://redis.sothothv2-ns.svc.cluster.local:6379/0"
redis_strict_mode: true
redis_key_prefix: "secflow:menu"

# 主动健康检查配置
health_scheduler_interval: 5
health_check_interval: 30
health_check_timeout: 2.0
health_failure_threshold: 2

# 统一网关地址。已注册服务若上报了 0.0.0.0 / 127.0.0.1，
# menu 将优先通过该地址 + api_prefix 生成健康检查 URL。
# service_gateway_url: "http://secflow.sothothv2.com"
# k8s_service_url: "http://secflow.sothothv2.com/api/k8s/platform/deployments"
service_gateway_url: "http://secflow.ai.icsl.huawei.com"
k8s_service_url: "http://secflow.ai.icsl.huawei.com/api/k8s/platform/deployments"
k8s_service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
k8s_service_namespace: "secflow-ns"
k8s_service_name_prefix: "secflow-"

# 日志配置
log_level: "INFO"
