apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-menu
  namespace: secflow-ns
  labels:
    app: secflow-menu
spec:
  # 多实例部署
  replicas: 2
  selector:
    matchLabels:
      app: secflow-menu
  # 滚动更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: secflow-menu
    spec:
      # 安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # 容器配置
      containers:
      - name: secflow-menu
        image: secflow-menu:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        # 健康检查
        livenessProbe:
          httpGet:
            path: /api/menu/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/menu/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # 资源限制
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # 挂载配置
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config-volume
        configMap:
          name: secflow-menu-config
      # 亲和性配置（可选）
      # 使用 pod 反亲和性分散到不同节点
      # affinity:
      #   podAntiAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #     - weight: 100
      #       podAffinityTerm:
      #         labelSelector:
      #           matchLabels:
      #             app: secflow-menu
      #         topologyKey: kubernetes.io/hostname
