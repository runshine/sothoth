apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-binary-to-source-worker
  namespace: secflow-ns
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 25%
  selector:
    matchLabels:
      name: secflow-app-binary-to-source-worker
  template:
    metadata:
      labels:
        name: secflow-app-binary-to-source-worker
    spec:
      serviceAccountName: secflow-app-binary-to-source-serviceaccount
      dnsPolicy: ClusterFirstWithHostNet
      topologySpreadConstraints:
      - maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            name: secflow-app-binary-to-source-worker
      containers:
      - name: secflow-app-binary-to-source-worker
        image: ghcr.io/runshine/secflow-app-binary-to-source:20260519-f1369fb
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
          - name: ROLE
            value: "worker"
          - name: WORKER_CONCURRENCY
            value: "4"
          - name: WORKER_POOL
            value: "prefork"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        volumeMounts:
        - name: secflow-app-binary-to-source-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secflow-platform-fileserver-data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "1024Mi"
            cpu: "2000m"
      volumes:
      - name: secflow-app-binary-to-source-config
        configMap:
          name: secflow-app-binary-to-source-config
          items:
            - key: config.yaml
              path: config.yaml
      - name: secflow-platform-fileserver-data
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
