apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-static-binary-nginx-config
  namespace: secflow-ns
data:
  config.yaml: |
    # SecFlow Static Binary Service Configuration
    # Database Configuration (MySQL)
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_"
      pool_size: 10
      max_overflow: 20
    # Auth Service Configuration
    auth_service:
      host: "secflow-platform-auth"
      port: 10000
      validate_token_path: "/api/auth/validate-human-token"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15
    # Menu Registration Center Configuration
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-static-binary"
      service_name: "静态二进制包服务"
      host: "0.0.0.0"
      port: 8080
      maturity: "已上线"
      description: "提供静态二进制软件包的上传、解析、存储、管理、校验和下载功能"
      api_prefix: "/api/static-binary"
      menu:
        id: "static-binary"
        path: "/static-binary"
        icon: "package"
        order: 4
        # 一级菜单
        level1:
          name: "资源管理"
          name_en: "Resources"
        # 二级菜单
        level2:
          name: "软件仓"
          name_en: "Software Repository"
        # 三级菜单（可选）
        level3:
          name: "静态二进制包"
          name_en: "Static Binary Packages"
    # Storage Configuration
    storage:
      root_dir: "/data"
      upload_folder: "/tmp/uploads"
      max_content_length: 2147483648  # 2GB
    # Application Configuration
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false
      secret_key: "your-secret-key-change-this-in-production"
    # Logging Configuration
    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
    
        # 定义上游API服务
        upstream api_backend {
            server 127.0.0.1:8080;
            keepalive 32;
        }
    
        # 日志格式
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"'
                        ' proxy_to: "$upstream_addr"';
    
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
    
        # 开启gzip压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
    
            # 修正：正确的指令名称是 client_max_body_size
            client_max_body_size 500m;
    
            # API请求代理到8080端口
            location /api/ {
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
    

                proxy_read_timeout 600s;  # 30分钟
                proxy_send_timeout 600s;
            
                # 文件上传可能需要更大的client body buffer
                client_max_body_size 2G;
                client_body_buffer_size 1M;
    
                # 关闭缓冲
                proxy_buffering on;
                proxy_request_buffering on;
            }
    
            # /packages 前缀提供静态文件服务
            location /packages/ {
                alias /data/;
                autoindex on;
    
                # 安全设置：防止目录遍历
                # internal;
    
                # 缓存设置
                expires 1h;
                add_header Cache-Control "public, immutable";
    
                # 安全头部
                add_header X-Content-Type-Options nosniff;
                add_header X-Frame-Options DENY;
                add_header X-XSS-Protection "1; mode=block";
    
                # 如果文件不存在返回404
                try_files $uri $uri/ =404;
            }
    
            # 处理React Router的路由问题（主应用）
            location / {
                try_files $uri $uri/ /index.html;
            }
    
            # 缓存静态资源
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
    
            # 禁止访问隐藏文件
            location ~ /\. {
                deny all;
            }
    
            # 健康检查端点
            location /healthz {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }