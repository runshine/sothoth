apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-entry-analyse-config
  namespace: secflow-ns
data:
  config.json: |
    {
      "max_rounds": 3,
      "min_rounds": 2,
      "pass_threshold": 1,
      "agent_max_retries": 100,
      "agent_retry_delay": 30,
      "pi_max_retries": -1,
      "pi_retry_delay": 5,
      "workers": {
        "default_tools": ["read", "bash", "edit", "write", "grep", "find"],
        "system_prompt_dir": "/app/prompts/workers",
        "default_thinking_level": "off",
        "agents": [
          {"model": "vllm/zai-org/GLM-5"}
        ]
      },
      "judges": {
        "default_tools": ["read", "bash", "grep", "find"],
        "system_prompt_dir": "/app/prompts/judges",
        "default_thinking_level": "off",
        "agents": [
          {"model": "vllm/zai-org/GLM-5"}
        ]
      },
      "output_dir": "/data/output",
      "archive_dir": "/data/output",
      "result_dir": "/data/output"
    }

  service.yaml: |
    # SecFlow App Entry Analyse Service Configuration
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_"
      pool_size: 10
      max_overflow: 20

    auth_service:
      host: "secflow-platform-auth"
      port: 80
      validate_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15

    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-app-entry-analyse"
      service_name: "入口分析服务"
      host: "secflow-app-entry-analyse"
      port: 80
      maturity: "已上线"
      description: "对二进制模块进行外部入口点分析，识别导出函数、系统调用、IPC及网络接口"
      api_prefix: "/api/app/entry-analyse"
      unregister_on_shutdown: false
      heartbeat_interval_seconds: 30
      menu:
        id: "app-entry-analyse"
        path: "/app/entry-analyse"
        icon: "scan-search"
        order: 104
        level1:
          name: "应用工具"
          name_en: "App Tools"
        level2:
          name: "入口分析"
          name_en: "Entry Analysis"
        level3:
          name: "模块入口"
          name_en: "Module Entry"

    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
