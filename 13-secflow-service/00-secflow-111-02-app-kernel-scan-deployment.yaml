apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-kernel-scan
  namespace: secflow-ns
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: secflow-app-kernel-scan
  template:
    metadata:
      labels:
        name: secflow-app-kernel-scan
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-kernel-scan-data
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/workspace/kernel"]
          volumeMounts:
            - name: secflow-app-kernel-scan-data-nfs-pvc
              mountPath: /data
      containers:
        - name: secflow-app-kernel-scan
          image: ghcr.io/runshine/secflow-app-kernel-scan:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: KERNEL_SCAN_CONFIG
              value: /app/config.yaml
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-app-kernel-scan-secret
                  key: ANTHROPIC_API_KEY
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: secflow-app-kernel-scan-secret
                  key: ANTHROPIC_BASE_URL
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: secflow-app-kernel-scan-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: secflow-app-kernel-scan-data-nfs-pvc
              mountPath: /var/lib/secflow-kernel-scan
            - name: secflow-app-kernel-scan-data-nfs-pvc
              mountPath: /workspace
              subPath: workspace
            - name: secflow-app-kernel-scan-data-nfs-pvc
              mountPath: /workspace/kernel
              subPath: workspace/kernel
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          readinessProbe:
            httpGet:
              path: /api/app/kernel-scan/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/app/kernel-scan/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: secflow-app-kernel-scan-config
          configMap:
            name: secflow-app-kernel-scan-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secflow-app-kernel-scan-data-nfs-pvc
          persistentVolumeClaim:
            claimName: secflow-app-kernel-scan-data-nfs-pvc
