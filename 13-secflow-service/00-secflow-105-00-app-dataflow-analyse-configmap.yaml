apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-dataflow-analyse-config
  namespace: secflow-ns
data:
  config.json: |
    {
      "max_rounds": 3,
      "min_rounds": 2,
      "pass_threshold": 1,
      "agent_max_retries": 100,
      "agent_retry_delay": 30,
      "pi_max_retries": -1,
      "pi_retry_delay": 10,
      "max_trace_depth": 5,
      "callee_concurrency": -1,
      "workers": {
        "default_tools": ["read", "bash", "edit", "write", "find"],
        "system_prompt_dir": "/opt/data_flow_analyse/prompts/workers",
        "default_thinking_level": "off",
        "agents": [
          {"model": "icsl_vllm_1/zai-org/GLM-5"}
        ]
      },
      "judges": {
        "default_tools": ["read", "bash", "find"],
        "system_prompt_dir": "/opt/data_flow_analyse/prompts/judges",
        "default_thinking_level": "off",
        "agents": [
          {"model": "icsl_vllm_1/zai-org/GLM-5"}
        ]
      },
      "output_dir": "/data/output",
      "archive_dir": "/data/output",
      "result_dir": "/data/output"
    }

  models.json: |
    {
      "providers": {
        "icsl_vllm_1": {
          "baseUrl": "http://172.31.29.10:8000/v1/",
          "api": "openai-completions",
          "apiKey": "1234",
          "models": [{"id": "zai-org/GLM-5", "reasoning": true}]
        },
        "icsl_vllm_2": {
          "baseUrl": "http://172.31.29.10:8003/v1/",
          "api": "openai-completions",
          "apiKey": "12345",
          "models": [{"id": "MiniMax/MiniMax-M2.5", "reasoning": true}]
        },
        "gptplus_glm": {
          "baseUrl": "https://az.gptplus5.com/v1",
          "api": "openai-completions",
          "apiKey": "sk-8zyyvaRQ6QlQzwONikzreTNlRqbLBokuUFH70Akk0AMTcF6y",
          "models": [{"id": "glm-5.1", "reasoning": true}]
        }
      }
    }

  service.yaml: |
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_"
      pool_size: 10
      max_overflow: 20

    auth_service:
      host: "secflow-platform-auth"
      port: 80
      validate_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15

    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-app-dataflow-analyse"
      service_name: "数据流安全分析服务"
      host: "secflow-app-dataflow-analyse"
      port: 80
      maturity: "已上线"
      description: "追踪程序中的污点传播路径，识别敏感数据流向危险函数的安全风险"
      api_prefix: "/api/app/dataflow-analyse"
      unregister_on_shutdown: false
      heartbeat_interval_seconds: 30
      menu:
        id: "app-dataflow-analyse"
        path: "/app/dataflow-analyse"
        icon: "git-branch"
        order: 105
        level1:
          name: "应用工具"
          name_en: "App Tools"
        level2:
          name: "数据流分析"
          name_en: "Dataflow Analysis"
        level3:
          name: "数据流追踪"
          name_en: "Dataflow Tracking"

    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
