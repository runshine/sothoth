apiVersion: v1
kind: ServiceAccount
metadata:
  name: secflow-app-binary-security
  namespace: secflow-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secflow-app-binary-security-metrics-discovery
  namespace: secflow-ns
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secflow-app-binary-security-metrics-discovery
  namespace: secflow-ns
subjects:
  - kind: ServiceAccount
    name: secflow-app-binary-security
    namespace: secflow-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secflow-app-binary-security-metrics-discovery
