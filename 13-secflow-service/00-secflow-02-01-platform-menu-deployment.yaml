apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-menu
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-platform-menu
  template:
    metadata:
      labels:
        name: secflow-platform-menu
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-platform-menu
        image: ghcr.io/runshine/secflow-platform-menu:latest  # 包含kubectl命令
        imagePullPolicy: Always
        command: ["python", "app.py", "--config", "/app/config.yaml"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-platform-menu-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/menu/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/menu/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30

      volumes:
      - name: secflow-platform-menu-config
        configMap:
          name: secflow-platform-menu-config
          items:
            - key: config.yaml
              path: config.yaml
