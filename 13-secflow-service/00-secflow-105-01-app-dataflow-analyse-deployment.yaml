apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-dataflow-analyse
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-app-dataflow-analyse
      role: api
  template:
    metadata:
      labels:
        name: secflow-app-dataflow-analyse
        role: api
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-app-dataflow-analyse
        image: ghcr.io/runshine/secflow-app-dataflow-analyse:latest
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
          - name: PORT
            value: "8080"
          - name: SERVICE_YAML
            value: /app/service.yaml
          - name: FILESERVER_ROOT
            value: /data/files
          - name: DFA_AGENT_TIMEOUT_SECONDS
            value: "900"
          - name: DFA_ROLE
            value: api
          - name: DFA_ENABLE_PUBLIC_API
            value: "true"
          - name: DFA_ENABLE_DISPATCHER
            value: "false"
          - name: DFA_ENABLE_EXECUTOR
            value: "false"
          - name: DFA_ENABLE_REGISTRY
            value: "true"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-dataflow-analyse-config
          mountPath: /app/service.yaml
          subPath: service.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "4Gi"
            cpu: "2"
        startupProbe:
          httpGet:
            path: /api/app/dataflow-analyse/health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 15
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /api/app/dataflow-analyse/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/app/dataflow-analyse/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 5
      volumes:
      - name: secflow-app-dataflow-analyse-config
        configMap:
          name: secflow-app-dataflow-analyse-config
          items:
            - key: service.yaml
              path: service.yaml
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
