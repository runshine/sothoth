apiVersion: v1
kind: ServiceAccount
metadata:
  name: secflow-platform-k8s-serviceaccount
  namespace: secflow-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secflow-platform-k8s-serviceaccount-role
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - namespaces/status
      - pods
      - pods/log
      - services
      - endpoints
      - secrets
      - configmaps
      - persistentvolumeclaims
      - events
      - nodes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - jobs/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secflow-platform-k8s-serviceaccount-binding
subjects:
  - kind: ServiceAccount
    name: secflow-platform-k8s-serviceaccount
    namespace: secflow-ns
roleRef:
  kind: ClusterRole
  name: secflow-platform-k8s-serviceaccount-role
  apiGroup: rbac.authorization.k8s.io
