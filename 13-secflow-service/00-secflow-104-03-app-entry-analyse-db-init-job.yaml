apiVersion: batch/v1
kind: Job
metadata:
  name: secflow-entry-analyse-db-init
  namespace: secflow-ns
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-init
          image: mysql:9.5.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mysqladmin ping -h mysql.sothothv2-ns.svc.cluster.local -u root -pHuawei12#\$ --silent; do
                echo "等待MySQL服务..."
                sleep 2
              done

              mysql -h mysql.sothothv2-ns.svc.cluster.local -u root -pHuawei12#\$ <<EOF

              -- ── 数据库 ──────────────────────────────────────────────────────
              CREATE DATABASE IF NOT EXISTS \`secflow_entry_analyse\`
                CHARACTER SET utf8mb4
                COLLATE utf8mb4_unicode_ci;

              -- ── 专属用户 ─────────────────────────────────────────────────────
              CREATE USER IF NOT EXISTS 'secflow_ea'@'%' IDENTIFIED BY 'Huawei12#\$';
              GRANT ALL PRIVILEGES ON \`secflow_entry_analyse\`.* TO 'secflow_ea'@'%';
              FLUSH PRIVILEGES;

              -- ── 表结构 ───────────────────────────────────────────────────────

              CREATE TABLE IF NOT EXISTS \`secflow_entry_analyse\`.\`secflow_app_ea_tasks\` (
                \`id\`                  int          NOT NULL AUTO_INCREMENT,
                \`task_id\`             varchar(64)  NOT NULL,
                \`project_id\`          varchar(100) NOT NULL,
                \`task_name\`           varchar(255) NOT NULL,
                \`task_description\`    text,
                \`input_path\`          varchar(1024) NOT NULL,
                \`output_path\`         varchar(1024),
                \`prompt_template_id\`  varchar(64),
                \`prompt_content\`      text NOT NULL,
                \`status\`              varchar(32)  NOT NULL DEFAULT 'pending',
                \`error\`               text,
                \`result_json\`         json,
                \`created_by\`          varchar(100),
                \`created_at\`          datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \`updated_at\`          datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                \`started_at\`          datetime,
                \`finished_at\`         datetime,
                \`is_deleted\`          tinyint(1) NOT NULL DEFAULT 0,
                PRIMARY KEY (\`id\`),
                UNIQUE KEY \`uq_task_id\`  (\`task_id\`),
                KEY \`ix_project\`        (\`project_id\`),
                KEY \`ix_status\`         (\`status\`),
                KEY \`ix_created\`        (\`created_at\`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE IF NOT EXISTS \`secflow_entry_analyse\`.\`secflow_app_ea_prompt_templates\` (
                \`id\`              int          NOT NULL AUTO_INCREMENT,
                \`prompt_id\`       varchar(64)  NOT NULL,
                \`name\`            varchar(255) NOT NULL,
                \`category\`        varchar(64)  NOT NULL DEFAULT 'general',
                \`description\`     text,
                \`content\`         text NOT NULL,
                \`variables_json\`  json,
                \`version\`         int NOT NULL DEFAULT 1,
                \`is_default\`      tinyint(1) NOT NULL DEFAULT 0,
                \`is_enabled\`      tinyint(1) NOT NULL DEFAULT 1,
                \`created_by\`      varchar(100),
                \`updated_by\`      varchar(100),
                \`created_at\`      datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \`updated_at\`      datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                \`is_deleted\`      tinyint(1) NOT NULL DEFAULT 0,
                PRIMARY KEY (\`id\`),
                UNIQUE KEY \`uq_prompt_id\` (\`prompt_id\`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE IF NOT EXISTS \`secflow_entry_analyse\`.\`secflow_app_ea_project_configs\` (
                \`id\`          int          NOT NULL AUTO_INCREMENT,
                \`project_id\`  varchar(100) NOT NULL,
                \`config_json\` json,
                \`updated_at\`  datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (\`id\`),
                UNIQUE KEY \`uq_project_id\` (\`project_id\`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE IF NOT EXISTS \`secflow_entry_analyse\`.\`secflow_app_ea_models_config\` (
                \`id\`          int         NOT NULL AUTO_INCREMENT,
                \`config_key\`  varchar(64) NOT NULL DEFAULT 'global',
                \`config_json\` json,
                \`updated_at\`  datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (\`id\`),
                UNIQUE KEY \`uq_config_key\` (\`config_key\`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              SELECT SCHEMA_NAME as 'database', '已创建' as status
              FROM information_schema.SCHEMATA
              WHERE SCHEMA_NAME = 'secflow_entry_analyse';
              EOF

              echo "entry_analyse 数据库初始化完成"
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MYSQL_PWD
              value: "Huawei12#$"
