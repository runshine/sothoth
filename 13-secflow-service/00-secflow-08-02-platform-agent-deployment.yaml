apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-agent
  namespace: secflow-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      name: secflow-platform-agent
  template:
    metadata:
      labels:
        name: secflow-platform-agent
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-platform-agent
        image: runshine0819/secflow-platform-agent:20260331
        imagePullPolicy: Always
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - /bin/sh
        - -c
        args:
        - exec python /app/app.py --config /app/config.json
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-platform-agent-config
          mountPath: /app/config.json
          subPath: config.json
        - name: secflow-platform-agent-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/agent/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/agent/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /api/agent/health
            port: 8080
            scheme: HTTP
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 18

      volumes:
      - name: secflow-platform-agent-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-agent-nfs-pvc  # 引用PVC
      - name: secflow-platform-agent-config
        configMap:
          name: secflow-platform-agent-config
          items:
            - key: config.json
              path: config.json
