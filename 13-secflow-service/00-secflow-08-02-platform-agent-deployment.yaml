apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-agent
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: secflow-platform-agent
  template:
    metadata:
      labels:
        name: secflow-platform-agent
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-platform-agent
        image: ghcr.io/runshine/secflow-platform-agent:latest  # 包含kubectl命令
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        args:
        - exec python /app/app.py --config /app/config.json
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-platform-agent-config
          mountPath: /app/config.json
          subPath: config.json
        - name: secflow-platform-agent-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/agent/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/agent/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30

      volumes:
      - name: secflow-platform-agent-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-agent-nfs-pvc  # 引用PVC
      - name: secflow-platform-agent-config
        configMap:
          name: secflow-platform-agent-config
          items:
            - key: config.json
              path: config.json
