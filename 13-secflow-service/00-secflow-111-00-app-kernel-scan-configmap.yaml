apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-kernel-scan-config
  namespace: secflow-ns
data:
  config.yaml: |
    # Single-PVC layout inside secflow-app-kernel-scan-data-nfs-pvc:
    # - PVC root -> /var/lib/secflow-kernel-scan
    # - PVC subdir workspace/ -> /workspace
    # The workspace/kernel subtree must contain the kernel source tree.
    title: "SecFlow Kernel Scan Service"
    database_url: "sqlite:////var/lib/secflow-kernel-scan/kernel-scan.db"
    state_root: "/var/lib/secflow-kernel-scan"
    kernel_dir: "/workspace/kernel"
    workspace_root: "/workspace"

    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    execution:
      mode: "claude_cli"
      claude_bin: "/usr/local/bin/claude"
      claude_model: "zai-org/GLM-5"
      entry_model: ""
      audit_model: ""
      poc_model: ""
      max_parallel_tasks: 10
      entry_threads: 4
      audit_threads: 4
      poc_threads: 2
      scheduler_tick_interval_seconds: 1.0
      heartbeat_interval_seconds: 5
      lease_duration_seconds: 30
      task_timeout_seconds: 14400
      cancel_check_interval_seconds: 1.0
      process_terminate_grace_seconds: 5.0
      mock_stage_delay_seconds: 0.0
