apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-firmware-unpacker
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: secflow-app-firmware-unpacker
  template:
    metadata:
      labels:
        name: secflow-app-firmware-unpacker
    spec:
      serviceAccountName: secflow-app-firmware-unpacker-serviceaccount
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: secflow-app-firmware-unpacker
          image: ghcr.io/runshine/secflow-app-firmware-unpacker:20260507
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: FIRMWARE_UNPACKER_CONFIG
              value: /app/config.yaml
            - name: UNPACKER_AGENT_DIR
              value: /app/app/agent
            - name: UNPACKER_ENGINE_MODE
              value: legacy
            - name: AGENTFLOW_RUNS_DIR
              value: /data/files/.agentflow/runs
            - name: AGENTFLOW_MAX_CONCURRENT_RUNS
              value: "2"
            - name: AGENTFLOW_FALLBACK_TO_LEGACY
              value: "true"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_CPU_LIMIT_MILLICORES
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: limits.cpu
                  divisor: 1m
            - name: POD_MEMORY_LIMIT_MIB
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: limits.memory
                  divisor: 1Mi
            - name: POD_CPU_REQUEST_MILLICORES
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: requests.cpu
                  divisor: 1m
            - name: POD_MEMORY_REQUEST_MIB
              valueFrom:
                resourceFieldRef:
                  containerName: secflow-app-firmware-unpacker
                  resource: requests.memory
                  divisor: 1Mi
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: secflow-app-firmware-unpacker-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: secflow-platform-fileserver-data-nfs-pvc
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/app/firmware-unpacker/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/app/firmware-unpacker/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: secflow-app-firmware-unpacker-config
          configMap:
            name: secflow-app-firmware-unpacker-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
