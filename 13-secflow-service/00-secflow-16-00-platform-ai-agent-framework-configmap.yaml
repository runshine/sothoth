apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-ai-agent-framework-config
  namespace: secflow-ns
data:
  config.yaml: |
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_aiwf_"
      pool_size: 10
      max_overflow: 20

    auth_service:
      enabled: true
      host: "secflow-platform-auth"
      port: 80
      validate_human_token_path: "/api/auth/validate-human-token"
      validate_machine_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10

    fileserver_service:
      enabled: true
      base_url: "http://secflow-platform-fileserver/api/fileserver"
      timeout: 10
      data_mount_path: "/data"
      project_files_dirname: "files"
      aiwf_subproject_name: "AI_AGENT_FRAMEWORK"

    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-platform-ai-agent-framework"
      service_name: "AI智能体工作流服务"
      host: "secflow-platform-ai-agent-framework"
      port: 80
      maturity: "开发中"
      description: "提供多智能体漏洞工作流定义、触发、执行和调度能力"
      api_prefix: "/api/ai-agent-framework"
      unregister_on_shutdown: false
      heartbeat_interval_seconds: 30
      menu:
        id: "ai-agent-framework"
        path: "/ai-agent-framework"
        icon: "workflow"
        order: 35
        level1_name: "漏洞分析"
        level2_name: "AI工作流"
        level3_name: ""

    service:
      workspace_base_dir: "/data/files"
      default_execution_timeout_seconds: 7200
      execution_cancel_check_interval_seconds: 1
      trigger_retry_limit: 3

    scheduler:
      enabled: true
      worker_capacity: 2
      poll_interval_seconds: 2
      heartbeat_interval_seconds: 5
      worker_timeout_seconds: 20
      lease_duration_seconds: 30
      cleanup_interval_seconds: 10

    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
