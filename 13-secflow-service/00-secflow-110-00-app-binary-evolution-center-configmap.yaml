apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-binary-evolution-center-config
  namespace: secflow-ns
data:
  config.yaml: |
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_binary_evolution_"
      pool_size: 10
      max_overflow: 20

    auth_service:
      enabled: true
      host: "secflow-platform-auth"
      port: 80
      validate_human_token_path: "/api/auth/validate-human-token"
      validate_machine_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10

    project_service:
      enabled: true
      host: "secflow-platform-project"
      port: 80
      get_project_path: "/api/project"
      health_path: "/api/project/health"
      timeout: 10

    fileserver_service:
      data_mount_path: "/data"
      project_files_dirname: "files"
      dataflow_subproject_name: "DATAFLOW_VULN_SCANNER"
      evolution_subproject_name: "secflow-app-binary-evolution-center"

    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu"
      service_id: "secflow-app-binary-evolution-center"
      service_name: "二进制安全进化中心"
      host: "secflow-app-binary-evolution-center"
      port: 80
      maturity: "开发中"
      description: "围绕数据流漏洞结果执行多轮智能体进化"
      api_prefix: "/api/app/binary-evolution"
      heartbeat_interval_seconds: 30
      menu:
        id: "binary-evolution-center"
        path: "/binary-evolution-center"
        icon: "sparkles"
        order: 35
        level1_name: "执行"
        level2_name: "二进制安全"
        level3_name: "进化中心"

    dataflow_vuln_service:
      base_url: "http://secflow-app-dataflow-vuln-scanner"
      api_prefix: "/api/dataflow-vuln-scanner"
      timeout: 60

    vuln_service:
      base_url: "http://secflow-platform-vuln"
      api_prefix: "/api/vuln"
      timeout: 60

    service:
      workspace_base_dir: "/data/files"
      public_api_prefix: "/api/app/binary-evolution"
      default_max_concurrent_tasks: 2
      default_max_concurrent_source_tasks: 4
      default_min_rounds: 1
      default_max_rounds: 3
      default_evolution_agent_model: "pi-agent"
      default_evolution_agent_timeout_seconds: 1800
      default_context_window: 131072
      preview_auto_expand_missing_cases: true

    scheduler:
      enabled: true
      worker_capacity: 1
      poll_interval_seconds: 2
      heartbeat_interval_seconds: 5
      worker_timeout_seconds: 300
      cleanup_interval_seconds: 10

    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
