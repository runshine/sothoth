apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-deploy-script-config
  namespace: secflow-ns
data:
  config.yaml: |
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false
    
    # File Root Directory Configuration
    file_root: "/app/resource"

    # File IO Configuration
    file_io:
      upload_chunk_bytes: 524288
      stream_chunk_bytes: 524288
      max_upload_bytes: 2147483648
    
    # Auth Service Configuration (call external auth service)
    auth_service:
      enabled: true
      host: "secflow-platform-auth"
      port: 80
      validate_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15
    
    # Menu Registration Center Configuration
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu"
      service_id: "secflow-platform-deploy-script"
      service_name: "部署脚本管理服务"
      host: "0.0.0.0"
      port: 80
      maturity: "已上线"
      description: "提供部署脚本的文件管理功能"
      api_prefix: "/api/deploy-script"
      menu:
        id: "deploy-script-manage"
        path: "/deploy-script"
        icon: "code"
        order: 10
        level1:
          name: "系统工具"
          name_en: "System Tools"
        level2:
          name: "部署脚本"
          name_en: "Deploy Scripts"
          
