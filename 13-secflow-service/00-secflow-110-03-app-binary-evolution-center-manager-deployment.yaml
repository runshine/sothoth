apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-binary-evolution-center-manager
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secflow-app-binary-evolution-center
      role: manager
  template:
    metadata:
      labels:
        app: secflow-app-binary-evolution-center
        role: manager
        name: secflow-app-binary-evolution-center-manager
    spec:
      serviceAccountName: secflow-app-binary-evolution-center-serviceaccount
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: secflow-app-binary-evolution-center-manager
          image: ghcr.io/runshine/secflow-app-binary-evolution-center:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: SECFLOW_BINARY_EVOLUTION_ROLE
              value: manager
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SECFLOW_BINARY_EVOLUTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secflow-app-binary-evolution-center-secret
                  key: db-password
            - name: SECFLOW_BINARY_EVOLUTION_SERVICE_MACHINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secflow-app-binary-evolution-center-secret
                  key: service-machine-token
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: secflow-app-binary-evolution-center-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: secflow-platform-fileserver-data-nfs-pvc
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /api/app/binary-evolution/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/app/binary-evolution/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: secflow-app-binary-evolution-center-config
          configMap:
            name: secflow-app-binary-evolution-center-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
