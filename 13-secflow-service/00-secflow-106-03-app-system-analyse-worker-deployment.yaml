apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-system-analyse-worker
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: secflow-app-system-analyse-worker
  template:
    metadata:
      labels:
        name: secflow-app-system-analyse-worker
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-app-system-analyse-worker
        image: ghcr.io/runshine/secflow-app-system-analyse:latest
        imagePullPolicy: Always
        env:
          - name: SECFLOW_SYSTEM_ANALYSE_ROLE
            value: worker
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: SECFLOW_SYSTEM_ANALYSE_WORKER_TASK_CONCURRENCY
            value: "1"
          - name: TZ
            value: Asia/Shanghai
          - name: PORT
            value: "8080"
          - name: FILESERVER_ROOT
            value: /data/files
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-app-system-analyse-config
          mountPath: /app/service.yaml
          subPath: service.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          mountPath: /data
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        livenessProbe:
          httpGet:
            path: /api/app/system-analyse/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 60
        readinessProbe:
          httpGet:
            path: /api/app/system-analyse/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
      volumes:
      - name: secflow-app-system-analyse-config
        configMap:
          name: secflow-app-system-analyse-config
          items:
            - key: service.yaml
              path: service.yaml
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
