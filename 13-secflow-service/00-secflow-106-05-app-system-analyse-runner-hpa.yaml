apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secflow-app-system-analyse-runner
  namespace: secflow-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secflow-app-system-analyse-runner
  minReplicas: 2
  maxReplicas: 16
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
