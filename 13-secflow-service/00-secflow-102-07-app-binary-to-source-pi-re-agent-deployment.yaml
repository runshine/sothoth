apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-pi-re-agent
  namespace: secflow-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      name: secflow-pi-re-agent
  template:
    metadata:
      labels:
        name: secflow-pi-re-agent
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-pi-re-agent
        image: ghcr.io/skiyer/pi-re-agent:sha-bd5f0f5
        imagePullPolicy: Always
        command: ["pi-re-server"]
        args: ["--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
        env:
          - name: TZ
            value: Asia/Shanghai
        - name: PI_RE_ALLOWED_DIRS
          value: "/data/files"
        - name: PI_MODELS_JSON
          value: "/root/.pi/agent/models.json"
        - name: PI_CODING_AGENT_DIR
          value: "/root/.pi/agent"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        volumeMounts:
        - name: secflow-platform-fileserver-data
          mountPath: /data
        - name: secflow-platform-fileserver-data
          mountPath: /root/.pi/agent
          subPath: pi-re-agent-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: secflow-platform-fileserver-data
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
