apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secflow-pi-re-agent
  namespace: secflow-ns
spec:
  serviceName: secflow-pi-re-agent-headless
  replicas: 5
  selector:
    matchLabels:
      name: secflow-pi-re-agent
  template:
    metadata:
      labels:
        name: secflow-pi-re-agent
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-pi-re-agent
        image: ghcr.io/skiyer/pi-re-agent:sha-1cbc3e9
        imagePullPolicy: Always
        command: ["pi-re-server"]
        args: ["--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: PI_RE_ALLOWED_DIRS
          value: "/data/files"
        - name: PI_RE_DATABASE_URL
          value: "mysql+pymysql://secflow:Huawei12%23%24@mysql.sothothv2-ns.svc.cluster.local:3306/secflow?charset=utf8mb4"
        - name: PI_RE_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PI_RE_MAX_CONCURRENT_JOBS
          value: "3"
        - name: PI_RE_LEASE_SECONDS
          value: "120"
        - name: PI_RE_HEARTBEAT_SECONDS
          value: "15"
        - name: PI_RE_STUCK_SCAN_SECONDS
          value: "30"
        - name: PI_RE_ACTIVE_SYNC_SECONDS
          value: "10"
        - name: PI_RE_MAX_JOB_ATTEMPTS
          value: "3"
        - name: PI_RE_QUEUE_LIMIT
          value: "200"
        - name: PI_MODELS_JSON
          value: "/root/.pi/agent/models.json"
        - name: PI_CODING_AGENT_DIR
          value: "/root/.pi/agent"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        volumeMounts:
        - name: secflow-platform-fileserver-data
          mountPath: /data
        - name: secflow-platform-fileserver-data
          mountPath: /root/.pi/agent
          subPath: pi-re-agent-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: secflow-platform-fileserver-data
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
