apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-system-analyse-config
  namespace: secflow-ns
data:
  config.json: |
    {
      "analyse_targets": ["binary", "script", "config"],
      "binary_arch": ["all"],
      "parallel_modules": 2,
      "parallel_sub_workers": 1,
      "agent_max_retries": 100,
      "agent_retry_delay": 30,
      "pi_max_retries": -1,
      "pi_retry_delay": 10,
      "stages": {
        "classify":    {"min_rounds": 1, "max_rounds": -1, "pass_mode": "all"},
        "refine":      {"min_rounds": 1, "max_rounds": -1, "pass_mode": "all"},
        "analyse":     {"min_rounds": 1, "max_rounds": -1, "pass_mode": "all"},
        "final_check": {"min_rounds": 1, "max_rounds": -1, "pass_mode": "all"}
      },
      "workers": {
        "default_tools": ["read", "bash", "edit", "write", "grep", "find"],
        "system_prompt_dir": "/app/prompts/workers",
        "default_thinking_level": "off",
        "agents": [
          {"model": "icsl_vllm_1/zai-org/GLM-5"}
        ],
        "stage_models": {
          "sub_read": "icsl_vllm_1/zai-org/GLM-5",
          "analyse":  "icsl_vllm_1/zai-org/GLM-5"
        }
      },
      "judges": {
        "default_tools": ["read", "bash", "grep", "find"],
        "system_prompt_dir": "/app/prompts/judges",
        "default_thinking_level": "off",
        "agents": [
          {"model": "icsl_vllm_1/zai-org/GLM-5"}
        ],
        "stage_models": {
          "analyse": "icsl_vllm_1/zai-org/GLM-5"
        }
      },
      "output_dir": "/data/output",
      "archive_dir": "/data/output",
      "result_dir": "/data/output"
    }

  models.json: |
    {
      "providers": {
        "icsl_vllm_1": {
          "baseUrl": "http://172.31.29.10:8000/v1/",
          "api": "openai-completions",
          "apiKey": "1234",
          "models": [{"id": "zai-org/GLM-5", "reasoning": true}]
        },
        "icsl_vllm_2": {
          "baseUrl": "http://172.31.29.10:8003/v1/",
          "api": "openai-completions",
          "apiKey": "12345",
          "models": [{"id": "MiniMax/MiniMax-M2.5", "reasoning": true}]
        },
        "gptplus_glm": {
          "baseUrl": "https://az.gptplus5.com/v1",
          "api": "openai-completions",
          "apiKey": "sk-8zyyvaRQ6QlQzwONikzreTNlRqbLBokuUFH70Akk0AMTcF6y",
          "models": [{"id": "glm-5.1", "reasoning": true}]
        },
        "gptplus_minimax": {
          "baseUrl": "https://az.gptplus5.com/v1",
          "api": "openai-completions",
          "apiKey": "sk-8zyyvaRQ6QlQzwONikzreTNlRqbLBokuUFH70Akk0AMTcF6y",
          "models": [{"id": "MiniMax-M2.7", "reasoning": true}]
        },
        "gptplus_openai": {
          "baseUrl": "https://az.gptplus5.com/v1",
          "api": "openai-completions",
          "apiKey": "sk-8zyyvaRQ6QlQzwONikzreTNlRqbLBokuUFH70Akk0AMTcF6y",
          "models": [{"id": "gpt-5.4", "reasoning": false}]
        }
      }
    }

  service.yaml: |
    # SecFlow App System Analyse Service Configuration
    # Database Configuration (MySQL)
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_"
      pool_size: 10
      max_overflow: 20

    # Auth Service Configuration
    auth_service:
      host: "secflow-platform-auth"
      port: 80
      validate_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15

    # Menu Registration Center Configuration
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-app-system-analyse"
      service_name: "二进制系统分析服务"
      host: "secflow-app-system-analyse"
      port: 80
      maturity: "已上线"
      description: "对固件解包后的二进制文件进行威胁分析、模块分类与安全检测"
      api_prefix: "/api/app/system-analyse"
      unregister_on_shutdown: false
      heartbeat_interval_seconds: 30
      menu:
        id: "app-system-analyse"
        path: "/app/system-analyse"
        icon: "scan-search"
        order: 103
        level1:
          name: "应用工具"
          name_en: "App Tools"
        level2:
          name: "系统分析"
          name_en: "System Analysis"
        level3:
          name: "二进制分析"
          name_en: "Binary Analysis"

    # Application Configuration
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    # Logging Configuration
    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
