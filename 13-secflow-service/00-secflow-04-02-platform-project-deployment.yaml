apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-platform-project
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: secflow-platform-project
  template:
    metadata:
      labels:
        name: secflow-platform-project
    spec:
      serviceAccountName: secflow-platform-project-serviceaccount
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: secflow-platform-project
        image: ghcr.io/runshine/secflow-platform-project:latest  # 包含kubectl命令
        imagePullPolicy: Always
        env:
          - name: TZ
            value: Asia/Shanghai
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: secflow-platform-project-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/project/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/project/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30

      volumes:
      - name: secflow-platform-project-config
        configMap:
          name: secflow-platform-project-config
          items:
            - key: config.yaml
              path: config.yaml
