apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secflow-app-dataflow-analyse
  namespace: secflow-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secflow-app-dataflow-analyse
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
