apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-binary-security-worker
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: secflow-app-binary-security
      role: worker
  template:
    metadata:
      labels:
        name: secflow-app-binary-security
        role: worker
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: secflow-app-binary-security-worker
          image: ghcr.io/runshine/secflow-app-binary-security:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SECFLOW_BINARY_SECURITY_CONFIG
              value: /app/config.yaml
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: SECFLOW_BINARY_SECURITY_ROLE
              value: worker
            - name: SECFLOW_BINARY_SECURITY_ENABLE_SCHEDULER
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: secflow-app-binary-security-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: secflow-platform-fileserver-data-nfs-pvc
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: secflow-app-binary-security-config
          configMap:
            name: secflow-app-binary-security-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
