apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-workflow-config
  namespace: secflow-ns
data:
  config.yaml: |
    # SecFlow Workflow 服务配置

    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_platform_workflow_"
      pool_size: 10
      max_overflow: 20

    auth_service:
      enabled: false  # 认证开关，设为false时跳过认证
      host: "secflow-platform-menu"
      port: 80
      validate_token_path: "/api/auth/validate-human-token"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15

    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-workflow"
      service_name: "工作流服务"
      host: "0.0.0.0"
      port: 80
      maturity: "开发中"
      description: "提供应用模板、任务模板和工作流编排管理"
      api_prefix: "/api/workflow"
      menu:
        id: "workflow-manage"
        path: "/workflow"
        icon: "workflow"
        order: 10

    k8s_service:
      enabled: true
      host: "secflow-platform-k8s"
      port: 80
      timeout: 30
      scheme: "http"

    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
