apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-workflow-config
  namespace: secflow-ns
data:
  config.yaml: |
    # SecFlow Workflow 服务配置

    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_platform_workflow_"
      pool_size: 10
      max_overflow: 20

    auth_service:
      enabled: true
      host: "secflow-platform-auth"
      port: 80
      validate_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15

    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-workflow"
      service_name: "工作流服务"
      host: "0.0.0.0"
      port: 80
      maturity: "开发中"
      description: "提供应用模板、任务模板和工作流编排管理"
      api_prefix: "/api/workflow"
      menu:
        id: "workflow-manage"
        path: "/workflow"
        icon: "workflow"
        order: 10

    k8s_service:
      enabled: true
      host: "secflow-platform-k8s"
      port: 80
      timeout: 30
      scheme: "http"

    workflow_status_service:
      enabled: true
      host: "secflow-platform-workflow-status"
      port: 80
      timeout: 30

    fileserver_service:
      enabled: true
      host: "secflow-platform-fileserver"
      port: 80
      timeout: 30
      project_mount_strategy: "nfs"
      project_mount_nfs_server: "172.31.30.81"
      project_mount_nfs_base_path: "/nvme/share_k8s/secflow-ns-secflow-platform-fileserver-data-nfs-pvc-pvc-64baa81c-80d0-4b69-91ca-a6a8d4f03292"

    app:
      host: "0.0.0.0"
      port: 8080
      debug: false

    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
