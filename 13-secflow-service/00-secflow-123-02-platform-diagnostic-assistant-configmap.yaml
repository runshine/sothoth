apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-diagnostic-assistant-config
  namespace: secflow-ns
data:
  service.yaml: |
    database:
      sqlite_path: /data/diagnostic-assistant/diagnostic_assistant.db

    auth_service:
      host: secflow-platform-auth
      port: 80
      validate_token_path: /api/auth/validate-token
      service_machine_token: ""
      timeout: 10

    configcenter_service:
      base_url: http://secflow-platform-configcenter/api/configcenter
      timeout: 30

    app:
      host: 0.0.0.0
      port: 8080
      debug: false
      default_provider_key: diagnostic_codex
      kubectl_timeout_seconds: 60
      max_command_output_bytes: 200000
      max_history_messages: 12
