apiVersion: batch/v1
kind: Job
metadata:
  name: secflow-database-init
  namespace: secflow-ns # run in default namespace(mysql)
spec:
  ttlSecondsAfterFinished: 60  # 完成后60秒自动删除
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-init
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:9.5.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 等待MySQL服务就绪
              until mysqladmin ping -h mysql.sothothv2-ns.svc.cluster.local -u root -pHuawei12#\$ --silent; do
                echo "等待MySQL服务..."
                sleep 2
              done
              
              # 执行SQL
              mysql -h mysql.sothothv2-ns.svc.cluster.local -u root -pHuawei12#\$ <<EOF
              -- 创建数据库（如果不存在）
              CREATE DATABASE IF NOT EXISTS \`secflow\`
              CHARACTER SET utf8mb4
              COLLATE utf8mb4_unicode_ci;
              
              -- 创建用户（如果不存在）
              CREATE USER IF NOT EXISTS 'secflow'@'%' IDENTIFIED BY 'Huawei12#\$';
              
              -- 授予权限
              GRANT ALL PRIVILEGES ON \`secflow\`.* TO 'secflow'@'%';
              
              -- 刷新权限
              FLUSH PRIVILEGES;

              -- secflow_app_sa_tasks
              CREATE TABLE IF NOT EXISTS \`secflow\`.\`secflow_app_sa_tasks\` (
                \`id\` int NOT NULL AUTO_INCREMENT,
                \`task_id\` varchar(64) NOT NULL,
                \`project_id\` varchar(100) NOT NULL,
                \`task_name\` varchar(255) NOT NULL,
                \`task_description\` text,
                \`input_path\` varchar(1024) NOT NULL,
                \`output_path\` varchar(1024),
                \`prompt_template_id\` varchar(64),
                \`prompt_content\` text NOT NULL,
                \`status\` varchar(32) NOT NULL DEFAULT 'pending',
                \`error\` text,
                \`result_json\` json,
                \`created_by\` varchar(100),
                \`created_at\` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \`updated_at\` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                \`started_at\` datetime,
                \`finished_at\` datetime,
                \`is_deleted\` tinyint(1) NOT NULL DEFAULT 0,
                PRIMARY KEY (\`id\`),
                UNIQUE KEY \`uq_task_id\` (\`task_id\`),
                KEY \`ix_project\` (\`project_id\`),
                KEY \`ix_status\` (\`status\`),
                KEY \`ix_created\` (\`created_at\`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              -- secflow_app_sa_prompt_templates
              CREATE TABLE IF NOT EXISTS \`secflow\`.\`secflow_app_sa_prompt_templates\` (
                \`id\` int NOT NULL AUTO_INCREMENT,
                \`prompt_id\` varchar(64) NOT NULL,
                \`name\` varchar(255) NOT NULL,
                \`category\` varchar(64) NOT NULL DEFAULT 'general',
                \`description\` text,
                \`content\` text NOT NULL,
                \`variables_json\` json,
                \`version\` int NOT NULL DEFAULT 1,
                \`is_default\` tinyint(1) NOT NULL DEFAULT 0,
                \`is_enabled\` tinyint(1) NOT NULL DEFAULT 1,
                \`created_by\` varchar(100),
                \`updated_by\` varchar(100),
                \`created_at\` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \`updated_at\` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                \`is_deleted\` tinyint(1) NOT NULL DEFAULT 0,
                PRIMARY KEY (\`id\`),
                UNIQUE KEY \`uq_prompt_id\` (\`prompt_id\`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              -- secflow_app_sa_project_configs
              CREATE TABLE IF NOT EXISTS \`secflow\`.\`secflow_app_sa_project_configs\` (
                \`id\` int NOT NULL AUTO_INCREMENT,
                \`project_id\` varchar(100) NOT NULL,
                \`config_json\` json,
                \`updated_at\` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                PRIMARY KEY (\`id\`),
                UNIQUE KEY \`uq_project_id\` (\`project_id\`)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              
              -- 验证结果
              SELECT '数据库状态:' as status, 
                    SCHEMA_NAME as database_name,
                    '已存在' as result
              FROM information_schema.SCHEMATA 
              WHERE SCHEMA_NAME = 'secflow'
              UNION ALL
              SELECT '用户状态:' as status,
                    CONCAT(user, '@', host) as user_info,
                    '已存在' as result
              FROM mysql.user 
              WHERE user = 'secflow' AND host = '%';
              EOF
              
              echo "初始化完成"
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MYSQL_PWD
              value: "Huawei12#$"
---
# 查看Job状态
# kubectl get job mysql-database-init
# kubectl logs job/mysql-database-init
