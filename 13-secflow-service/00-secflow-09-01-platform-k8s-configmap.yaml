apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-k8s-config
  namespace: secflow-ns
data:
  config.yaml: |
    # SecFlow K8S资源管理服务配置
    
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_platform_k8s_"
      pool_size: 10
      max_overflow: 20
    
    auth_service:
      enabled: true
      host: "secflow-platform-auth"
      port: 80
      validate_token_path: "/api/auth/validate-token"
      service_machine_token: "k7adi5IagKAZ54aNxS77NsDZSpWveyPn6iaxmrwl-G4LXnETGWMbEaSsX1KVuqh8"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15
    
    project_service:
      host: "secflow-platform-project"
      port: 80
      get_project_path: "/api/project"
      timeout: 10
    
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-k8s"
      service_name: "K8S资源管理服务"
      host: "0.0.0.0"
      port: 80
      maturity: "开发中"
      description: "提供Kubernetes资源的增删查改操作"
      api_prefix: "/api/k8s"
      menu:
        id: "k8s-manage"
        path: "/k8s"
        icon: "cloud"
        order: 10
    
    kubernetes:
      in_cluster: true
      connection_timeout: 30

    dynamic_ingress:
      enabled: true
      common_domain_suffix: "ai.icsl.huawei.com"
      default_domain_suffix: "ai.icsl.huawei.com"
      default_ingress_type: "nginx"
      default_path: "/"
      default_path_type: "Prefix"
      default_service_port: 80
      default_websocket_enabled: true
      default_tls_enabled: true
      default_tls_secret_name: "wildcard-secflow-tls"
      default_proxy_body_size: "32m"
      default_proxy_connect_timeout: 15
      default_proxy_send_timeout: 3600
      default_proxy_read_timeout: 3600
      default_ssl_redirect: true

    app:
      host: "0.0.0.0"
      port: 8080
      debug: false
    
    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
