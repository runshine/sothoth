apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-k8s-config
  namespace: secflow-ns
data:
  config.yaml: |
    # SecFlow K8S资源管理服务配置
    
    database:
      host: "mysql.sothothv2-ns.svc.cluster.local"
      port: 3306
      username: "secflow"
      password: "Huawei12#$"
      name: "secflow"
      table_prefix: "secflow_platform_k8s_"
      pool_size: 10
      max_overflow: 20
    
    auth_service:
      enabled: false  # 认证开关，设为false时跳过认证
      host: "secflow-platform-menu"
      port: 80
      validate_token_path: "/api/auth/validate-human-token"
      timeout: 10
      token_cache_enabled: true
      token_cache_ttl_minutes: 15
    
    project_service:
      host: "secflow-platform-project"
      port: 80
      get_project_path: "/api/project"
      timeout: 10
    
    registry:
      enabled: true
      menu_service_url: "http://secflow-platform-menu:80"
      service_id: "secflow-k8s"
      service_name: "K8S资源管理服务"
      host: "0.0.0.0"
      port: 80
      maturity: "开发中"
      description: "提供Kubernetes资源的增删查改操作"
      api_prefix: "/api/k8s"
      menu:
        id: "k8s-manage"
        path: "/k8s"
        icon: "cloud"
        order: 10
    
    kubernetes:
      in_cluster: true
      kubeconfig: "/home/runshine/.kube/config"
      connection_timeout: 30
    
    app:
      host: "0.0.0.0"
      port: 8080
      debug: false
    
    logging:
      level: "INFO"
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
