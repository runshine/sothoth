apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-entry-analyse-scheduler
  namespace: secflow-ns
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      name: secflow-app-entry-analyse-scheduler
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: secflow-app-entry-analyse-scheduler
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  name: secflow-app-entry-analyse-scheduler
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: TZ
          value: Asia/Shanghai
        - name: EA_RUNTIME_ROLE
          value: scheduler
        - name: EA_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: FILESERVER_ROOT
          value: /data/files
        - name: EA_TASK_LEASE_SECONDS
          value: '120'
        - name: EA_TASK_LEASE_RENEW_INTERVAL_SECONDS
          value: '30'
        - name: EA_TASK_CANCEL_POLL_INTERVAL_SECONDS
          value: '3'
        - name: EA_SCHEDULER_POLL_SECONDS
          value: '5'
        - name: EA_WORKER_POLL_SECONDS
          value: '5'
        - name: WORKER_ISOLATION_MODE
          value: none
        image: ghcr.io/runshine/secflow-app-entry-analyse:latest
        imagePullPolicy: Always
        name: secflow-app-entry-analyse-scheduler
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/service.yaml
          name: secflow-app-entry-analyse-config
          subPath: service.yaml
        - mountPath: /data
          name: secflow-platform-fileserver-data-nfs-pvc
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: service.yaml
            path: service.yaml
          name: secflow-app-entry-analyse-config
        name: secflow-app-entry-analyse-config
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
