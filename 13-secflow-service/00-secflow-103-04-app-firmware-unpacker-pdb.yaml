apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secflow-app-firmware-unpacker-api-pdb
  namespace: secflow-ns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      name: secflow-app-firmware-unpacker
      component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secflow-app-firmware-unpacker-dispatcher-pdb
  namespace: secflow-ns
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      name: secflow-app-firmware-unpacker
      component: dispatcher
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secflow-app-firmware-unpacker-cleanup-pdb
  namespace: secflow-ns
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      name: secflow-app-firmware-unpacker
      component: cleanup-worker
