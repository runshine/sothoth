apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-entry-analyse-worker
  namespace: secflow-ns
spec:
  replicas: 8
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      name: secflow-app-entry-analyse-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: secflow-app-entry-analyse-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  name: secflow-app-entry-analyse-worker
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: TZ
          value: Asia/Shanghai
        - name: PORT
          value: '3000'
        - name: EA_RUNTIME_ROLE
          value: worker
        - name: EA_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: FILESERVER_ROOT
          value: /data/files
        - name: EA_TASK_LEASE_SECONDS
          value: '120'
        - name: EA_TASK_LEASE_RENEW_INTERVAL_SECONDS
          value: '30'
        - name: EA_TASK_CANCEL_POLL_INTERVAL_SECONDS
          value: '3'
        - name: EA_SCHEDULER_POLL_SECONDS
          value: '5'
        - name: EA_WORKER_POLL_SECONDS
          value: '5'
        - name: WORKER_ISOLATION_MODE
          value: none
        - name: EA_POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        image: ghcr.io/runshine/secflow-app-entry-analyse:latest
        imagePullPolicy: Always
        name: secflow-app-entry-analyse-worker
        ports:
        - containerPort: 3000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /api/app/entry-analyse/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /api/app/entry-analyse/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 4Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/service.yaml
          name: secflow-app-entry-analyse-config
          subPath: service.yaml
        - mountPath: /data
          name: secflow-platform-fileserver-data-nfs-pvc
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            name: secflow-app-entry-analyse-worker
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: service.yaml
            path: service.yaml
          name: secflow-app-entry-analyse-config
        name: secflow-app-entry-analyse-config
      - name: secflow-platform-fileserver-data-nfs-pvc
        persistentVolumeClaim:
          claimName: secflow-platform-fileserver-data-nfs-pvc
