apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-app-dataflow-vuln-scanner-evolver-config
  namespace: secflow-ns
data:
  config.yaml: |
    dataflow_vuln_scanner:
      base_url: "http://secflow-app-dataflow-vuln-scanner"
      api_prefix: "/api/dataflow-vuln-scanner"
      timeout: 60

    vuln_service:
      base_url: "http://secflow-platform-vuln"
      api_prefix: "/api/vuln"
      timeout: 30

    auth:
      machine_token: "${SECFLOW_DATAFLOW_VULN_SCANNER_EVOLVER_SERVICE_MACHINE_TOKEN}"

    workspace:
      data_mount_path: "/data"
      project_files_dirname: "files"
      dataflow_subproject_name: "DATAFLOW_VULN_SCANNER"

    replay:
      max_concurrency: 4
      poll_interval_seconds: 5
      task_timeout_seconds: 7200
