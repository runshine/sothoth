apiVersion: apps/v1
kind: Deployment
metadata:
  name: secflow-app-binary-evolution-center-worker
  namespace: secflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secflow-app-binary-evolution-center
      role: worker
  template:
    metadata:
      labels:
        app: secflow-app-binary-evolution-center
        role: worker
        name: secflow-app-binary-evolution-center-worker
    spec:
      serviceAccountName: secflow-app-binary-evolution-center-serviceaccount
      dnsPolicy: ClusterFirstWithHostNet
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: secflow-app-binary-evolution-center
              role: worker
      containers:
        - name: secflow-app-binary-evolution-center-worker
          image: ghcr.io/runshine/secflow-app-binary-evolution-center:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: CONFIG_PATH
              value: /app/config.yaml
            - name: SECFLOW_BINARY_EVOLUTION_ROLE
              value: worker
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: secflow-app-binary-evolution-center-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: secflow-platform-fileserver-data-nfs-pvc
              mountPath: /data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /api/app/binary-evolution/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/app/binary-evolution/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: secflow-app-binary-evolution-center-config
          configMap:
            name: secflow-app-binary-evolution-center-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secflow-platform-fileserver-data-nfs-pvc
          persistentVolumeClaim:
            claimName: secflow-platform-fileserver-data-nfs-pvc
