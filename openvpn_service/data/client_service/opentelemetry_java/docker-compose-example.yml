name: 'opentelemetry_java_service'
services:
  opentelemetry_helper:
    image: runshine0819/opentelemetry_helper:latest
    restart: no
    container_name: opentelemetry_helper
    network_mode: host
    privileged: true
    pid: host
    cgroup: host
    environment:
      - TZ=Asia/Shanghai
      - SOTHOTH_DIR=${TARGET_DIR:-/sothothv2}
    command:
      - "/opt/source/start.sh"
      - "235706"
    volumes:
      - ./start.sh:/opt/source/start.sh
      - /:/host
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

