apiVersion: v1
kind: Service
metadata:
  name: static-binary-service
  namespace: sothothv2-ns
  annotations:
    metallb.io/allow-shared-ip: "shared-192.168.12.90"   # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    name: "static-binary-service"
  ports:
    - port: 8081
      targetPort: 80
      protocol: TCP
      name: static-binary-service
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内