# nginx-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-web-manager-nginx-config
  namespace: sothothv2-ns
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
    
        # 定义上游API服务
        upstream api_backend {
            server 127.0.0.1:8080;
            keepalive 32;
        }
    
        # 日志格式
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"'
                        ' proxy_to: "$upstream_addr"';
    
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
    
        # 开启gzip压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
    
            # 修正：正确的指令名称是 client_max_body_size
            client_max_body_size 500m;
    
            # API请求代理到8080端口
            location /api/ {
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
    

                proxy_read_timeout 600s;  # 30分钟
                proxy_send_timeout 600s;
            
                # 文件上传可能需要更大的client body buffer
                client_max_body_size 2G;
                client_body_buffer_size 1M;
    
                # 关闭缓冲
                proxy_buffering on;
                proxy_request_buffering on;
            }
          
            # 处理React Router的路由问题（主应用）
            location / {
                try_files $uri $uri/ /index.html;
            }
    
            # 缓存静态资源
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
    
            # 禁止访问隐藏文件
            location ~ /\. {
                deny all;
            }
    
            # 健康检查端点
            location /healthz {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
  config.yaml: |
    # vscode-web-manager 配置文件
    # 所有配置项从本文件读取
    
    # ============ 数据库配置 ============
    database:
      # 支持: sqlite, mysql
      type: "mysql"
      # SQLite文件路径
      sqlite_path: ""
      # MySQL连接字符串 (示例: mysql+pymysql://user:password@host/dbname)
      mysql_url: "mysql+pymysql://vscode-web-manager:Huawei12%23%24@mysql.sothothv2-ns.svc.cluster.local/vscode-web-manager?ssl=false"
    
    # ============ 安全配置 ============
    security:
      # JWT密钥，生产环境必须修改
      secret_key: "your-secret-key-change-in-production"
      # JWT算法
      algorithm: "HS256"
      # Token过期时间（分钟）
      access_token_expire_minutes: 60
    
    # ============ Kubernetes配置 ============
    kubernetes:
      # 是否在K8S集群内部运行
      in_k8s: true
      # API服务器地址 (集群外部运行时需要设置)
      api_url: ""
      # API Token (可选，用于集群外部认证）
      api_token: ""
      # 命名空间
      namespace: "vscode"
      # 存储类
      storage_class: "nfs-storage-192.168.13.66"
      # 服务类型: ClusterIP, NodePort, LoadBalancer
      service_type: "ClusterIP"
      # 服务端口
      service_port: 80
      # Code-Server镜像
      code_server_image: "lubcorzexc/deepsight-codeserver"
      # Code-Server镜像拉取策略: Always(每次都拉取), IfNotPresent(本地不存在时拉取), Never(从不拉取)
      code_server_pull_policy: "Always"
      # CodeWiki镜像
      codewiki_image: "ghcr.io/runshine/codewiki:latest"
      codewiki_container_port: 8080
      codewiki_service_port: 8080
      # CodeWiki镜像拉取策略: Always(每次都拉取), IfNotPresent(本地不存在时拉取), Never(从不拉取)
      codewiki_pull_policy: "Always"
      # 默认存储大小
      default_storage_size: "40Gi"
    
    # ============ HTTP配置 ============
    http:
      # 外部访问地址
      external_access_url: "http://vscode-web-manager.sothothv2-ns.svc.cluster.local"
      # 归档下载Token
      archive_download_token: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      # 归档下载超时（秒）
      archive_download_timeout: 3600
    # ============ VSCODE Ingress 配置 ============
    vscode:
      # Code-Server Ingress 域名后缀
      ingress_domain: "code-server.sothothv2.com"
      
    # ============ 文件存储配置 ============
    storage:
      # 基础目录
      base_dir: "/data"
      # 上传目录
      upload_dir: "uploads"
      # 归档目录
      archive_dir: "archives"
      # 项目目录
      projects_dir: "projects"
      # 下载目录
      downloads_dir: "downloads"
      # 任务日志目录
      task_log_dir: "task_logs"
      # 最大文件大小（MB）
      max_file_size_mb: 10240
      # 最大下载大小（MB）
      max_download_size_mb: 10240
    
    # ============ CodeWiki 配置 ============
    # 用于Claude API认证和模型配置
    codewiki:
      # Claude API密钥（必需）
      api_key: "sk-u8yhUikiUX1tyQlG7Zt7T6DLqPbIbRMx6N1k1eQGbdDH72pw"
      # API基础URL（必需）
      base_url: "http://192.168.12.90:3000"
      # 主模型（用于日常代码分析和对话）
      main_model: "minimax/minimax-m2.1"
      # 集群模型（用于大规模代码库分析）
      cluster_model: "minimax/minimax-m2.1"
      # 降级模型（主模型不可用时的备选）
      fallback_model: "minimax/minimax-m2.1"
    
    # ============ 动态环境变量配置 ============
    # 这些环境变量会被注入到 code-server 和 codewiki 的 Pod 中
    # 每个服务的环境变量是独立的，通过服务名称区分
    # 格式：环境变量名: 值
    dynamic_env:
      # 注入到所有服务的公共环境变量
      global:
        # 示例：自定义时区
        TZ: "Asia/Shanghai"
        # 示例：日志级别
        LOG_LEVEL: "info"
    
      # 注入到 code-server 的环境变量
      code_server:
        # 示例：自定义代码服务器配置
        # CUSTOM_CODE_SERVER_VAR: "custom-value"
        # 示例：启用某些特性
        ANTHROPIC_BASE_URL: "http://192.168.12.90:3000"
        ANTHROPIC_AUTH_TOKEN: "sk-u8yhUikiUX1tyQlG7Zt7T6DLqPbIbRMx6N1k1eQGbdDH72pw"
        ANTHROPIC_MODEL: "minimax/minimax-m2.1"
    
      # 注入到 codewiki 的环境变量
      codewiki:
        ANTHROPIC_BASE_URL: "http://192.168.12.90:3000"
        ANTHROPIC_AUTH_TOKEN: "sk-u8yhUikiUX1tyQlG7Zt7T6DLqPbIbRMx6N1k1eQGbdDH72pw"
        ANTHROPIC_MODEL: "minimax/minimax-m2.1"
    
    # ============ 调试配置 ============
    debug: false