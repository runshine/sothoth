apiVersion: batch/v1
kind: Job
metadata:
  name: vscode-web-manager-database-init
  namespace: sothothv2-ns # run in default namespace(mysql)
spec:
  ttlSecondsAfterFinished: 60  # 完成后60秒自动删除
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-init
          image: mysql:9.5.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 等待MySQL服务就绪
              until mysqladmin ping -h mysql -u root -pHuawei12#\$ --silent; do
                echo "等待MySQL服务..."
                sleep 2
              done
              
              # 执行SQL
              mysql -h mysql -u root -pHuawei12#\$ <<EOF
              -- 创建数据库（如果不存在）
              CREATE DATABASE IF NOT EXISTS \`vscode-web-manager\`
              CHARACTER SET utf8mb4
              COLLATE utf8mb4_unicode_ci;
              
              -- 创建用户（如果不存在）
              CREATE USER IF NOT EXISTS 'vscode-web-manager'@'%' IDENTIFIED BY 'Huawei12#\$';
              
              -- 授予权限
              GRANT ALL PRIVILEGES ON \`vscode-web-manager\`.* TO 'vscode-web-manager'@'%';
              
              -- 刷新权限
              FLUSH PRIVILEGES;
              
              -- 验证结果
              SELECT '数据库状态:' as status, 
                    SCHEMA_NAME as database_name,
                    '已存在' as result
              FROM information_schema.SCHEMATA 
              WHERE SCHEMA_NAME = 'vscode-web-manager'
              UNION ALL
              SELECT '用户状态:' as status,
                    CONCAT(user, '@', host) as user_info,
                    '已存在' as result
              FROM mysql.user 
              WHERE user = 'vscode-web-manager' AND host = '%';
              EOF
              
              echo "初始化完成"
          env:
            - name: MYSQL_PWD
              value: "Huawei12#$"
---
# 查看Job状态
# kubectl get job mysql-database-init
# kubectl logs job/mysql-database-init