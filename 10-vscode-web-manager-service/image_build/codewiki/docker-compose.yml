# docker-compose.yml
version: '3.8'

services:
  codewiki-api:
    build: .
    container_name: codewiki-api
    ports:
      - "8000:8000"
    volumes:
      - ./config/workspace:/config/workspace
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/codewiki.db
      - LOG_LEVEL=INFO
      - WORKSPACE_DIR=/config/workspace
      - ROOT_PATH=/codewiki  # 添加ROOT_PATH环境变量
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s