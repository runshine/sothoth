apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaiasec-ingress
  namespace: sothoth
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "backend-server"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - gaiasec.sothothv2.com
    secretName: wildcard-sothothv2.com-tls
  rules:
  - host: gaiasec.sothothv2.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-server
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend-server
            port:
              number: 80
      - path: /plugins
        pathType: Prefix
        backend:
          service:
            name: backend-server
            port:
              number: 80
      - path: /assets
        pathType: Prefix
        backend:
          service:
            name: frontend-server
            port:
              number: 80
      - path: /
        pathType: Exact
        backend:
          service:
            name: frontend-server
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-server
            port:
              number: 80
