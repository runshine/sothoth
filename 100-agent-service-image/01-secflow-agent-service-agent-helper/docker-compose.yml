name: secflow-agent-service-agent-helper
services:
  agent-helper:
    # 镜像由 GitHub Actions 自动构建并推送到 GitHub Container Registry
    # 标签策略: latest (最新版) 或 YYYYMMDD (日期标签，如 20260317)
    image: ghcr.io/runshine/secflow-agent-service-agent-helper:latest
    container_name: remote-command-api
    privileged: true  # 特权容器
    restart: always

    # 环境变量配置
    environment:
      - TIMEOUT=180
      - REST_PORT=20001
      - TTYD_PORT=20002
      - WORKDIR=/app
      - AGENT_HELPER_STATE_DIR=/app/data
      - AGENT_DEFAULT_BACKEND=claude
      - AGENT_BACKEND_INVOKE_TIMEOUT_SEC=300
      - AGENT_BACKEND_IDLE_TIMEOUT_SEC=1800
      - AGENT_HOUSEKEEPING_INTERVAL_SEC=30
      - AGENT_HEALTH_CACHE_TTL_SEC=3600
      - DISABLE_TELEMETRY=true
      - DISABLE_COST_WARNINGS=true
      - API_TIMEOUT_MS=600000
      - ALLOWED_COMMANDS=  # 留空表示允许所有（生产环境建议设置）
      - NO_PROXY=172.31.29.10
      - ANTHROPIC_BASE_URL=http://172.31.29.10:3456
      - ANTHROPIC_AUTH_TOKEN=sk-12345678
      - CLAUDE_CODE_USE_BEDROCK=
      - CODE_SERVER_PORT=20003
      - PROCESS_MONITOR_PORT=20004
      # OpenClaw 网关注入配置；如有需要可由部署系统覆盖
      - OPENCLAW_STATE_DIR=/app/data/openclaw
      - OPENCLAW_CONFIG_PATH=/app/data/openclaw/openclaw.json
      - OPENCLAW_GATEWAY_PORT=20005
      - OPENCLAW_WORKSPACE_DIR=/host
      - OPENCLAW_GATEWAY_PASSWORD=Huawei12#$  # 可由外部注入覆盖
      - PROCESS_MONITOR_INTERVAL_SEC=15
      - HOST_ROOT=/host
      - PROCESS_MONITOR_PROC_ROOT=/host/proc
      - CODE_SERVER_PASSWORD=your-password-here  # 建议设置固定密码，留空则自动生成
      - DNS_SERVER=10.96.0.10

    # 端口映射
    ports:
      - "20001:20001"
      - "20002:20002"
      - "20003:20003"
      - "20004:20004"
    # 卷挂载 - 主机目录只读挂载
    volumes:
      # 主机根目录只读挂载
      - /:/host:ro
      # LLM Provider 配置文件目录需可写（用于动态更新 Codex/Claude 等配置）
      - /root/.codex:/root/.codex:rw

      # 核心调试目录（保持与主机一致）
      - /proc:/proc:rw
      - /sys:/sys:rw
      - /dev:/dev:rw

      # 临时目录
      - /tmp:/tmp:rw
      - ./data:/app/data

    # 内核能力
    cap_add:
      - SYS_PTRACE  # 允许ptrace调试
      - SYS_ADMIN   # 系统管理权限
      - NET_ADMIN   # 网络管理权限
      - IPC_LOCK    # IPC锁定

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

    # 安全选项（允许调试）
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined

    # 共享命名空间（除挂载命名空间外）
    pid: host  # 共享PID命名空间
    network_mode: host  # 共享网络命名空间（可选）
    ipc: host  # 共享IPC命名空间
