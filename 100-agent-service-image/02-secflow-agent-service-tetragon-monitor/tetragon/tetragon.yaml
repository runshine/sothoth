bpf-lib: /var/lib/tetragon/
btf:
config-dir:
tracing-policy:
debug: false
disable-kprobe-multi: false
enable-export-aggregation: false
enable-k8s-api: false
enable-ancestors: ""
enable-process-cred: true
enable-process-ns: true
event-queue-size: 10000
export-aggregation-buffer-size: 10000
export-aggregation-window-size: 15s
export-allowlist:
export-denylist:
export-file-compress: false
export-file-max-backups: 5
export-file-max-size-mb: 10
export-file-rotation-interval: 0s
export-filename:
export-rate-limit: -1
field-filters:
force-small-progs: false
gops-address:
kernel:
log-format: text
log-level: info
metrics-server:
metrics-label-filter:
netns-dir:
pprof-address:
process-cache-size: 65536
procfs: /host/proc/
rb-size: 0
rb-size-total: 0
release-pinned-bpf: false
server-address: localhost:54321
verbose: 0
# gRPC 服务器配置（使用 UDS）
grpc:
  address: "unix:///var/run/tetragon/tetragon.sock"
  max-msg-size: 4194304
  # 健康检查
  health:
    enabled: true
  # 反射服务
  reflection: true