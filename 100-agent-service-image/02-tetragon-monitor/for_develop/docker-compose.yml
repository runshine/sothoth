name: 'tetragon_service'
services:
  tetragon:
    image: quay.io/cilium/tetragon:v1.6.0
    restart: always
    container_name: tetragon
    network_mode: host
    privileged: true
    pid: host
    cgroup: host
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../tetragon:/etc/tetragon
      - ../tracing-policy:/etc/tracing-policy:ro

      - /:/host:ro,rprivate,rslave
      - /var/run/tetragon:/var/run/tetragon
      - /lib/modules:/lib/modules:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /boot:/boot:ro
      - /dev:/dev:ro
      - /sys/kernel/btf/vmlinux:/var/lib/tetragon/btf:ro
    command:
      - "/usr/bin/tetragon"
      - "--server-address=unix:///var/run/tetragon/tetragon.sock"
      - "--tracing-policy-dir=/etc/tracing-policy"
      - "--procfs=/host/proc"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "1"

