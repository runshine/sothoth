apiVersion: v1
kind: Service
metadata:
  name: openvpn-udp-vpn-access-service
  namespace: sothothv2-ns
  annotations:
    metallb.universe.tf/allow-shared-ip: "true"  # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    app: openvpn-udp-vpn-access
  ports:
    - port: 11194
      targetPort: 11194
      protocol: UDP
  # 关键：在spec中指定loadBalancerIP
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内

---
apiVersion: v1
kind: Service
metadata:
  name: openvpn-tcp-vpn-access-service
  namespace: sothothv2-ns
  annotations:
    metallb.universe.tf/allow-shared-ip: "true"  # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    app: openvpn-tcp-vpn-access
  ports:
    - port: 11194
      targetPort: 11194
      protocol: TCP
  # 关键：在spec中指定loadBalancerIP
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内