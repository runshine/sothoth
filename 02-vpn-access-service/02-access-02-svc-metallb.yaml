apiVersion: v1
kind: Service
metadata:
  name: secflow-platform-access-nginx-config
  namespace: sothothv2-ns
  annotations:
    metallb.io/allow-shared-ip: "shared-192.168.12.90"   # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    app: "secflow-platform-access"
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: secflow-platform-access
  loadBalancerIP: "172.31.30.100"  # 必须在static-ips-pool范围内