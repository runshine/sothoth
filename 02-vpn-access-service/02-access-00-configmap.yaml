apiVersion: v1
kind: ConfigMap
metadata:
  name: secflow-platform-access-nginx-config
  namespace: sothothv2-ns
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log;
    pid /run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

      access_log /var/log/nginx/access_out.log main;
      error_log /var/log/nginx/error_out.log warn;

      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;

      # 客户端请求体最大大小
      client_max_body_size 500m;

      # 代理缓冲区设置
      proxy_buffer_size 1M;
      proxy_buffers 16 1M;
      proxy_busy_buffers_size 1M;

      upstream secflow-platform-static-binary-backend {
        server secflow-platform-static-binary.secflow-ns.svc.cluster.local:80;
      }

      upstream secflow-platform-deploy-script-backend {
        server secflow-platform-deploy-script.secflow-ns.svc.cluster.local:80;
      }

      server {
        listen 80;
        server_name _;

        # /packages 路由
        location /packages {
          proxy_pass http://secflow-platform-static-binary-backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
    
          # 超时设置
          proxy_connect_timeout 600s;
          proxy_send_timeout 600s;
          proxy_read_timeout 600s;
        }

        # /script 路由
        location /script {
          proxy_pass http://secflow-platform-deploy-script-backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
    
          # 超时设置
          proxy_connect_timeout 600s;
          proxy_send_timeout 600s;
          proxy_read_timeout 600s;
        }
          # 健康检查端点
        location /healthz {
          access_log off;
          return 200 "healthy\n";
          add_header Content-Type text/plain;
        }
      }
    }