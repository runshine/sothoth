# vpn-monitor-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vpn-monitor
  namespace: sothothv2-ns
spec:
  selector:
    matchLabels:
      name: vpn-monitor
  template:
    metadata:
      labels:
        name: vpn-monitor
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: vpn-monitor
      containers:
        - name: monitor
          image: ghcr.io/runshine/vpn-monitor:latest
          command: ["/monitor.sh"]
          volumeMounts:
            - name: monitor-script
              mountPath: /monitor.sh
              subPath: monitor.sh
            - name: config
              mountPath: /config
            - name: k3s-containerd
              mountPath: /run/containerd/containerd.sock
          securityContext:
            privileged: true  # 需要特权来访问网络命名空间
      volumes:
        - name: monitor-script
          configMap:
            name: vpn-monitor-script
            defaultMode: 0555
        - name: config
          emptyDir: {}
        - name: k3s-containerd
          hostPath:
            path: /run/k3s/containerd/containerd.sock