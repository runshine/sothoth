apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: binary-ingress
  namespace: sothothv2-ns
  annotations:
    # 如果是nginx-ingress，可以使用这些注解
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx  # 根据您的Ingress Controller调整
  rules:
    - http:
        paths:
          - path: /utils
            pathType: Prefix
            backend:
              service:
                name: static-binary-service
                port:
                  number: 80
          - path: /download
            pathType: Prefix
            backend:
              service:
                name: static-binary-service
                port:
                  number: 8080

