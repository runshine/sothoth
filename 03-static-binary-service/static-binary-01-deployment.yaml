# vpn-monitor-daemonset.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-binary-service
  namespace: sothothv2-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      name: static-binary-service
  template:
    metadata:
      labels:
        name: static-binary-service
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: static-binary
        image: ghcr.io/runshine/static-binary-server:latest  # 包含kubectl命令
        ports:
        - containerPort: 80
        volumeMounts:
        - name: shared-file-storage
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

      - name: nginx
        image: nginx:alpine
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: shared-file-storage
            mountPath: /usr/share/nginx/html/shared-files
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

      volumes:
      - name: shared-file-storage
        persistentVolumeClaim:
          claimName: sothothv2-static-binary-service-nfs-pvc  # 引用PVC
      - name: nginx-config
        configMap:
          name: static-binary-service-nginx-config
          items:
            - key: default.conf
              path: default.conf
