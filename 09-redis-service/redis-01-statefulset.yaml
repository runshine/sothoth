apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-service
  namespace: sothothv2-ns
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis-service
  minReadySeconds: 1
  template:
    metadata:
      labels:
        app: redis-service
    spec:
      # 容器定义
      containers:
        # tcp容器
        - name: redis-service
          image: redis:8.4.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: server
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "500m"
          volumeMounts:
            - name: redis-local-path-pvc
              mountPath: /data
          livenessProbe:
            exec:
              command:  ["redis-cli", "info", "|", "grep loading:", "|", "grep 0"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:  ["redis-cli", "info", "|", "grep loading:", "|", "grep 0"]
            initialDelaySeconds: 60
            periodSeconds: 30

      # 卷定义
      volumes:
        - name: redis-local-path-pvc
          persistentVolumeClaim:
            claimName: redis-local-path-pvc  # 引用PVC