apiVersion: v1
kind: Service
metadata:
  name: mysql-cluster-service
  namespace: default
  annotations:
    metallb.universe.tf/allow-shared-ip: "true"  # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    component: mysqlrouter
    mysql.oracle.com/cluster: mysql-cluster
    tier: mysql
  ports:
    - port: 3306
      targetPort: 6446
      protocol: TCP
  # 关键：在spec中指定loadBalancerIP
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内