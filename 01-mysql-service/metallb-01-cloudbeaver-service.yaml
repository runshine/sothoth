apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver-service
  namespace: default
  annotations:
    metallb.universe.tf/allow-shared-ip: "true"  # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    name: cloudbeaver
  ports:
    - port: 8978
      targetPort: 8978
      protocol: TCP
      name: web-cosole
  # 关键：在spec中指定loadBalancerIP
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内