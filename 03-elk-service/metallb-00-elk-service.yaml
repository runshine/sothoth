apiVersion: v1
kind: Service
metadata:
  name: elk-kibana
  namespace: sothothv2-ns
  annotations:
    metallb.io/allow-shared-ip: "shared-192.168.12.90"   # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    common.k8s.elastic.co/type: "kibana"
    kibana.k8s.elastic.co/name: "kibana"
  ports:
    - port: 5601
      targetPort: 5601
      protocol: TCP
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内

---
apiVersion: v1
kind: Service
metadata:
  name: elk-elasticsearch
  namespace: sothothv2-ns
  annotations:
    metallb.io/allow-shared-ip: "shared-192.168.12.90"   # 可选：允许IP共享
spec:
  type: LoadBalancer
  selector:
    common.k8s.elastic.co/type: "elasticsearch"
    elasticsearch.k8s.elastic.co/cluster-name: "elasticsearch"
    elasticsearch.k8s.elastic.co/statefulset-name: "elasticsearch-es-elasticsearch"
  ports:
    - port: 9200
      targetPort: 9200
      protocol: TCP
  loadBalancerIP: "192.168.12.90"  # 必须在static-ips-pool范围内